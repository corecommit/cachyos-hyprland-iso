name: Build CachyOS Hyprland ISO

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "CachyOS-Live-ISO commit SHA/branch/tag (empty = UPSTREAM_PIN below, else default branch)"
        required: false
        default: ""
      keep_installer:
        description: "Keep the CachyOS installer(s) in the ISO"
        type: boolean
        default: true
      version:
        description: "Version as major.minor.patch (used in the ISO file name and the release tag)"
        type: string
        default: "1.0.0"
      release:
        description: "Publish the ISO to a GitHub Release (tag pushes always release)"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
  push:
    tags:
      - 'cachyos-v*'

# One build per ref at a time; tag (release) builds are never cancelled.
concurrency:
  group: cachyos-hyprland-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Paste a commit SHA from CachyOS/CachyOS-Live-ISO here to pin the upstream.
  # Empty = default branch. The clone step logs the SHA it used, so copy it
  # from a good run's log into this line.
  UPSTREAM_PIN: ""

jobs:
  build-cachyos-hyprland:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write   # needed by the release step
    container:
      image: archlinux:base-devel
      # The -v mounts expose big preinstalled host toolchains so the
      # "Free host disk space" step can delete them.
      options: >-
        --privileged
        -v /usr/local/lib/android:/host/android
        -v /usr/share/dotnet:/host/dotnet

    steps:
      - name: Resolve version and release settings
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            # Tag push such as cachyos-v1.2.3: version comes from the tag, always release.
            version="${REF_NAME#cachyos-v}"
            release=true
            tag="$REF_NAME"
          else
            version="${IN_VERSION:-}"
            release="${IN_RELEASE:-false}"
            tag="v${version}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Version '$version' is not major.minor.patch (for example 1.2.3)." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "tag=$tag"
            echo "iso_name=cachyos-hyprland-${version}-x86_64.iso"
            echo "release_name=CachyOS Hyprland ISO v${version}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Version ${version}"
            echo ""
            echo "- ISO file: \`cachyos-hyprland-${version}-x86_64.iso\`"
            if [ "$release" = "true" ]; then
              echo "- Release: **yes**, tag \`${tag}\`"
            else
              echo "- Release: **no** (artifact only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free host disk space
        run: |
          for d in /host/android /host/dotnet; do
            if [ -d "$d" ]; then rm -rf "${d:?}"/* || true; fi
          done
          df -h /
          avail=$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')
          if [ "${avail:-0}" -lt 25 ]; then
            echo "::warning::Only ${avail}G free; the build may run out of disk."
          fi

      - name: Compute cache key
        id: cachekey
        # Weekly (ISO year-week) so a new multi-GB cache is made once a week, not daily.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Package downloads are the slowest network part of the build. The mkarchiso
      # work dir is not cached on purpose (it is rebuilt every time and is huge).
      # Bump v1 -> v2 in both keys below to throw the cache away.
      - name: Restore pacman package cache
        id: pacman-cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-v1-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            pacman-pkg-v1-

      - name: Install Base Build Dependencies
        run: |
          pacman -Syu --noconfirm archiso mkinitcpio-archiso git squashfs-tools grub syslinux python lua pacman-contrib

      - name: Install patch helper
        run: |
          # sedx [-o] FILE SED_EXPR : like `sed -i`, but FAILS if nothing changed
          # (-o = only warn). Stops silent no-op patches when upstream drifts.
          cat > /usr/local/bin/sedx <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          opt=0
          if [ "${1:-}" = "-o" ]; then opt=1; shift; fi
          f="$1"; e="$2"
          if [ ! -f "$f" ]; then echo "PATCH FAIL: missing file: $f" >&2; exit 1; fi
          before=$(sha256sum "$f" | cut -d' ' -f1)
          sed -i -e "$e" "$f"
          after=$(sha256sum "$f" | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then
            if [ "$opt" = 1 ]; then echo "::warning::sedx: no change from '$e' in $f"; exit 0; fi
            echo "PATCH FAIL: '$e' changed nothing in $f" >&2
            exit 1
          fi
          SH
          chmod +x /usr/local/bin/sedx

      - name: Clone Upstream CachyOS Repo
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || env.UPSTREAM_PIN }}
        run: |
          set -euo pipefail
          rm -rf cachyos
          if [ -n "$UPSTREAM_REF" ]; then
            git init -q cachyos
            git -C cachyos remote add origin https://github.com/CachyOS/CachyOS-Live-ISO.git
            git -C cachyos fetch --depth 1 origin "$UPSTREAM_REF"
            git -C cachyos checkout -q FETCH_HEAD
          else
            git clone --depth 1 https://github.com/CachyOS/CachyOS-Live-ISO.git cachyos
            echo "::notice::Upstream is NOT pinned. Set UPSTREAM_PIN to the SHA below to pin it."
          fi
          sha=$(git -c safe.directory='*' -C cachyos rev-parse HEAD)
          echo "Upstream CachyOS-Live-ISO commit: $sha"
          echo "Upstream commit: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize CachyOS Keyring and Repositories
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          printf '\n[cachyos]\nSigLevel = Required DatabaseOptional\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' >> /etc/pacman.conf
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          pacman -Syu --noconfirm
          pacman -S --noconfirm cachyos-keyring
          pacman-key --populate cachyos
          pacman -Syu --noconfirm

      - name: Create Non-Root Builder User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p cachyos/out
          chown -R builder:builder cachyos

      # ------------------------------------------------------------------
      # PATCHES START HERE
      # ------------------------------------------------------------------
      - name: Patch Package List
        env:
          KEEP_INSTALLER: ${{ github.event_name != 'workflow_dispatch' || inputs.keep_installer }}
        run: |
          set -euo pipefail
          PKG_LIST="cachyos/archiso/packages_desktop.x86_64"
          [ -f "$PKG_LIST" ] || { echo "PATCH FAIL: $PKG_LIST not found" >&2; exit 1; }

          ADD=(
            hyprland hyprpaper hyprlock hypridle hyprpolkitagent
            xdg-desktop-portal-hyprland xdg-desktop-portal-gtk
            waybar wofi mako grim slurp wl-clipboard
            qt5-wayland qt6-wayland greetd greetd-tuigreet
            bluez bluez-utils thunar
            swaybg brightnessctl otf-font-awesome
            kitty fish fastfetch firefox nano
            cliphist libnotify
          )

          REMOVE=(
            cachyos-hello cachyos-kde-settings
            plasma-desktop plasma-workspace plasma-nm plasma-pa
            plasma-integration plasma-thunderbolt plasma-login-manager
            kde-gtk-config kinfocenter kscreen bluedevil breeze-gtk
            polkit-kde-agent dolphin konsole kate kcalc spectacle
            partitionmanager kxkb2locale1
            gparted gpart clonezilla partclone partimage testdisk
            ddrescue fatresize cloud-init open-vm-tools qemu-guest-agent
            virtualbox-guest-utils spice-vdagent hyperv
            darkhttpd bind dnsmasq lftp lynx irssi nmap tcpdump
            traceroute ndisc6 inetutils lsof mc smartmontools nvme-cli
            sdparm sg3_utils lsscsi dmidecode hwinfo usbmuxd wvdial
            gcc fakeroot paru refind os-prober ntp avahi nss-mdns
            bolt pcsclite occt linux-atm wireless_tools net-tools
            imwheel libwnck3 xdg-user-dirs-gtk rxvt-unicode-terminfo
            inotify-tools ethtool cachyos-fish-config
            linux-firmware-marvell b43-fwcutter vim
            bcachefs-tools f2fs-tools jfsutils nilfs-utils dmraid
            noto-fonts-cjk opendesktop-fonts openvpn vpnc rp-pppoe xl2tpd
            modemmanager mobile-broadband-provider-info usb_modeswitch
            linux-cachyos-lts linux-cachyos-lts-zfs linux-cachyos-lts-nvidia-open
            linux-cachyos-zfs zfs-utils
          )
          if [ "$KEEP_INSTALLER" != "true" ]; then
            REMOVE+=( cachyos-calamares-next cachyos-cli-installer-new )
          fi
          echo "KEEP_INSTALLER=$KEEP_INSTALLER"

          # Remove first, then add, so a package in both lists ends up present.
          printf '%s\n' "${REMOVE[@]}" > /tmp/remove.txt
          grep -vxFf /tmp/remove.txt "$PKG_LIST" > /tmp/pkgs.new || true
          cp /tmp/pkgs.new "$PKG_LIST"

          for pkg in "${ADD[@]}"; do
            if ! grep -qxF "$pkg" "$PKG_LIST"; then
              echo "$pkg" >> "$PKG_LIST"
            fi
          done

          missing=0
          for pkg in hyprland pipewire pipewire-pulse wireplumber networkmanager \
              wpa_supplicant mkinitcpio mkinitcpio-archiso linux-cachyos \
              linux-cachyos-nvidia-open nvidia-utils mesa \
              xdg-desktop-portal-hyprland hyprpolkitagent bluez bluez-utils \
              firefox kitty thunar nano grim slurp greetd greetd-tuigreet \
              sof-firmware linux-firmware grub efibootmgr chwd polkit \
              cryptsetup lvm2 btrfs-progs e2fsprogs syslinux; do
            if ! grep -qxF "$pkg" "$PKG_LIST"; then
              echo "GUARD FAIL: '$pkg' missing from package list" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Patch util-iso.sh
        run: |
          set -euo pipefail
          UTIL=cachyos/util-iso.sh
          # 1. Swap display manager service
          sedx "$UTIL" 's|/usr/lib/systemd/system/plasmalogin\.service|/usr/lib/systemd/system/greetd.service|g'
          # 2. Replace the signing command with `true` (no signing key in CI)
          sedx "$UTIL" 's|sign_with_key \$f|true|g'

      - name: Patch linux.preset
        run: |
          set -euo pipefail
          sedx cachyos/archiso/airootfs/etc/mkinitcpio.d/linux.preset 's|linux-cachyos-lts|linux-cachyos|g'

      - name: Patch airootfs
        run: |
          set -euo pipefail
          AIROOT="cachyos/archiso/airootfs"

          # Find the live user from the Plasma login config BEFORE deleting it.
          LIVE_USER=$(grep -rhoP '^\s*User=\K\S+' \
            "$AIROOT/etc/plasmalogin.conf" "$AIROOT/etc/plasmalogin.conf.d" 2>/dev/null \
            | head -n1 || true)
          LIVE_USER=${LIVE_USER:-liveuser}
          echo "Live user for autologin: $LIVE_USER"
          if [ -f "$AIROOT/etc/passwd" ] && ! grep -q "^${LIVE_USER}:" "$AIROOT/etc/passwd"; then
            echo "::warning::User '$LIVE_USER' not found in airootfs/etc/passwd; autologin may fail."
          fi

          rm -f  "$AIROOT/etc/plasmalogin.conf"
          rm -rf "$AIROOT/etc/plasmalogin.conf.d"
          rm -f  "$AIROOT/etc/pacman.d/hooks/90-cachyos-live-kwin-keyboard.hook"
          rm -f  "$AIROOT/etc/modules-load.d/zfs.conf"
          rm -f  "$AIROOT/etc/modprobe.d/broadcom-wl.conf"
          rm -f  "$AIROOT/etc/skel/.config/kded5rc"
          rm -f  "$AIROOT/etc/skel/.config/kscreenlockerrc"
          rm -f  "$AIROOT/etc/skel/.config/kwalletrc"
          rm -f  "$AIROOT/etc/skel/.config/plasma-welcomerc"
          rm -f  "$AIROOT/etc/skel/.config/powerdevilrc"
          rm -f  "$AIROOT/etc/skel/.config/powermanagementprofilesrc"
          rm -rf "$AIROOT/etc/skel/.config/systemd/user/plasma-login-kwin_wayland.service.d"

          # Session launcher: prefer start-hyprland (newer Hyprland), else the bare binary.
          # Run via `sh <file>` so it needs no executable bit (archiso doesn't keep modes).
          mkdir -p "$AIROOT/etc/greetd"
          cat > "$AIROOT/etc/greetd/hypr-session.sh" <<'SESSION'
          #!/bin/sh
          # Hyprland 0.57+ only reads ~/.config/hypr/hyprland.lua. If the live user's
          # home exists before /etc/skel is applied, Hyprland writes its own stock
          # hyprland.lua (kitty/dolphin wizard, no bar). Copy our defaults in when
          # the file is missing, or when it is that stock example.
          LUA="$HOME/.config/hypr/hyprland.lua"
          if [ ! -f "$LUA" ] || grep -q 'This is an example Hyprland Lua config' "$LUA" 2>/dev/null; then
            mkdir -p "$HOME"
            rm -f "$LUA"
            cp -rn /etc/skel/. "$HOME"/ 2>/dev/null || true
          fi
          if command -v start-hyprland >/dev/null 2>&1; then
            exec start-hyprland
          fi
          exec Hyprland
          SESSION

          cat > "$AIROOT/etc/greetd/config.toml" <<'GREETD'
          [terminal]
          vt = 1

          [initial_session]
          command = "sh /etc/greetd/hypr-session.sh"
          user = "@LIVE_USER@"

          [default_session]
          command = 'tuigreet --time --remember --cmd "sh /etc/greetd/hypr-session.sh"'
          user = "greeter"
          GREETD
          sed -i "s/@LIVE_USER@/${LIVE_USER}/" "$AIROOT/etc/greetd/config.toml"

          # ---- Hyprland "rice" (waybar, kitty, fish, wallpaper) + size trims ----
          CONF="$AIROOT/etc/skel/.config"
          mkdir -p "$CONF/hypr" "$CONF/waybar" "$CONF/kitty" "$CONF/fish"

          # Wallpaper: soft dark-navy glow, generated here (pure python, ~few hundred KB)
          cat > /tmp/mkwall.py <<'PYWALL'
          import math, struct, sys, zlib
          W, H = 960, 540
          base = (9, 12, 34)
          blobs = [(0.40, 0.58, 0.20, (170, 140, 70), 0.55),
                   (0.52, 0.42, 0.15, (80, 80, 190), 0.75),
                   (0.30, 0.70, 0.12, (120, 100, 60), 0.30)]
          raw = bytearray()
          for y in range(H):
              raw.append(0)
              fy = y / H
              for x in range(W):
                  fx = x / W
                  r, g, b = base
                  for cx, cy, rad, col, s in blobs:
                      dx = (fx - cx) * W / H
                      dy = fy - cy
                      w = s * math.exp(-(dx * dx + dy * dy) / (2 * rad * rad))
                      r += (col[0] - r) * w
                      g += (col[1] - g) * w
                      b += (col[2] - b) * w
                  raw += bytes((int(r), int(g), int(b)))
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0)) \
                + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
          open(sys.argv[1], 'wb').write(png)
          PYWALL
          python3 /tmp/mkwall.py "$CONF/hypr/wallpaper.png"

          cat > "$CONF/hypr/hyprland.lua" <<'HYPRRICE'
          -- cachyos-hyprland rice
          -- Hyprland 0.57+ only reads hyprland.lua; the old hyprland.conf is ignored.
          local mod   = "SUPER"
          local term  = "kitty"
          local files = "thunar"
          local menu  = "wofi --show drun"

          hl.monitor({ output = "", mode = "preferred", position = "auto", scale = 1 })

          hl.env("XCURSOR_SIZE", "24")

          hl.on("hyprland.start", function()
            hl.exec_cmd("systemctl --user start hyprpolkitagent")
            hl.exec_cmd("swaybg -i ~/.config/hypr/wallpaper.png -m fill")
            hl.exec_cmd("waybar")
            hl.exec_cmd("mako")
            hl.exec_cmd("wl-paste --type text --watch cliphist store")
            hl.exec_cmd("wl-paste --type image --watch cliphist store")
          end)

          hl.config({
            general = {
              gaps_in = 4,
              gaps_out = 10,
              border_size = 2,
              col = {
                active_border = "rgba(b4befeee)",
                inactive_border = "rgba(31324488)",
              },
              layout = "dwindle",
            },
            decoration = {
              rounding = 12,
              blur = { enabled = true, size = 5, passes = 2 },
              shadow = { enabled = false },
            },
            animations = { enabled = true },
            input = {
              kb_layout = "us",
              follow_mouse = 1,
              touchpad = {
                natural_scroll = true,
                ["tap-to-click"] = true,
              },
            },
            misc = {
              disable_hyprland_logo = true,
              disable_splash_rendering = true,
              force_default_wallpaper = 0,
            },
          })

          hl.animation({ leaf = "windows",    enabled = true, speed = 3, bezier = "default", style = "slide" })
          hl.animation({ leaf = "fade",       enabled = true, speed = 3, bezier = "default" })
          hl.animation({ leaf = "workspaces", enabled = true, speed = 3, bezier = "default", style = "slide" })

          -- Apps and session
          hl.bind(mod .. " + RETURN", hl.dsp.exec_cmd(term))
          hl.bind(mod .. " + D",      hl.dsp.exec_cmd(menu))
          hl.bind(mod .. " + SPACE",  hl.dsp.exec_cmd("sh ~/.config/hypr/palette.sh"))
          hl.bind(mod .. " + E",      hl.dsp.exec_cmd(files))
          hl.bind(mod .. " + B",      hl.dsp.exec_cmd("firefox"))
          hl.bind(mod .. " + L",      hl.dsp.exec_cmd("hyprlock"))
          hl.bind(mod .. " + F1",     hl.dsp.exec_cmd("kitty -e less ~/.config/hypr/hyprland.lua"))
          hl.bind(mod .. " + Q",      hl.dsp.window.close())
          hl.bind(mod .. " + SHIFT + R", hl.dsp.exec_cmd("hyprctl reload"))
          hl.bind(mod .. " + SHIFT + E", hl.dsp.exit())

          -- Window management
          hl.bind(mod .. " + V", hl.dsp.window.float({ action = "toggle" }))
          hl.bind(mod .. " + F", hl.dsp.window.fullscreen({ mode = "fullscreen", action = "toggle" }))
          hl.bind(mod .. " + left",  hl.dsp.focus({ direction = "left" }))
          hl.bind(mod .. " + right", hl.dsp.focus({ direction = "right" }))
          hl.bind(mod .. " + up",    hl.dsp.focus({ direction = "up" }))
          hl.bind(mod .. " + down",  hl.dsp.focus({ direction = "down" }))
          hl.bind(mod .. " + mouse:272", hl.dsp.window.drag(),   { mouse = true })
          hl.bind(mod .. " + mouse:273", hl.dsp.window.resize(), { mouse = true })

          -- Move windows
          hl.bind(mod .. " + SHIFT + left",  hl.dsp.window.move({ direction = "left" }))
          hl.bind(mod .. " + SHIFT + right", hl.dsp.window.move({ direction = "right" }))
          hl.bind(mod .. " + SHIFT + up",    hl.dsp.window.move({ direction = "up" }))
          hl.bind(mod .. " + SHIFT + down",  hl.dsp.window.move({ direction = "down" }))

          -- Workspaces: next/previous with . and , or Super + scroll
          hl.bind(mod .. " + period",     hl.dsp.focus({ workspace = "e+1" }))
          hl.bind(mod .. " + comma",      hl.dsp.focus({ workspace = "e-1" }))
          hl.bind(mod .. " + mouse_down", hl.dsp.focus({ workspace = "e+1" }))
          hl.bind(mod .. " + mouse_up",   hl.dsp.focus({ workspace = "e-1" }))

          -- Screenshot to clipboard
          hl.bind("Print", hl.dsp.exec_cmd("sh -c 'grim -g \"$(slurp)\" - | wl-copy'"))

          -- Media keys
          hl.bind("XF86AudioRaiseVolume",  hl.dsp.exec_cmd("wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+"), { locked = true, repeating = true })
          hl.bind("XF86AudioLowerVolume",  hl.dsp.exec_cmd("wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"),      { locked = true, repeating = true })
          hl.bind("XF86AudioMute",         hl.dsp.exec_cmd("wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"),     { locked = true })
          hl.bind("XF86MonBrightnessUp",   hl.dsp.exec_cmd("brightnessctl set 5%+"), { locked = true, repeating = true })
          hl.bind("XF86MonBrightnessDown", hl.dsp.exec_cmd("brightnessctl set 5%-"), { locked = true, repeating = true })

          -- Workspaces 1-9
          for i = 1, 9 do
            hl.bind(mod .. " + " .. i,           hl.dsp.focus({ workspace = i }))
            hl.bind(mod .. " + SHIFT + " .. i,   hl.dsp.window.move({ workspace = i }))
          end
          HYPRRICE

          cat > "$CONF/waybar/config.jsonc" <<'WBCONF'
          {
            "layer": "top",
            "position": "top",
            "height": 32,
            "margin-top": 6,
            "margin-left": 10,
            "margin-right": 10,
            "spacing": 6,
            "modules-left": ["custom/launcher", "clock", "temperature", "memory"],
            "modules-center": ["hyprland/workspaces", "hyprland/window"],
            "modules-right": ["tray", "network", "pulseaudio", "battery", "custom/power"],
            "custom/launcher": { "format": "\uf002", "tooltip": false, "on-click": "wofi --show drun", "on-click-right": "sh ~/.config/hypr/palette.sh" },
            "clock": { "format": "{:%H:%M %A %m/%d/%y}", "tooltip": false },
            "temperature": { "format": "\uf2c9  {temperatureC}°C", "critical-threshold": 85 },
            "memory": { "format": "\uf538  {used:0.1f} GiB" },
            "hyprland/workspaces": {
              "format": "{id}",
              "disable-scroll": true,
              "persistent-workspaces": { "*": 3 }
            },
            "hyprland/window": { "format": "{title}", "max-length": 40 },
            "tray": { "spacing": 8 },
            "network": {
              "format-wifi": "\uf1eb  {essid}",
              "format-ethernet": "\uf0ac  wired",
              "format-disconnected": "\uf071  offline",
              "tooltip-format": "{ifname}  {ipaddr}",
              "on-click": "kitty -e nmtui"
            },
            "pulseaudio": {
              "format": "{icon}  {volume}%",
              "format-muted": "\uf6a9  muted",
              "format-icons": { "default": ["\uf027", "\uf028"] },
              "on-click": "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
            },
            "battery": {
              "format": "{icon}  {capacity}%",
              "format-charging": "\uf0e7  {capacity}%",
              "format-icons": ["\uf244", "\uf243", "\uf242", "\uf241", "\uf240"],
              "states": { "warning": 25, "critical": 10 }
            },
            "custom/power": { "format": "\uf011", "tooltip": false, "on-click": "sh ~/.config/waybar/power.sh" }
          }
          WBCONF

          cat > "$CONF/waybar/style.css" <<'WBCSS'
          * {
            font-family: "Noto Sans", "DejaVu Sans", sans-serif;
            font-size: 13px;
            border: none;
            border-radius: 0;
            min-height: 0;
          }
          window#waybar { background: transparent; color: #cdd6f4; }
          #custom-launcher, #clock, #temperature, #memory, #workspaces, #window,
          #tray, #network, #pulseaudio, #battery, #custom-power {
            background: rgba(17, 19, 40, 0.85);
            border: 1px solid rgba(180, 190, 254, 0.25);
            border-radius: 14px;
            padding: 2px 12px;
          }
          #workspaces { padding: 2px 6px; }
          #workspaces button {
            padding: 0 6px;
            margin: 0 2px;
            color: #6c7086;
            background: transparent;
            border-radius: 10px;
          }
          #workspaces button.active { background: #b4befe; color: #11132b; min-width: 22px; }
          window#waybar.empty #window { background: transparent; border-color: transparent; }
          #battery.warning { color: #f9e2af; }
          #battery.critical, #temperature.critical { color: #f38ba8; }
          #custom-power { color: #f38ba8; }
          WBCSS

          cat > "$CONF/waybar/power.sh" <<'WBPOWER'
          choice=$(printf 'Lock\nLogout\nReboot\nShutdown\n' | wofi --dmenu --prompt Power)
          case "$choice" in
            Lock) hyprlock ;;
            Logout) hyprctl dispatch exit ;;
            Reboot) systemctl reboot ;;
            Shutdown) systemctl poweroff ;;
          esac
          WBPOWER

          cat > "$CONF/hypr/palette.sh" <<'WBPALETTE'
          #!/bin/sh
          # Command palette (Super+Space, or right-click the launcher icon in the bar).
          # Type to filter (fuzzy), Enter to run. Recently used entries float to the top.
          # To add a command: add a line to the list and a matching case below.
          HIST="${XDG_CACHE_HOME:-$HOME/.cache}/palette-history"
          mkdir -p "$(dirname "$HIST")"
          touch "$HIST"

          notify() { command -v notify-send >/dev/null 2>&1 && notify-send -t 2500 "$@"; return 0; }
          menu()   { wofi --dmenu --insensitive --matching fuzzy --cache-file /dev/null "$@"; }
          term()   { exec kitty -e "$@"; }

          ALL=$(printf '%s\n' \
            "App: Search all applications" \
            "App: Terminal" \
            "App: Files" \
            "App: Browser" \
            "Window: Toggle floating" \
            "Window: Toggle fullscreen" \
            "Window: Close" \
            "Screenshot: area to clipboard" \
            "Screenshot: area to file" \
            "Screenshot: full screen to file" \
            "Clipboard: History" \
            "Clipboard: Clear history" \
            "Audio: Toggle mute" \
            "Audio: Toggle microphone mute" \
            "Audio: Volume up" \
            "Audio: Volume down" \
            "Audio: Set volume to 100%" \
            "Display: Brightness up" \
            "Display: Brightness down" \
            "Network: Wi-Fi and connections" \
            "Network: Toggle Wi-Fi" \
            "Network: Show IP address" \
            "Bluetooth: Open bluetoothctl" \
            "Bluetooth: Toggle power" \
            "Hyprland: Reload config" \
            "Hyprland: Show config errors" \
            "Hyprland: Edit config" \
            "Hyprland: Show keybinds" \
            "Hyprland: Restart waybar" \
            "System: System info" \
            "System: Lock screen" \
            "System: Suspend" \
            "System: Log out" \
            "System: Reboot" \
            "System: Shut down")

          # Last 6 distinct choices first, then everything else (no duplicates).
          RECENT=$(tac "$HIST" | awk '!seen[$0]++' | head -n 6)
          LIST=$(printf '%s\n%s\n' "$RECENT" "$ALL" | awk 'NF && !seen[$0]++')

          choice=$(printf '%s\n' "$LIST" | menu --prompt "Command palette" --width 520 --height 480)
          [ -n "$choice" ] || exit 0

          # Remember the choice (only if it is a known entry), keep the file short.
          if printf '%s\n' "$ALL" | grep -qxF "$choice"; then
            printf '%s\n' "$choice" >> "$HIST"
            tail -n 50 "$HIST" > "$HIST.tmp" && mv "$HIST.tmp" "$HIST"
          fi

          case "$choice" in
            "App: Search all applications") exec wofi --show drun ;;
            "App: Terminal") exec kitty ;;
            "App: Files") exec thunar ;;
            "App: Browser") exec firefox ;;
            "Window: Toggle floating") hyprctl dispatch 'hl.dsp.window.float({ action = "toggle" })' ;;
            "Window: Toggle fullscreen") hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = "fullscreen", action = "toggle" })' ;;
            "Window: Close") hyprctl dispatch 'hl.dsp.window.close()' ;;
            "Screenshot: area to clipboard")
              sleep 0.3
              grim -g "$(slurp)" - | wl-copy && notify "Screenshot" "Copied to clipboard"
              ;;
            "Screenshot: area to file")
              sleep 0.3
              mkdir -p "$HOME/Pictures"
              f="$HOME/Pictures/shot-$(date +%Y%m%d-%H%M%S).png"
              grim -g "$(slurp)" "$f" && notify "Screenshot saved" "$f"
              ;;
            "Screenshot: full screen to file")
              sleep 0.3
              mkdir -p "$HOME/Pictures"
              f="$HOME/Pictures/shot-$(date +%Y%m%d-%H%M%S).png"
              grim "$f" && notify "Screenshot saved" "$f"
              ;;
            "Clipboard: History")
              if command -v cliphist >/dev/null 2>&1; then
                sel=$(cliphist list | menu --prompt "Clipboard" --width 640 --height 480)
                [ -n "$sel" ] && printf '%s' "$sel" | cliphist decode | wl-copy
              else
                notify "Clipboard" "cliphist is not installed"
              fi
              ;;
            "Clipboard: Clear history") cliphist wipe && notify "Clipboard" "History cleared" ;;
            "Audio: Toggle mute") wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle ;;
            "Audio: Toggle microphone mute") wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle ;;
            "Audio: Volume up") wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ ;;
            "Audio: Volume down") wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- ;;
            "Audio: Set volume to 100%") wpctl set-volume @DEFAULT_AUDIO_SINK@ 1.0 ;;
            "Display: Brightness up") brightnessctl set 5%+ ;;
            "Display: Brightness down") brightnessctl set 5%- ;;
            "Network: Wi-Fi and connections") term nmtui ;;
            "Network: Toggle Wi-Fi")
              if nmcli radio wifi | grep -q '^enabled'; then
                nmcli radio wifi off && notify "Wi-Fi" "Turned off"
              else
                nmcli radio wifi on && notify "Wi-Fi" "Turned on"
              fi
              ;;
            "Network: Show IP address")
              ip=$(ip -brief address | awk '$2 == "UP" {print $1 ": " $3}' | paste -sd ' ' -)
              notify "IP address" "${ip:-no active connection}"
              ;;
            "Bluetooth: Open bluetoothctl") term bluetoothctl ;;
            "Bluetooth: Toggle power")
              if bluetoothctl show | grep -q 'Powered: yes'; then
                bluetoothctl power off >/dev/null && notify "Bluetooth" "Turned off"
              else
                bluetoothctl power on >/dev/null && notify "Bluetooth" "Turned on"
              fi
              ;;
            "Hyprland: Reload config") hyprctl reload ;;
            "Hyprland: Show config errors") term sh -c 'hyprctl configerrors; echo; read -r _' ;;
            "Hyprland: Edit config") term nano "$HOME/.config/hypr/hyprland.lua" ;;
            "Hyprland: Show keybinds") term less "$HOME/.config/hypr/hyprland.lua" ;;
            "Hyprland: Restart waybar") pkill -x waybar; sleep 0.3; exec waybar ;;
            "System: System info") term sh -c 'fastfetch; echo; read -r _' ;;
            "System: Lock screen") exec hyprlock ;;
            "System: Suspend") systemctl suspend ;;
            "System: Log out") hyprctl dispatch 'hl.dsp.exit()' ;;
            "System: Reboot") systemctl reboot ;;
            "System: Shut down") systemctl poweroff ;;
          esac
          WBPALETTE

          cat > "$CONF/kitty/kitty.conf" <<'KITTYCONF'
          shell fish
          font_size 11.0
          window_padding_width 10
          background_opacity 0.92
          background #0b0e1f
          foreground #cdd6f4
          cursor_shape beam
          confirm_os_window_close 0
          enable_audio_bell no
          KITTYCONF

          cat > "$CONF/fish/config.fish" <<'FISHCONF'
          function fish_greeting
              fastfetch
          end
          function fish_prompt
              set_color cba6f7
              echo (prompt_pwd)
              set_color a6e3a1
              echo -n '❯ '
              set_color normal
          end
          FISHCONF

          # Size: skip docs/man/info when the image is built.
          pc_found=0
          while IFS= read -r pc; do
            pc_found=1
            echo "NoExtract -> $pc"
            sedx -o "$pc" '/^\[options\]/a NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/*'
          done < <(find cachyos -maxdepth 3 -name 'pacman*.conf' -not -path '*/airootfs/*' -not -path '*/.git/*')
          [ "$pc_found" = 1 ] || echo "::warning::no pacman.conf found under cachyos/; skipping NoExtract"

          # Size: smaller squashfs (xz). Appended last so it overrides upstream.
          pd_found=0
          while IFS= read -r pd; do
            pd_found=1
            echo "squashfs xz -> $pd"
            grep -n 'airootfs_image' "$pd" || true
            printf "\nairootfs_image_tool_options=('-comp' 'xz' '-Xbcj' 'x86' '-b' '1M' '-Xdict-size' '1M')\n" >> "$pd"
          done < <(find cachyos -maxdepth 3 -name 'profiledef.sh' -not -path '*/airootfs/*' -not -path '*/.git/*')
          [ "$pd_found" = 1 ] || echo "::warning::no profiledef.sh found under cachyos/; skipping squashfs xz"

      - name: Patch boot robustness (slow VMs, removed services, networking)
        run: |
          set -euo pipefail
          AIROOT="cachyos/archiso/airootfs"
          SYSD="$AIROOT/etc/systemd/system"
          mkdir -p "$SYSD"

          # 1. Drop enable/alias symlinks for services whose packages we removed.
          #    Fixes: "Failed to preset all unit: dbus-org.freedesktop.ModemManager1.service
          #    is an unresolvable alias" (modemmanager is in REMOVE but its links remain).
          if [ -d "$AIROOT/etc/systemd" ]; then
            for u in ModemManager dbus-org.freedesktop.ModemManager1 \
                     avahi-daemon avahi-dnsconfd dbus-org.freedesktop.Avahi \
                     ntpd vboxservice vmtoolsd qemu-guest-agent spice-vdagentd \
                     bolt dbus-org.freedesktop.bolt pcscd; do
              find "$AIROOT/etc/systemd" -type l \
                \( -name "$u.service" -o -name "$u.socket" \) -print -delete
            done
          fi

          # 2. Tolerate slow / emulated VMs (no KVM, unstable TSC). The log shows
          #    journald, nsresourced and drm-module-load.target all hitting their
          #    start timeouts, which sends cachyos-drm-awaiter to the emergency shell.
          #    "zz-" sorts last so these override any upstream value.
          mkdir -p "$SYSD/drm-module-load.target.d" \
                   "$SYSD/systemd-journald.service.d" \
                   "$SYSD/systemd-nsresourced.service.d"
          printf '[Unit]\nJobTimeoutSec=300\n' \
            > "$SYSD/drm-module-load.target.d/zz-slow-vm.conf"
          printf '[Service]\nTimeoutStartSec=300\nWatchdogSec=0\n' \
            > "$SYSD/systemd-journald.service.d/zz-slow-vm.conf"
          printf '[Service]\nTimeoutStartSec=300\n' \
            > "$SYSD/systemd-nsresourced.service.d/zz-slow-vm.conf"

          # 3. A live ISO does not need to block on NTP sync; mask the wait unit.
          ln -sf /dev/null "$SYSD/systemd-time-wait-sync.service"

          # 4. Load common VM GPU drivers up front. In a QEMU virtio-gpu VM the DRM
          #    device (Virtual-1) only appeared after drm-module-load.target had
          #    already timed out. Missing modules just log a warning; on real
          #    hardware these load harmlessly without matching devices.
          mkdir -p "$AIROOT/etc/modules-load.d"
          printf 'virtio_gpu\nbochs\nvmwgfx\nhyperv_drm\n' \
            > "$AIROOT/etc/modules-load.d/vm-gpu.conf"

          # 5. Enable NetworkManager (build-time equivalent of
          #    `systemctl enable NetworkManager`). `--now` is meaningless here:
          #    there is no running systemd inside the airootfs. the
          #    Hyprland session (waybar network module, nmtui) needs this service. wait-online is deliberately
          #    NOT enabled; it only slows boot.
          mkdir -p "$SYSD/multi-user.target.wants"
          ln -sf /usr/lib/systemd/system/NetworkManager.service \
            "$SYSD/multi-user.target.wants/NetworkManager.service"
          ln -sf /usr/lib/systemd/system/NetworkManager-dispatcher.service \
            "$SYSD/dbus-org.freedesktop.nm-dispatcher.service"

      - name: Patch Boot Entries
        run: |
          set -euo pipefail
          GRUB=cachyos/archiso/grub/grub.cfg
          sedx "$GRUB" 's|linux-cachyos-lts|linux-cachyos|g'
          sedx "$GRUB" '/^menuentry "CachyOS LTS Kernel"/,/^}/ s/^/# /'

          EFI_DIR=cachyos/archiso/efiboot/loader/entries
          DEFAULT_ENTRY=02-archiso-linux-cachyos.conf
          rm -f "$EFI_DIR/01-archiso-linux.conf"
          rm -f "$EFI_DIR/03-archiso-memtest86+.conf"
          sedx -o "$EFI_DIR/fallback.conf" 's|linux-cachyos-lts|linux-cachyos|g'

          if [ ! -f "$EFI_DIR/$DEFAULT_ENTRY" ]; then
            echo "PATCH FAIL: boot entry $DEFAULT_ENTRY not found. Entries present:" >&2
            ls -1 "$EFI_DIR" >&2
            exit 1
          fi
          sedx -o cachyos/archiso/efiboot/loader/loader.conf "s|^default .*|default ${DEFAULT_ENTRY}|"

          # --- syslinux (BIOS) ---
          # This is the menu that prints "Loading /arch/boot/x86_64/vmlinuz-...: failed".
          SYSLINUX=cachyos/archiso/syslinux
          if [ ! -d "$SYSLINUX" ]; then
            echo "PATCH FAIL: $SYSLINUX not found. Contents of cachyos/archiso:" >&2
            ls -1 cachyos/archiso >&2
            exit 1
          fi
          # For each config that mentions the LTS kernel:
          #  - if a plain linux-cachyos entry also exists, drop the LTS LABEL stanzas;
          #  - if NOT (the BIOS menu may only have LTS entries), repoint them to
          #    linux-cachyos instead, so the menu is never left without a bootable entry.
          for f in "$SYSLINUX"/*.cfg; do
            grep -q 'linux-cachyos-lts' "$f" || continue
            awk '
              function flush() { if (buf != "" && buf !~ /linux-cachyos-lts/) printf "%s", buf; buf = "" }
              tolower($0) ~ /^[ \t]*label[ \t]/ { flush(); buf = $0 ORS; next }
              buf != "" { buf = buf $0 ORS; next }
              { print }
              END { flush() }
            ' "$f" > "$f.new"
            if grep -qE 'vmlinuz-linux-cachyos([^-]|$)' "$f.new"; then
              mv "$f.new" "$f"
              echo "syslinux: removed LTS entries from $f"
            else
              rm -f "$f.new"
              sed -i 's|linux-cachyos-lts|linux-cachyos|g' "$f"
              echo "syslinux: no plain entry in $f; repointed LTS entries to linux-cachyos"
            fi
          done
          echo "::group::syslinux configs after patch"
          for f in "$SYSLINUX"/*.cfg; do echo "=== $f"; cat "$f"; done
          echo "::endgroup::"

          # --- copytoram ---
          # Boot straight from USB instead of copying the whole image into RAM.
          { grep -rIl 'copytoram' cachyos/archiso || true; } | while IFS= read -r f; do
            sed -i -E 's/[[:space:]]+copytoram(=[a-zA-Z0-9]+)?//g' "$f"
          done

          # --- Catch-all ---
          # Anything under archiso/ that still names the LTS kernel gets rewritten,
          # and LTS-named files (e.g. a linux-cachyos-lts.preset) are deleted.
          { grep -rIl 'linux-cachyos-lts' cachyos/archiso || true; } | while IFS= read -r f; do
            echo "catch-all: rewriting LTS reference in $f"
            sed -i 's|linux-cachyos-lts|linux-cachyos|g' "$f"
          done
          find cachyos/archiso -name '*linux-cachyos-lts*' -prune -print -exec rm -rf {} +

      - name: Stamp version into the ISO
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          up=$(git -c safe.directory='*' -C cachyos rev-parse HEAD)
          mkdir -p cachyos/archiso/airootfs/etc
          {
            echo "NAME=\"CachyOS Hyprland ISO\""
            echo "VERSION=\"$VERSION\""
            echo "BUILD_DATE=\"$(date -u +%Y-%m-%d)\""
            echo "UPSTREAM_COMMIT=\"$up\""
            echo "REPO=\"https://github.com/${{ github.repository }}\""
          } > cachyos/archiso/airootfs/etc/cachyos-hyprland-release

      - name: Verify patched profile
        run: |
          set -euo pipefail
          fail=0
          PKG_LIST=cachyos/archiso/packages_desktop.x86_64

          for pkg in plasma-desktop plasma-login-manager linux-cachyos-lts; do
            if grep -qxF "$pkg" "$PKG_LIST"; then echo "VERIFY FAIL: $pkg still in package list" >&2; fail=1; fi
          done
          if grep -q 'plasmalogin\.service' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: plasmalogin.service still referenced in util-iso.sh" >&2; fail=1
          fi
          if ! grep -q 'greetd\.service' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: greetd.service not referenced in util-iso.sh" >&2; fail=1
          fi
          if grep -qF 'sign_with_key $f' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: signing call still present in util-iso.sh" >&2; fail=1
          fi
          for f in etc/greetd/config.toml etc/greetd/hypr-session.sh etc/skel/.config/hypr/hyprland.lua etc/skel/.config/hypr/palette.sh etc/skel/.config/waybar/config.jsonc etc/skel/.config/waybar/style.css etc/skel/.config/kitty/kitty.conf etc/skel/.config/fish/config.fish; do
            [ -s "cachyos/archiso/airootfs/$f" ] || { echo "VERIFY FAIL: missing/empty airootfs/$f" >&2; fail=1; }
          done
          for sh_file in palette.sh; do
            if ! sh -n "cachyos/archiso/airootfs/etc/skel/.config/hypr/$sh_file"; then
              echo "VERIFY FAIL: $sh_file has a shell syntax error" >&2; fail=1
            fi
          done
          if ! grep -q 'SPACE.*palette\.sh' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+Space is not bound to the command palette" >&2; fail=1
          fi
          if ! luac -p cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: hyprland.lua has a Lua syntax error" >&2; fail=1
          fi
          if [ -e cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.conf ]; then
            echo "VERIFY FAIL: legacy hyprland.conf shipped (ignored by Hyprland 0.57+)" >&2; fail=1
          fi
          if find cachyos/archiso/airootfs/etc/systemd -name '*ModemManager*' 2>/dev/null | grep -q .; then
            echo "VERIFY FAIL: ModemManager unit links still in airootfs" >&2; fail=1
          fi
          [ -f cachyos/archiso/airootfs/etc/systemd/system/drm-module-load.target.d/zz-slow-vm.conf ] \
            || { echo "VERIFY FAIL: slow-VM drop-ins missing" >&2; fail=1; }
          [ -L cachyos/archiso/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service ] \
            || { echo "VERIFY FAIL: NetworkManager not enabled" >&2; fail=1; }
          if grep -rIn 'linux-cachyos-lts' cachyos/archiso; then
            echo "VERIFY FAIL: LTS kernel still referenced under archiso/ (lines above)" >&2; fail=1
          fi
          if ! grep -rqE 'vmlinuz-linux-cachyos([^-]|$)' cachyos/archiso/syslinux; then
            echo "VERIFY FAIL: no syslinux entry boots vmlinuz-linux-cachyos. Syslinux label/kernel lines:" >&2
            ls -1 cachyos/archiso/syslinux >&2 || true
            grep -rniE '^[[:space:]]*(label|linux|kernel|initrd)' cachyos/archiso/syslinux >&2 || true
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

          echo "--- LTS kernel references outside archiso/ (review, non-fatal) ---"
          grep -rIn 'linux-cachyos-lts' cachyos --exclude-dir=.git --exclude-dir=archiso || echo "none"

          echo "--- Leftover KDE/Plasma/SDDM references in airootfs (review, non-fatal) ---"
          grep -rIil 'plasma\|kwin\|sddm' cachyos/archiso/airootfs || echo "none"

          echo "--- Patch summary ---"
          git -c safe.directory='*' -C cachyos diff --stat || true
          chown -R builder:builder cachyos
      # ------------------------------------------------------------------
      # PATCHES END HERE
      # ------------------------------------------------------------------

      - name: Build the ISO
        run: |
          set -uo pipefail
          cd cachyos
          chmod +x ./buildiso.sh
          sudo chown -R builder:builder /var/cache/pacman/pkg

          rm -rf build/ work/ out/*

          # Keep a copy of the full log so a failed build can be inspected
          # from the "build-log" artifact instead of scrolling the Actions UI.
          set +e
          sudo -H -E -u builder ./buildiso.sh -p desktop -v -w 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"
          build_rc=${PIPESTATUS[0]}
          set -e
          echo "buildiso.sh exit code: $build_rc"

          if ls out/*/*.iso 1>/dev/null 2>&1; then
            echo "ISO successfully compiled."
            if [ "$build_rc" -ne 0 ]; then
              echo "::warning::buildiso.sh exited $build_rc but produced an ISO; check the log."
            fi
            find out -name '*.iso' -exec ls -lh {} \;
          else
            echo "ISO file not found — build failed." >&2
            exit 1
          fi
        working-directory: ${{ github.workspace }}

      - name: Prune pacman cache
        if: ${{ !cancelled() }}
        run: |
          # Drop half-finished downloads and old versions so the cache stays small.
          find /var/cache/pacman/pkg -maxdepth 1 \( -name 'download-*' -o -name '*.part' \) -exec rm -rf {} + || true
          paccache -rk1 -c /var/cache/pacman/pkg || true
          du -sh /var/cache/pacman/pkg || true

      - name: Save pacman package cache
        if: ${{ !cancelled() && steps.pacman-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-v1-${{ steps.cachekey.outputs.week }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Rename ISO
        env:
          ISO_NAME: ${{ steps.meta.outputs.iso_name }}
        run: |
          set -euo pipefail
          # Give the ISO a stable name and drop upstream's checksum/signature files;
          # a fresh .sha256 for the new name is written in a later step.
          n=0
          while IFS= read -r iso; do
            dir=$(dirname "$iso")
            if [ "$n" -eq 0 ]; then new="$dir/$ISO_NAME"; else new="$dir/${ISO_NAME%.iso}-$n.iso"; fi
            rm -f "$iso".*
            if [ "$iso" != "$new" ]; then mv "$iso" "$new"; fi
            echo "ISO: $new"
            n=$((n + 1))
          done < <(find cachyos/out -name '*.iso' | sort)
          [ "$n" -gt 0 ] || { echo "::error::no ISO found to rename" >&2; exit 1; }

      - name: Check boot configs against kernels in the ISO
        run: |
          set -euo pipefail
          iso=$(find cachyos/out -name '*.iso' | head -n1)
          echo "Checking $iso"
          tmp=$(mktemp -d)
          list="$tmp.list"
          mkdir -p "$tmp/cfg"

          # Tooling problems only warn; only a real kernel mismatch fails the job.
          if ! bsdtar -t -f "$iso" > "$list"; then
            echo "::warning::bsdtar could not read the ISO; skipping boot config check."
            exit 0
          fi

          # Extract only boot config files that actually exist in the ISO tree
          # (the systemd-boot .conf entries live inside efiboot.img, not the tree).
          mapfile -t cfgs < <(grep -E '\.(cfg|conf)$' "$list" || true)
          if [ "${#cfgs[@]}" -gt 0 ]; then
            bsdtar -x -f "$iso" -C "$tmp/cfg" "${cfgs[@]}" \
              || echo "::warning::bsdtar reported errors while extracting boot configs; continuing."
          fi
          echo "Boot config files found in ISO tree: ${#cfgs[@]}"

          mapfile -t kernels < <(sed -n 's|.*/\(vmlinuz-[^/]*\)$|\1|p' "$list" | sort -u)
          if [ "${#kernels[@]}" -eq 0 ]; then
            echo "::warning::Could not find any kernels in the ISO listing; skipping boot config check."
            exit 0
          fi
          echo "Kernels in ISO: ${kernels[*]}"

          refs=$(grep -rhoE 'vmlinuz-[A-Za-z0-9._+-]+' "$tmp/cfg" | sort -u || true)
          if [ -z "$refs" ]; then
            echo "::warning::No kernel references found in the ISO's boot configs."
          fi
          bad=0
          for ref in $refs; do
            if ! printf '%s\n' "${kernels[@]}" | grep -qxF "$ref"; then
              echo "BOOT CHECK FAIL: a boot config references '$ref' but the ISO has no such kernel" >&2
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

      - name: Check ISO size against release limit
        id: size
        run: |
          set -euo pipefail
          limit=$((2 * 1024 * 1024 * 1024))   # GitHub release assets must be < 2 GiB
          ok=true
          while IFS= read -r iso; do
            size=$(stat -c %s "$iso")
            echo "$iso: $((size / 1024 / 1024)) MiB"
            if [ "$size" -ge "$limit" ]; then ok=false; fi
          done < <(find cachyos/out -name '*.iso')
          echo "release_ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = false ]; then
            msg="ISO is 2 GiB or larger: GitHub Releases will reject it, so the release step is skipped. The workflow artifact is still uploaded."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure checksums and write summary
        run: |
          set -euo pipefail
          {
            echo "### Built ISO"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r iso; do
            dir=$(dirname "$iso"); base=$(basename "$iso")
            # Create a .sha256 only if upstream did not already produce one.
            if [ ! -f "$iso.sha256" ]; then
              (cd "$dir" && sha256sum "$base" > "$base.sha256")
            fi
            sum=$(cut -d' ' -f1 "$iso.sha256")
            size=$(du -h "$iso" | cut -f1)
            echo "| \`$base\` | $size | \`$sum\` |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find cachyos/out -name '*.iso')

      # Release assets do not count toward Actions storage, so only keep an
      # artifact copy when the ISO is NOT going to a release.
      - name: Upload ISO as Artifact
        if: steps.meta.outputs.release != 'true' || steps.size.outputs.release_ok != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-hyprland-iso
          path: |
            cachyos/out/**/*.iso
            cachyos/out/**/*.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0   # ISOs are already compressed

      - name: Write release notes
        if: steps.meta.outputs.release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          iso=$(find cachyos/out -name '*.iso' | sort | head -n1)
          sum=$(cut -d' ' -f1 "$iso.sha256")
          size=$(du -h "$iso" | cut -f1)
          up=$(git -c safe.directory='*' -C cachyos rev-parse --short HEAD)
          {
            echo "## CachyOS Hyprland ISO v${VERSION}"
            echo ""
            echo "Unofficial CachyOS live ISO with a Hyprland desktop instead of KDE Plasma."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$iso")\` |"
            echo "| Size | $size |"
            echo "| SHA-256 | \`$sum\` |"
            echo "| Upstream | CachyOS-Live-ISO \`$up\` |"
            echo ""
            echo "### Before you boot"
            echo ""
            echo "- 4 GB of RAM is the practical minimum, 8 GB or more is recommended. Live changes are kept in RAM and lost on reboot."
            echo "- Disable Secure Boot."
            echo "- Verify the download with \`sha256sum -c <file>.sha256\`."
            echo "- This is not an official CachyOS release."
            echo ""
          } > release-notes.md

      - name: Release ISO
        if: steps.meta.outputs.release == 'true' && steps.size.outputs.release_ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease == true }}
          body_path: release-notes.md
          files: |
            cachyos/out/**/*.iso
            cachyos/out/**/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note when release was skipped
        if: steps.meta.outputs.release != 'true'
        run: |
          echo "Release skipped (release=false). The ISO is available as the workflow artifact." >> "$GITHUB_STEP_SUMMARY"
