          cur=$(hyprctl -j activeworkspace 2>/dev/null | sed -n 's/.*"id": *\([0-9][0-9]*\).*/\1/p' | head -n1)
          case "$cur" in ''|*[!0-9]*) cur=1 ;; esac
          case "${1:-}" in
            next) n=$(( cur % 4 + 1 )) ;;
            prev) n=$(( (cur + 2) % 4 + 1 )) ;;
            1|2|3|4) n=$1 ;;
            *) exit 1 ;;
          esac
