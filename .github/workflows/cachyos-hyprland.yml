          cat > "$CONF/hypr/palette.sh" <<'WBPALETTE'
          #!/bin/sh
          # Command palette (Super+Space, or right-click the launcher icon in the bar).
          # Type to filter (fuzzy), Enter to run. Recently used entries float to the top.
          # To add a command: add a line to the list and a matching case below.
          HIST="${XDG_CACHE_HOME:-$HOME/.cache}/palette-history"
          mkdir -p "$(dirname "$HIST")"
          touch "$HIST"

          notify() { command -v notify-send >/dev/null 2>&1 && notify-send -t 2500 "$@"; return 0; }
          menu()   { wofi --dmenu --insensitive --matching fuzzy --cache-file /dev/null "$@"; }
          term()   { exec kitty -e "$@"; }
          # Adds an icon in front of each entry (stripped again after the choice).
          decorate() {
            while IFS= read -r line; do
              case "${line%%:*}" in
                App) g="" ;;
                Window) g="" ;;
                Screenshot) g="" ;;
                Clipboard) g="" ;;
                Audio) g="" ;;
                Display) g="" ;;
                Network) g="" ;;
                Bluetooth) g="" ;;
                Hyprland) g="" ;;
                System) g="" ;;
                *) g="" ;;
              esac
              printf '%s  %s\n' "$g" "$line"
            done
          }

          ALL=$(printf '%s\n' \
            "App: Search all applications" \
            "App: Terminal" \
            "App: Files" \
            "App: Browser" \
            "Window: Toggle floating" \
            "Window: Toggle fullscreen" \
            "Window: Close" \
            "Screenshot: area to clipboard" \
            "Screenshot: area to file" \
            "Screenshot: full screen to file" \
            "Clipboard: History" \
            "Clipboard: Clear history" \
            "Audio: Toggle mute" \
            "Audio: Toggle microphone mute" \
            "Audio: Volume up" \
            "Audio: Volume down" \
            "Audio: Set volume to 100%" \
            "Display: Brightness up" \
            "Display: Brightness down" \
            "Network: Wi-Fi and connections" \
            "Network: Toggle Wi-Fi" \
            "Network: Show IP address" \
            "Bluetooth: Open bluetoothctl" \
            "Bluetooth: Toggle power" \
            "Hyprland: Reload config" \
            "Hyprland: Show config errors" \
            "Hyprland: Edit config" \
            "Hyprland: Show keybinds" \
            "Hyprland: Restart waybar" \
            "System: System info" \
            "System: Power menu" \
            "System: Lock screen" \
            "System: Suspend" \
            "System: Log out" \
            "System: Reboot" \
            "System: Shut down")

          # Last 6 distinct choices first, then everything else (no duplicates).
          RECENT=$(tac "$HIST" | awk '!seen[$0]++' | head -n 6)
          LIST=$(printf '%s\n%s\n' "$RECENT" "$ALL" | awk 'NF && !seen[$0]++')

          choice=$(printf '%s\n' "$LIST" | decorate | menu --prompt "Search commands" --width 560 --height 460)
          [ -n "$choice" ] || exit 0
          choice=$(printf '%s' "$choice" | sed 's/^[^ ]*  //')

          # Remember the choice (only if it is a known entry), keep the file short.
          if printf '%s\n' "$ALL" | grep -qxF "$choice"; then
            printf '%s\n' "$choice" >> "$HIST"
            tail -n 50 "$HIST" > "$HIST.tmp" && mv "$HIST.tmp" "$HIST"
          fi

          case "$choice" in
            "App: Search all applications") exec wofi --show drun ;;
            "App: Terminal") exec kitty ;;
            "App: Files") exec thunar ;;
            "App: Browser") exec brave ;;
            "Window: Toggle floating") hyprctl dispatch 'hl.dsp.window.float({ action = "toggle" })' ;;
            "Window: Toggle fullscreen") hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = "fullscreen", action = "toggle" })' ;;
            "Window: Close") hyprctl dispatch 'hl.dsp.window.close()' ;;
            "Screenshot: area to clipboard")
              sleep 0.3
              grim -g "$(slurp)" - | wl-copy && notify "Screenshot" "Copied to clipboard"
              ;;
            "Screenshot: area to file")
              sleep 0.3
              mkdir -p "$HOME/screenshots"
              f="$HOME/screenshots/shot-$(date +%Y%m%d-%H%M%S).png"
              grim -g "$(slurp)" "$f" && notify "Screenshot saved" "$f"
              ;;
            "Screenshot: full screen to file")
              sleep 0.3
              mkdir -p "$HOME/screenshots"
              f="$HOME/screenshots/shot-$(date +%Y%m%d-%H%M%S).png"
              grim "$f" && notify "Screenshot saved" "$f"
              ;;
            "Clipboard: History")
              if command -v cliphist >/dev/null 2>&1; then
                sel=$(cliphist list | menu --prompt "Clipboard" --width 640 --height 480)
                [ -n "$sel" ] && printf '%s' "$sel" | cliphist decode | wl-copy
              else
                notify "Clipboard" "cliphist is not installed"
              fi
              ;;
            "Clipboard: Clear history") cliphist wipe && notify "Clipboard" "History cleared" ;;
            "Audio: Toggle mute") wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle ;;
            "Audio: Toggle microphone mute") wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle ;;
            "Audio: Volume up") wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ ;;
            "Audio: Volume down") wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- ;;
            "Audio: Set volume to 100%") wpctl set-volume @DEFAULT_AUDIO_SINK@ 1.0 ;;
            "Display: Brightness up") brightnessctl set 5%+ ;;
            "Display: Brightness down") brightnessctl set 5%- ;;
            "Network: Wi-Fi and connections") term nmtui ;;
            "Network: Toggle Wi-Fi")
              if nmcli radio wifi | grep -q '^enabled'; then
                nmcli radio wifi off && notify "Wi-Fi" "Turned off"
              else
                nmcli radio wifi on && notify "Wi-Fi" "Turned on"
              fi
              ;;
            "Network: Show IP address")
              ip=$(ip -brief address | awk '$2 == "UP" {print $1 ": " $3}' | paste -sd ' ' -)
              notify "IP address" "${ip:-no active connection}"
              ;;
            "Bluetooth: Open bluetoothctl") term bluetoothctl ;;
            "Bluetooth: Toggle power")
              if bluetoothctl show | grep -q 'Powered: yes'; then
                bluetoothctl power off >/dev/null && notify "Bluetooth" "Turned off"
              else
                bluetoothctl power on >/dev/null && notify "Bluetooth" "Turned on"
              fi
              ;;
            "Hyprland: Reload config") hyprctl reload ;;
            "Hyprland: Show config errors") term sh -c 'hyprctl configerrors; echo; read -r _' ;;
            "Hyprland: Edit config") term nano "$HOME/.config/hypr/hyprland.lua" ;;
            "Hyprland: Show keybinds") term less "$HOME/.config/hypr/hyprland.lua" ;;
            "Hyprland: Restart waybar") pkill -x waybar; sleep 0.3; exec waybar ;;
            "System: System info") term sh -c 'fastfetch; echo; read -r _' ;;
            "System: Power menu") exec sh "$HOME/.config/hypr/power.sh" ;;
            "System: Lock screen") exec hyprlock ;;
            "System: Suspend") systemctl suspend ;;
            "System: Log out") hyprctl dispatch 'hl.dsp.exit()' ;;
            "System: Reboot") systemctl reboot ;;
            "System: Shut down") systemctl poweroff ;;
          esac
          WBPALETTE

          cat > "$CONF/hypr/screenshot.sh" <<'SHOTSH'
          #!/bin/sh
          # Super+Shift+S (or Print): drag an area, it is copied to the clipboard and
          # saved to ~/screenshots/. "screenshot.sh full" captures the whole screen.
          dir="$HOME/screenshots"
          mkdir -p "$dir"
          f="$dir/screenshot-$(date +%Y%m%d-%H%M%S).png"
          if [ "${1:-}" = "full" ]; then
            grim "$f" || exit 1
          else
            region=$(slurp) || exit 0
            grim -g "$region" "$f" || exit 1
          fi
          wl-copy --type image/png < "$f"
          command -v notify-send >/dev/null 2>&1 && notify-send -t 2500 "Screenshot saved" "$f"
          exit 0
          SHOTSH

          cat > "$CONF/kitty/kitty.conf" <<'KITTYCONF'
          shell fish
          font_size 11.0
          window_padding_width 10
          background_opacity 0.9
          background #000000
          foreground #e6e6e6
          cursor_shape beam
          confirm_os_window_close 0
          enable_audio_bell no
          KITTYCONF

          cat > "$CONF/fish/config.fish" <<'FISHCONF'
          function fish_greeting
              fastfetch
          end
          function fish_prompt
              set_color 8a8a8a
              echo (prompt_pwd)
              set_color ffffff
              echo -n '❯ '
              set_color normal
          end
          FISHCONF

          # Size: skip docs/man/info when the image is built.
          pc_found=0
          while IFS= read -r pc; do
            pc_found=1
            echo "NoExtract -> $pc"
            sedx -o "$pc" '/^\[options\]/a NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/*'
          done < <(find cachyos -maxdepth 3 -name 'pacman*.conf' -not -path '*/airootfs/*' -not -path '*/.git/*')
          [ "$pc_found" = 1 ] || echo "::warning::no pacman.conf found under cachyos/; skipping NoExtract"

          # Size: smaller squashfs (xz). Appended last so it overrides upstream.
          pd_found=0
          while IFS= read -r pd; do
            pd_found=1
            echo "squashfs xz -> $pd"
            grep -n 'airootfs_image' "$pd" || true
            printf "\nairootfs_image_tool_options=('-comp' 'xz' '-Xbcj' 'x86' '-b' '1M' '-Xdict-size' '1M')\n" >> "$pd"
          done < <(find cachyos -maxdepth 3 -name 'profiledef.sh' -not -path '*/airootfs/*' -not -path '*/.git/*')
          [ "$pd_found" = 1 ] || echo "::warning::no profiledef.sh found under cachyos/; skipping squashfs xz"

      - name: Patch boot robustness (slow VMs, removed services, networking)
        run: |
          set -euo pipefail
          AIROOT="cachyos/archiso/airootfs"
          SYSD="$AIROOT/etc/systemd/system"
          mkdir -p "$SYSD"

          # 1. Drop enable/alias symlinks for services whose packages we removed.
          #    Fixes: "Failed to preset all unit: dbus-org.freedesktop.ModemManager1.service
          #    is an unresolvable alias" (modemmanager is in REMOVE but its links remain).
          if [ -d "$AIROOT/etc/systemd" ]; then
            for u in ModemManager dbus-org.freedesktop.ModemManager1 \
                     avahi-daemon avahi-dnsconfd dbus-org.freedesktop.Avahi \
                     ntpd vboxservice vmtoolsd qemu-guest-agent spice-vdagentd \
                     bolt dbus-org.freedesktop.bolt pcscd; do
              find "$AIROOT/etc/systemd" -type l \
                \( -name "$u.service" -o -name "$u.socket" \) -print -delete
            done
          fi

          # 2. Tolerate slow / emulated VMs (no KVM, unstable TSC). The log shows
          #    journald, nsresourced and drm-module-load.target all hitting their
          #    start timeouts, which sends cachyos-drm-awaiter to the emergency shell.
          #    "zz-" sorts last so these override any upstream value.
          mkdir -p "$SYSD/drm-module-load.target.d" \
                   "$SYSD/systemd-journald.service.d" \
                   "$SYSD/systemd-nsresourced.service.d"
          printf '[Unit]\nJobTimeoutSec=300\n' \
            > "$SYSD/drm-module-load.target.d/zz-slow-vm.conf"
          printf '[Service]\nTimeoutStartSec=300\nWatchdogSec=0\n' \
            > "$SYSD/systemd-journald.service.d/zz-slow-vm.conf"
          printf '[Service]\nTimeoutStartSec=300\n' \
            > "$SYSD/systemd-nsresourced.service.d/zz-slow-vm.conf"

          # 3. A live ISO does not need to block on NTP sync; mask the wait unit.
          ln -sf /dev/null "$SYSD/systemd-time-wait-sync.service"

          # 4. Load common VM GPU drivers up front. In a QEMU virtio-gpu VM the DRM
          #    device (Virtual-1) only appeared after drm-module-load.target had
          #    already timed out. Missing modules just log a warning; on real
          #    hardware these load harmlessly without matching devices.
          mkdir -p "$AIROOT/etc/modules-load.d"
          printf 'virtio_gpu\nbochs\nvmwgfx\nhyperv_drm\n' \
            > "$AIROOT/etc/modules-load.d/vm-gpu.conf"

          # 5. Enable NetworkManager (build-time equivalent of
          #    `systemctl enable NetworkManager`). `--now` is meaningless here:
          #    there is no running systemd inside the airootfs. the
          #    Hyprland session (waybar network module, nmtui) needs this service. wait-online is deliberately
          #    NOT enabled; it only slows boot.
          mkdir -p "$SYSD/multi-user.target.wants"
          ln -sf /usr/lib/systemd/system/NetworkManager.service \
            "$SYSD/multi-user.target.wants/NetworkManager.service"
          ln -sf /usr/lib/systemd/system/NetworkManager-dispatcher.service \
            "$SYSD/dbus-org.freedesktop.nm-dispatcher.service"

          # 6. mkarchiso deletes the pacman sync databases from the image, so every
          #    `pacman -S` needed a manual `pacman -Sy` first. Fetch them in the
          #    background once the network is up (retries for ~10 minutes, never
          #    blocks boot). Without a network connection you still need `-Sy` by hand.
          cat > "$AIROOT/etc/pacman-live-sync.sh" <<'SYNCSH'
          #!/bin/sh
          i=0
          while [ "$i" -lt 60 ]; do
            pacman -Sy --noconfirm && exit 0
            i=$((i + 1))
            sleep 10
          done
          exit 1
          SYNCSH
          cat > "$SYSD/pacman-live-sync.service" <<'SYNCUNIT'
          [Unit]
          Description=Sync pacman databases once the network is up (live ISO)
          After=NetworkManager.service pacman-init.service
          Wants=NetworkManager.service

          [Service]
          Type=simple
          ExecStart=/bin/sh /etc/pacman-live-sync.sh

          [Install]
          WantedBy=multi-user.target
          SYNCUNIT
          ln -sf /etc/systemd/system/pacman-live-sync.service \
            "$SYSD/multi-user.target.wants/pacman-live-sync.service"

          # 7. Make the most of RAM in the live session (the live filesystem itself
          #    lives in RAM, so every MB saved here is a MB for your apps).
          #    a) zram: compressed swap inside RAM (same setup CachyOS uses on installs):
          #       size limit = RAM, zstd compression, top swap priority. The limit is
          #       not reserved memory; RAM is only used for pages actually swapped,
          #       and zstd typically stores them at 2-3x smaller.
          cat > "$AIROOT/etc/systemd/zram-generator.conf" <<'ZRAMCONF'
          [zram0]
          zram-size = ram
          compression-algorithm = zstd
          swap-priority = 100
          fs-type = swap
          ZRAMCONF
          #    b) Kernel tuning that suits zram (prefer compressed swap over dropping
          #       file cache; no read-ahead since zram is not a spinning disk).
          mkdir -p "$AIROOT/etc/sysctl.d"
          cat > "$AIROOT/etc/sysctl.d/99-live-ram.conf" <<'SYSCTLCONF'
          vm.swappiness = 180
          vm.page-cluster = 0
          vm.watermark_boost_factor = 0
          vm.watermark_scale_factor = 125
          SYSCTLCONF
          #       zswap would compress a second time on top of zram, so switch it off.
          mkdir -p "$AIROOT/etc/tmpfiles.d"
          printf 'w- /sys/module/zswap/parameters/enabled - - - - 0\n' \
            > "$AIROOT/etc/tmpfiles.d/99-live-zswap-off.conf"
          #    c) Logs stay in RAM and are capped; no core dumps are stored.
          mkdir -p "$AIROOT/etc/systemd/journald.conf.d" "$AIROOT/etc/systemd/coredump.conf.d"
          printf '[Journal]\nStorage=volatile\nRuntimeMaxUse=32M\n' \
            > "$AIROOT/etc/systemd/journald.conf.d/50-live-cap.conf"
          printf '[Coredump]\nStorage=none\nProcessSizeMax=0\n' \
            > "$AIROOT/etc/systemd/coredump.conf.d/50-live-none.conf"
          #    d) Downloaded .pkg files would sit in RAM; delete them after each
          #       pacman install/upgrade (the package databases are kept).
          mkdir -p "$AIROOT/etc/pacman.d/hooks"
          cat > "$AIROOT/etc/pacman.d/hooks/zz-live-clean-cache.hook" <<'CLEANHOOK'
          [Trigger]
          Operation = Install
          Operation = Upgrade
          Type = Package
          Target = *

          [Action]
          Description = Freeing RAM: removing downloaded package files (live session)
          When = PostTransaction
          Exec = /usr/bin/find /var/cache/pacman/pkg -maxdepth 1 -type f -delete
          CLEANHOOK
          #    e) Background timers that only make sense on an installed system.
          #       (Masking a unit that is not installed is harmless.)
          for t in man-db.timer shadow.timer archlinux-keyring-wkd-sync.timer \
                   plocate-updatedb.timer fstrim.timer; do
            ln -sf /dev/null "$SYSD/$t"
          done

      - name: Patch Boot Entries
        run: |
          set -euo pipefail
          GRUB=cachyos/archiso/grub/grub.cfg
          sedx "$GRUB" 's|linux-cachyos-lts|linux-cachyos|g'
          sedx "$GRUB" '/^menuentry "CachyOS LTS Kernel"/,/^}/ s/^/# /'

          EFI_DIR=cachyos/archiso/efiboot/loader/entries
          DEFAULT_ENTRY=02-archiso-linux-cachyos.conf
          rm -f "$EFI_DIR/01-archiso-linux.conf"
          rm -f "$EFI_DIR/03-archiso-memtest86+.conf"
          sedx -o "$EFI_DIR/fallback.conf" 's|linux-cachyos-lts|linux-cachyos|g'

          if [ ! -f "$EFI_DIR/$DEFAULT_ENTRY" ]; then
            echo "PATCH FAIL: boot entry $DEFAULT_ENTRY not found. Entries present:" >&2
            ls -1 "$EFI_DIR" >&2
            exit 1
          fi
          sedx -o cachyos/archiso/efiboot/loader/loader.conf "s|^default .*|default ${DEFAULT_ENTRY}|"

          # --- syslinux (BIOS) ---
          # This is the menu that prints "Loading /arch/boot/x86_64/vmlinuz-...: failed".
          SYSLINUX=cachyos/archiso/syslinux
          if [ ! -d "$SYSLINUX" ]; then
            echo "PATCH FAIL: $SYSLINUX not found. Contents of cachyos/archiso:" >&2
            ls -1 cachyos/archiso >&2
            exit 1
          fi
          # For each config that mentions the LTS kernel:
          #  - if a plain linux-cachyos entry also exists, drop the LTS LABEL stanzas;
          #  - if NOT (the BIOS menu may only have LTS entries), repoint them to
          #    linux-cachyos instead, so the menu is never left without a bootable entry.
          for f in "$SYSLINUX"/*.cfg; do
            grep -q 'linux-cachyos-lts' "$f" || continue
            awk '
              function flush() { if (buf != "" && buf !~ /linux-cachyos-lts/) printf "%s", buf; buf = "" }
              tolower($0) ~ /^[ \t]*label[ \t]/ { flush(); buf = $0 ORS; next }
              buf != "" { buf = buf $0 ORS; next }
              { print }
              END { flush() }
            ' "$f" > "$f.new"
            if grep -qE 'vmlinuz-linux-cachyos([^-]|$)' "$f.new"; then
              mv "$f.new" "$f"
              echo "syslinux: removed LTS entries from $f"
            else
              rm -f "$f.new"
              sed -i 's|linux-cachyos-lts|linux-cachyos|g' "$f"
              echo "syslinux: no plain entry in $f; repointed LTS entries to linux-cachyos"
            fi
          done
          echo "::group::syslinux configs after patch"
          for f in "$SYSLINUX"/*.cfg; do echo "=== $f"; cat "$f"; done
          echo "::endgroup::"

          # --- copytoram ---
          # Boot straight from USB instead of copying the whole image into RAM.
          { grep -rIl 'copytoram' cachyos/archiso || true; } | while IFS= read -r f; do
            sed -i -E 's/[[:space:]]+copytoram(=[a-zA-Z0-9]+)?//g' "$f"
          done

          # --- Catch-all ---
          # Anything under archiso/ that still names the LTS kernel gets rewritten,
          # and LTS-named files (e.g. a linux-cachyos-lts.preset) are deleted.
          { grep -rIl 'linux-cachyos-lts' cachyos/archiso || true; } | while IFS= read -r f; do
            echo "catch-all: rewriting LTS reference in $f"
            sed -i 's|linux-cachyos-lts|linux-cachyos|g' "$f"
          done
          find cachyos/archiso -name '*linux-cachyos-lts*' -prune -print -exec rm -rf {} +

      - name: Stamp version into the ISO
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          up=$(git -c safe.directory='*' -C cachyos rev-parse HEAD)
          mkdir -p cachyos/archiso/airootfs/etc
          {
            echo "NAME=\"CachyOS Hyprland ISO\""
            echo "VERSION=\"$VERSION\""
            echo "BUILD_DATE=\"$(date -u +%Y-%m-%d)\""
            echo "UPSTREAM_COMMIT=\"$up\""
            echo "REPO=\"https://github.com/${{ github.repository }}\""
          } > cachyos/archiso/airootfs/etc/cachyos-hyprland-release

      - name: Verify patched profile
        run: |
          set -euo pipefail
          fail=0
          PKG_LIST=cachyos/archiso/packages_desktop.x86_64

          for pkg in plasma-desktop plasma-login-manager linux-cachyos-lts firefox; do
            if grep -qxF "$pkg" "$PKG_LIST"; then echo "VERIFY FAIL: $pkg still in package list" >&2; fail=1; fi
          done
          if grep -q 'plasmalogin\.service' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: plasmalogin.service still referenced in util-iso.sh" >&2; fail=1
          fi
          if ! grep -q 'greetd\.service' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: greetd.service not referenced in util-iso.sh" >&2; fail=1
          fi
          if grep -qF 'sign_with_key $f' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: signing call still present in util-iso.sh" >&2; fail=1
          fi
          for f in etc/greetd/config.toml etc/greetd/hypr-session.sh etc/skel/.config/hypr/hyprland.lua etc/skel/.config/hypr/palette.sh etc/skel/.config/hypr/screenshot.sh etc/skel/.config/waybar/config.jsonc etc/skel/.config/waybar/style.css etc/skel/.config/kitty/kitty.conf etc/skel/.config/fish/config.fish etc/skel/.config/hypr/power.sh etc/skel/.config/hypr/ws.sh etc/skel/.config/hypr/ws-watch.sh etc/skel/.config/wofi/config etc/skel/.config/wofi/style.css etc/skel/.config/wofi/power.css etc/skel/.config/brave-flags.conf etc/systemd/zram-generator.conf etc/sysctl.d/99-live-ram.conf etc/tmpfiles.d/99-live-zswap-off.conf etc/systemd/journald.conf.d/50-live-cap.conf etc/systemd/coredump.conf.d/50-live-none.conf etc/pacman.d/hooks/zz-live-clean-cache.hook; do
            [ -s "cachyos/archiso/airootfs/$f" ] || { echo "VERIFY FAIL: missing/empty airootfs/$f" >&2; fail=1; }
          done
          for sh_file in palette.sh screenshot.sh power.sh ws.sh ws-watch.sh; do
            if ! sh -n "cachyos/archiso/airootfs/etc/skel/.config/hypr/$sh_file"; then
              echo "VERIFY FAIL: $sh_file has a shell syntax error" >&2; fail=1
            fi
          done
          if ! grep -q 'SHIFT + S.*screenshot\.sh' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+Shift+S is not bound to the screenshot script" >&2; fail=1
          fi
          if ! grep -q 'SPACE.*palette\.sh' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+Space is not bound to the command palette" >&2; fail=1
          fi
          if ! luac -p cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: hyprland.lua has a Lua syntax error" >&2; fail=1
          fi
          if ! python3 -m json.tool cachyos/archiso/airootfs/etc/skel/.config/waybar/config.jsonc >/dev/null; then
            echo "VERIFY FAIL: waybar config.jsonc is not valid JSON" >&2; fail=1
          fi
          if [ -e cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.conf ]; then
            echo "VERIFY FAIL: legacy hyprland.conf shipped (ignored by Hyprland 0.57+)" >&2; fail=1
          fi
          if find cachyos/archiso/airootfs/etc/systemd -name '*ModemManager*' 2>/dev/null | grep -q .; then
            echo "VERIFY FAIL: ModemManager unit links still in airootfs" >&2; fail=1
          fi
          [ -f cachyos/archiso/airootfs/etc/systemd/system/drm-module-load.target.d/zz-slow-vm.conf ] \
            || { echo "VERIFY FAIL: slow-VM drop-ins missing" >&2; fail=1; }
          [ -L cachyos/archiso/airootfs/etc/systemd/system/multi-user.target.wants/pacman-live-sync.service ] \
            || { echo "VERIFY FAIL: pacman-live-sync not enabled" >&2; fail=1; }
          sh -n cachyos/archiso/airootfs/etc/pacman-live-sync.sh \
            || { echo "VERIFY FAIL: pacman-live-sync.sh syntax error" >&2; fail=1; }
          [ -L cachyos/archiso/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service ] \
            || { echo "VERIFY FAIL: NetworkManager not enabled" >&2; fail=1; }
          if grep -rIn 'linux-cachyos-lts' cachyos/archiso; then
            echo "VERIFY FAIL: LTS kernel still referenced under archiso/ (lines above)" >&2; fail=1
          fi
          if ! grep -rqE 'vmlinuz-linux-cachyos([^-]|$)' cachyos/archiso/syslinux; then
            echo "VERIFY FAIL: no syslinux entry boots vmlinuz-linux-cachyos. Syslinux label/kernel lines:" >&2
            ls -1 cachyos/archiso/syslinux >&2 || true
            grep -rniE '^[[:space:]]*(label|linux|kernel|initrd)' cachyos/archiso/syslinux >&2 || true
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

          echo "--- LTS kernel references outside archiso/ (review, non-fatal) ---"
          grep -rIn 'linux-cachyos-lts' cachyos --exclude-dir=.git --exclude-dir=archiso || echo "none"

          echo "--- Leftover KDE/Plasma/SDDM references in airootfs (review, non-fatal) ---"
          grep -rIil 'plasma\|kwin\|sddm' cachyos/archiso/airootfs || echo "none"

          echo "--- Patch summary ---"
          git -c safe.directory='*' -C cachyos diff --stat || true
          chown -R builder:builder cachyos
      # ------------------------------------------------------------------
      # PATCHES END HERE
      # ------------------------------------------------------------------

      - name: Build the ISO
        run: |
          set -uo pipefail
          cd cachyos
          chmod +x ./buildiso.sh
          sudo chown -R builder:builder /var/cache/pacman/pkg

          rm -rf build/ work/ out/*

          # Keep a copy of the full log so a failed build can be inspected
          # from the "build-log" artifact instead of scrolling the Actions UI.
          set +e
          sudo -H -E -u builder ./buildiso.sh -p desktop -v -w 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"
          build_rc=${PIPESTATUS[0]}
          set -e
          echo "buildiso.sh exit code: $build_rc"

          if ls out/*/*.iso 1>/dev/null 2>&1; then
            echo "ISO successfully compiled."
            if [ "$build_rc" -ne 0 ]; then
              echo "::warning::buildiso.sh exited $build_rc but produced an ISO; check the log."
            fi
            find out -name '*.iso' -exec ls -lh {} \;
          else
            echo "ISO file not found — build failed." >&2
            exit 1
          fi
        working-directory: ${{ github.workspace }}

      - name: Prune pacman cache
        if: ${{ !cancelled() }}
        run: |
          # Drop half-finished downloads and old versions so the cache stays small.
          find /var/cache/pacman/pkg -maxdepth 1 \( -name 'download-*' -o -name '*.part' \) -exec rm -rf {} + || true
          paccache -rk1 -c /var/cache/pacman/pkg || true
          du -sh /var/cache/pacman/pkg || true

      - name: Save pacman package cache
        if: ${{ !cancelled() && steps.pacman-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-v1-${{ steps.cachekey.outputs.week }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Rename ISO
        env:
          ISO_NAME: ${{ steps.meta.outputs.iso_name }}
        run: |
          set -euo pipefail
          # Give the ISO a stable name and drop upstream's checksum/signature files;
          # a fresh .sha256 for the new name is written in a later step.
          n=0
          while IFS= read -r iso; do
            dir=$(dirname "$iso")
            if [ "$n" -eq 0 ]; then new="$dir/$ISO_NAME"; else new="$dir/${ISO_NAME%.iso}-$n.iso"; fi
            rm -f "$iso".*
            if [ "$iso" != "$new" ]; then mv "$iso" "$new"; fi
            echo "ISO: $new"
            n=$((n + 1))
          done < <(find cachyos/out -name '*.iso' | sort)
          [ "$n" -gt 0 ] || { echo "::error::no ISO found to rename" >&2; exit 1; }

      - name: Check boot configs against kernels in the ISO
        run: |
          set -euo pipefail
          iso=$(find cachyos/out -name '*.iso' | head -n1)
          echo "Checking $iso"
          tmp=$(mktemp -d)
          list="$tmp.list"
          mkdir -p "$tmp/cfg"

          # Tooling problems only warn; only a real kernel mismatch fails the job.
          if ! bsdtar -t -f "$iso" > "$list"; then
            echo "::warning::bsdtar could not read the ISO; skipping boot config check."
            exit 0
          fi

          # Extract only boot config files that actually exist in the ISO tree
          # (the systemd-boot .conf entries live inside efiboot.img, not the tree).
          mapfile -t cfgs < <(grep -E '\.(cfg|conf)$' "$list" || true)
          if [ "${#cfgs[@]}" -gt 0 ]; then
            bsdtar -x -f "$iso" -C "$tmp/cfg" "${cfgs[@]}" \
              || echo "::warning::bsdtar reported errors while extracting boot configs; continuing."
          fi
          echo "Boot config files found in ISO tree: ${#cfgs[@]}"

          mapfile -t kernels < <(sed -n 's|.*/\(vmlinuz-[^/]*\)$|\1|p' "$list" | sort -u)
          if [ "${#kernels[@]}" -eq 0 ]; then
            echo "::warning::Could not find any kernels in the ISO listing; skipping boot config check."
            exit 0
          fi
          echo "Kernels in ISO: ${kernels[*]}"

          refs=$(grep -rhoE 'vmlinuz-[A-Za-z0-9._+-]+' "$tmp/cfg" | sort -u || true)
          if [ -z "$refs" ]; then
            echo "::warning::No kernel references found in the ISO's boot configs."
          fi
          bad=0
          for ref in $refs; do
            if ! printf '%s\n' "${kernels[@]}" | grep -qxF "$ref"; then
              echo "BOOT CHECK FAIL: a boot config references '$ref' but the ISO has no such kernel" >&2
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

      - name: Check ISO size against release limit
        id: size
        run: |
          set -euo pipefail
          limit=$((2 * 1024 * 1024 * 1024))   # GitHub release assets must be < 2 GiB
          ok=true
          while IFS= read -r iso; do
            size=$(stat -c %s "$iso")
            echo "$iso: $((size / 1024 / 1024)) MiB"
            if [ "$size" -ge "$limit" ]; then ok=false; fi
          done < <(find cachyos/out -name '*.iso')
          echo "release_ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = false ]; then
            msg="ISO is 2 GiB or larger: GitHub Releases will reject it, so the release step is skipped. The workflow artifact is still uploaded."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure checksums and write summary
        run: |
          set -euo pipefail
          {
            echo "### Built ISO"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r iso; do
            dir=$(dirname "$iso"); base=$(basename "$iso")
            # Create a .sha256 only if upstream did not already produce one.
            if [ ! -f "$iso.sha256" ]; then
              (cd "$dir" && sha256sum "$base" > "$base.sha256")
            fi
            sum=$(cut -d' ' -f1 "$iso.sha256")
            size=$(du -h "$iso" | cut -f1)
            echo "| \`$base\` | $size | \`$sum\` |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find cachyos/out -name '*.iso')

      # Release assets do not count toward Actions storage, so only keep an
      # artifact copy when the ISO is NOT going to a release.
      - name: Upload ISO as Artifact
        if: steps.meta.outputs.release != 'true' || steps.size.outputs.release_ok != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-hyprland-iso
          path: |
            cachyos/out/**/*.iso
            cachyos/out/**/*.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0   # ISOs are already compressed

      - name: Write release notes
        if: steps.meta.outputs.release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          iso=$(find cachyos/out -name '*.iso' | sort | head -n1)
          sum=$(cut -d' ' -f1 "$iso.sha256")
          size=$(du -h "$iso" | cut -f1)
          up=$(git -c safe.directory='*' -C cachyos rev-parse --short HEAD)
          # Pull this version's section ("## 1.0.3" or "## [1.0.3] - date") out of CHANGELOG.md.
          changelog=$(mktemp)
          if [ -f repo-src/CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / { if (found) exit; t=$2; gsub(/[\[\]]/, "", t); if (t == v) { found=1; next } }
              found { print }' repo-src/CHANGELOG.md \
              | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '/./,$!d' > "$changelog"
          fi
          if [ -s "$changelog" ]; then
            echo "Release description: CHANGELOG.md section ${VERSION}"
            echo "Release description: CHANGELOG.md section \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No section for ${VERSION} in CHANGELOG.md; using the default release description."
            echo "Release description: default (no CHANGELOG.md section for ${VERSION})" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "## CachyOS Hyprland ISO v${VERSION}"
            echo ""
            if [ -s "$changelog" ]; then
              echo "### What's new"
              echo ""
              cat "$changelog"
            else
              echo "Unofficial CachyOS live ISO with a Hyprland desktop instead of KDE Plasma."
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$iso")\` |"
            echo "| Size | $size |"
            echo "| SHA-256 | \`$sum\` |"
            echo "| Upstream | CachyOS-Live-ISO \`$up\` |"
            echo ""
            echo "### Before you boot"
            echo ""
            echo "- 4 GB of RAM is the practical minimum, 8 GB or more is recommended. Live changes are kept in RAM and lost on reboot."
            echo "- Disable Secure Boot."
            echo "- Verify the download with \`sha256sum -c <file>.sha256\`."
            echo "- This is not an official CachyOS release."
            echo ""
          } > release-notes.md

      - name: Release ISO
        if: steps.meta.outputs.release == 'true' && steps.size.outputs.release_ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease == true }}
          body_path: release-notes.md
          files: |
            cachyos/out/**/*.iso
            cachyos/out/**/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note when release was skipped
        if: steps.meta.outputs.release != 'true'
        run: |
          echo "Release skipped (release=false). The ISO is available as the workflow artifact." >> "$GITHUB_STEP_SUMMARY"
