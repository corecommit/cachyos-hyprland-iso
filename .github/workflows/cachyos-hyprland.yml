          #* Option to disable presets. Either the default preset, custom presets, or all presets.
          #* "Off" All presets are enabled.
          #* "Default" preset is disabled.#* "Custom" presets are disabled.#* "All" presets are disabled.
          disable_presets = "Off"

          #* Define presets for the layout of the boxes. Preset 0 is always all boxes shown with default settings. Max 9 presets.
          #* Format: "box_name:P:G,box_name:P:G" P=(0 or 1) for alternate positions, G=graph symbol to use for box.
          #* Use whitespace " " as separator between different presets.
          #* Example: "cpu:0:default,mem:0:tty,proc:1:default cpu:0:braille,proc:0:tty"
          presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"

          #* Set to True to enable "h,j,k,l,g,G" keys for directional control in lists.
          #* Conflicting keys for h:"help" and k:"kill" is accessible while holding shift.
          vim_keys = false

          #* Disable all mouse events.
          disable_mouse = false

          #* Rounded corners on boxes, is ignored if TTY mode is ON.
          rounded_corners = true

          #* Use terminal synchronized output sequences to reduce flickering on supported terminals.
          terminal_sync = true

          #* Default symbols to use for graph creation, "braille", "block" or "tty".
          #* "braille" offers the highest resolution but might not be included in all fonts.
          #* "block" has half the resolution of braille but uses more common characters.
          #* "tty" uses only 3 different symbols but will work with most fonts and should work in a real TTY.
          #* Note that "tty" only has half the horizontal resolution of the other two, so will show a shorter historical view.
          graph_symbol = "braille"

          # Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
          graph_symbol_cpu = "default"

          # Graph symbol to use for graphs in gpu box, "default", "braille", "block" or "tty".
          graph_symbol_gpu = "default"

          # Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
          graph_symbol_mem = "default"

          # Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
          graph_symbol_net = "default"

          # Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
          graph_symbol_proc = "default"

          #* Manually set which boxes to show. Available values are "cpu mem net proc" and "gpu0" through "gpu5", separate values with whitespace.
          shown_boxes = "cpu mem net proc"

          #* Update time in milliseconds, recommended 2000 ms or above for better sample times for graphs.
          update_ms = 500

          #* Processes sorting, "pid" "program" "arguments" "threads" "user" "memory" "cpu lazy" "cpu direct",
          #* "cpu lazy" sorts top process over time (easier to follow), "cpu direct" updates top process directly.
          proc_sorting = "cpu lazy"

          #* Reverse sorting order, True or False.
          proc_reversed = false

          #* Show processes as a tree.
          proc_tree = false

          #* Use the cpu graph colors in the process list.
          proc_colors = true

          #* Use a darkening gradient in the process list.
          proc_gradient = true

          #* If process cpu usage should be of the core it's running on or usage of the total available cpu power.
          proc_per_core = false

          #* Show process memory as bytes instead of percent.
          proc_mem_bytes = true

          #* Show cpu graph for each process.
          proc_cpu_graphs = true

          #* Use /proc/[pid]/smaps for memory information in the process info box (very slow but more accurate)
          proc_info_smaps = false

          #* Show proc box on left side of screen instead of right.
          proc_left = false

          #* (Linux) Filter processes tied to the Linux kernel(similar behavior to htop).
          proc_filter_kernel = false

          #* Should the process list follow the selected process when detailed view is open.
          proc_follow_detailed = true

          #* In tree-view, always accumulate child process resources in the parent process.
          proc_aggregate = false

          #* Should cpu and memory usage display be preserved for dead processes when paused.
          keep_dead_proc_usage = false

          #* Sets the CPU stat shown in upper half of the CPU graph, "total" is always available.
          #* Select from a list of detected attributes from the options menu.
          cpu_graph_upper = "Auto"

          #* Sets the CPU stat shown in lower half of the CPU graph, "total" is always available.
          #* Select from a list of detected attributes from the options menu.
          cpu_graph_lower = "Auto"

          #* If gpu info should be shown in the cpu box. Available values = "Auto", "On" and "Off".
          show_gpu_info = "Auto"

          #* Toggles if the lower CPU graph should be inverted.
          cpu_invert_lower = true

          #* Set to True to completely disable the lower CPU graph.
          cpu_single_graph = false

          #* Show cpu box at bottom of screen instead of top.
          cpu_bottom = false

          #* Shows the system uptime in the CPU box.
          show_uptime = true

          #* Shows the CPU package current power consumption in watts. Requires running `make setcap` or `make setuid` or running with sudo.
          show_cpu_watts = true

          #* Show cpu temperature.
          check_temp = true

          #* Which sensor to use for cpu temperature, use options menu to select from list of available sensors.
          cpu_sensor = "Auto"

          #* Show temperatures for cpu cores also if check_temp is True and sensors has been found.
          show_coretemp = true

          #* Set a custom mapping between core and coretemp, can be needed on certain cpus to get correct temperature for correct core.
          #* Use lm-sensors or similar to see which cores are reporting temperatures on your machine.
          #* Format "x:y" x=core with wrong temp, y=core with correct temp, use space as separator between multiple entries.
          #* Example: "4:0 5:1 6:3"
          cpu_core_map = ""

          #* Which temperature scale to use, available values: "celsius", "fahrenheit", "kelvin" and "rankine".
          temp_scale = "celsius"

          #* Use base 10 for bits/bytes sizes, KB = 1000 instead of KiB = 1024.
          base_10_sizes = false

          #* Show CPU frequency.
          show_cpu_freq = true

          #* How to calculate CPU frequency, available values: "first", "range", "lowest", "highest" and "average".
          freq_mode = "first"

          #* Draw a clock at top of screen, formatting according to strftime, empty string to disable.
          #* Special formatting: /host = hostname | /user = username | /uptime = system uptime
          clock_format = "%X"

          #* Update main ui in background when menus are showing, set this to false if the menus is flickering too much for comfort.
          background_update = true

          #* Custom cpu model name, empty string to disable.
          custom_cpu_name = ""

          #* Optional filter for shown disks, should be full path of a mountpoint, separate multiple values with whitespace " ".
          #* Only disks matching the filter will be shown. Prepend exclude= to only show disks not matching the filter. Examples: disk_filter="/boot /home/user", disks_filter="exclude=/boot /home/user"
          disks_filter = ""

          #* Show graphs instead of meters for memory values.
          mem_graphs = true

          #* Show mem box below net box instead of above.
          mem_below_net = false

          #* Count ZFS ARC in cached and available memory.
          zfs_arc_cached = true

          #* If swap memory should be shown in memory box.
          show_swap = true

          #* Show swap as a disk, ignores show_swap value above, inserts itself after first disk.
          swap_disk = true

          #* If mem box should be split to also show disks info.
          show_disks = true

          #* Filter out non physical disks. Set this to False to include network disks, RAM disks and similar.
          only_physical = true

          #* Read disks list from /etc/fstab. This also disables only_physical.
          use_fstab = true

          #* Setting this to True will hide all datasets, and only show ZFS pools. (IO stats will be calculated per-pool)
          zfs_hide_datasets = false

          #* Set to true to show available disk space for privileged users.
          disk_free_priv = false

          #* Toggles if io activity % (disk busy time) should be shown in regular disk usage view.
          show_io_stat = true

          #* Toggles io mode for disks, showing big graphs for disk read/write speeds.
          io_mode = false

          #* Set to True to show combined read/write io graphs in io mode.
          io_graph_combined = false

          #* Set the top speed for the io graphs in MiB/s (100 by default), use format "mountpoint:speed" separate disks with whitespace " ".
          #* Example: "/mnt/media:100 /:20 /boot:1".
          io_graph_speeds = ""

          #* Swap the positions of the upload and download speed graphs. When true, upload will be on top.
          swap_upload_download = false

          #* Set fixed values for network graphs in Mebibits. Is only used if net_auto is also set to False.
          net_download = 100

          net_upload = 100

          #* Use network graphs auto rescaling mode, ignores any values set above and rescales down to 10 Kibibytes at the lowest.
          net_auto = true

          #* Sync the auto scaling for download and upload to whichever currently has the highest scale.
          net_sync = true

          #* Starts with the Network Interface specified here.
          net_iface = ""

          #* "True" shows bitrates in base 10 (Kbps, Mbps). "False" shows bitrates in binary sizes (Kibps, Mibps, etc.). "Auto" uses base_10_sizes.
          base_10_bitrate = "Auto"

          #* Show battery stats in top right if battery is present.
          show_battery = true

          #* Which battery to use if multiple are present. "Auto" for auto detection.
          selected_battery = "Auto"

          #* Show power stats of battery next to charge indicator.
          show_battery_watts = true

          #* Set loglevel for "~/.local/state/btop.log" levels are: "ERROR" "WARNING" "INFO" "DEBUG".
          #* The level set includes all lower levels, i.e. "DEBUG" will show all logging info.
          log_level = "WARNING"

          #* Automatically save current settings to config file on exit.
          save_config_on_exit = true

          #* Measure PCIe throughput on NVIDIA cards, may impact performance on certain cards.
          nvml_measure_pcie_speeds = true

          #* Measure PCIe throughput on AMD cards, may impact performance on certain cards.
          rsmi_measure_pcie_speeds = true

          #* Horizontally mirror the GPU graph.
          gpu_mirror_graph = true

          #* Set which GPU vendors to show. Available values are "nvidia amd intel apple"
          shown_gpus = "nvidia amd intel apple"

          #* Custom gpu0 model name, empty string to disable.
          custom_gpu_name0 = ""

          #* Custom gpu1 model name, empty string to disable.
          custom_gpu_name1 = ""

          #* Custom gpu2 model name, empty string to disable.
          custom_gpu_name2 = ""

          #* Custom gpu3 model name, empty string to disable.
          custom_gpu_name3 = ""

          #* Custom gpu4 model name, empty string to disable.
          custom_gpu_name4 = ""

          #* Custom gpu5 model name, empty string to disable.
          custom_gpu_name5 = ""
          BTOPCONF

          # ---- idle, lock screen, notifications ----
          cat > "$CONF/hypr/hypridle.conf" <<'HYPRIDLE'
          general {
              before_sleep_cmd = hyprlock
              after_sleep_cmd = hyprctl dispatch dpms on
          }
          listener {
              timeout = 150
              on-timeout = brightnessctl -s set 10%
              on-resume = brightnessctl -r
          }
          listener {
              timeout = 300
              on-timeout = hyprctl dispatch dpms off
              on-resume = hyprctl dispatch dpms on
          }
          listener {
              timeout = 1200
              on-timeout = systemctl suspend
          }
          HYPRIDLE

          # The live user has no password, so Enter on an empty field unlocks.
          cat > "$CONF/hypr/hyprlock.conf" <<'HYPRLOCK'
          background {
              monitor =
              path = ~/.config/hypr/wallpaper.png
              blur_passes = 2
              blur_size = 8
          }
          input-field {
              monitor =
              size = 300, 50
              outline_thickness = 2
              dots_size = 0.25
              outer_color = rgba(199, 171, 122, 0.8)
              inner_color = rgba(40, 40, 40, 0.9)
              font_color = rgb(199, 171, 122)
              placeholder_text = Press Enter to unlock
              position = 0, -20
              halign = center
              valign = center
          }
          label {
              monitor =
              text = $TIME
              color = rgba(199, 171, 122, 1.0)
              font_size = 96
              font_family = Inter
              position = 0, 120
              halign = center
              valign = center
          }
          label {
              monitor =
              text = cmd[update:60000] date +"%A, %d %B"
              color = rgba(129, 146, 153, 1.0)
              font_size = 20
              font_family = Inter
              position = 0, 20
              halign = center
              valign = center
          }
          HYPRLOCK

          cat > "$CONF/mako/config" <<'MAKOCONF'
          font=Inter 11
          background-color=#282828ee
          text-color=#c7ab7a
          border-color=#819299
          border-size=1
          border-radius=6
          padding=12
          margin=10
          anchor=bottom-right
          default-timeout=5000
          max-visible=3
          width=360
          height=140
          MAKOCONF

          # Size: skip docs/man/info when the image is built.
          pc_found=0
          while IFS= read -r pc; do
            pc_found=1
            echo "NoExtract -> $pc"
            sedx -o "$pc" '/^\[options\]/a NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/*'
          done < <(find cachyos -maxdepth 3 -name 'pacman*.conf' -not -path '*/airootfs/*' -not -path '*/.git/*')
          [ "$pc_found" = 1 ] || echo "::warning::no pacman.conf found under cachyos/; skipping NoExtract"

          # Size: smaller squashfs (xz). Appended last so it overrides upstream.
          pd_found=0
          while IFS= read -r pd; do
            pd_found=1
            echo "squashfs xz -> $pd"
            grep -n 'airootfs_image' "$pd" || true
            printf "\nairootfs_image_tool_options=('-comp' 'xz' '-Xbcj' 'x86' '-b' '1M' '-Xdict-size' '1M')\n" >> "$pd"
          done < <(find cachyos -maxdepth 3 -name 'profiledef.sh' -not -path '*/airootfs/*' -not -path '*/.git/*')
          [ "$pd_found" = 1 ] || echo "::warning::no profiledef.sh found under cachyos/; skipping squashfs xz"

      - name: Patch boot robustness (slow VMs, removed services, networking)
        run: |
          set -euo pipefail
          AIROOT="cachyos/archiso/airootfs"
          SYSD="$AIROOT/etc/systemd/system"
          mkdir -p "$SYSD"

          # 1. Drop enable/alias symlinks for services whose packages we removed.
          #    Fixes: "Failed to preset all unit: dbus-org.freedesktop.ModemManager1.service
          #    is an unresolvable alias" (modemmanager is in REMOVE but its links remain).
          if [ -d "$AIROOT/etc/systemd" ]; then
            for u in ModemManager dbus-org.freedesktop.ModemManager1 \
                     avahi-daemon avahi-dnsconfd dbus-org.freedesktop.Avahi \
                     ntpd vboxservice vmtoolsd qemu-guest-agent spice-vdagentd \
                     bolt dbus-org.freedesktop.bolt pcscd; do
              find "$AIROOT/etc/systemd" -type l \
                \( -name "$u.service" -o -name "$u.socket" \) -print -delete
            done
          fi

          # 2. Tolerate slow / emulated VMs (no KVM, unstable TSC). The log shows
          #    journald, nsresourced and drm-module-load.target all hitting their
          #    start timeouts, which sends cachyos-drm-awaiter to the emergency shell.
          #    "zz-" sorts last so these override any upstream value.
          mkdir -p "$SYSD/drm-module-load.target.d" \
                   "$SYSD/systemd-journald.service.d" \
                   "$SYSD/systemd-nsresourced.service.d"
          printf '[Unit]\nJobTimeoutSec=300\n' \
            > "$SYSD/drm-module-load.target.d/zz-slow-vm.conf"
          printf '[Service]\nTimeoutStartSec=300\nWatchdogSec=0\n' \
            > "$SYSD/systemd-journald.service.d/zz-slow-vm.conf"
          printf '[Service]\nTimeoutStartSec=300\n' \
            > "$SYSD/systemd-nsresourced.service.d/zz-slow-vm.conf"

          # 3. A live ISO does not need to block on NTP sync; mask the wait unit.
          ln -sf /dev/null "$SYSD/systemd-time-wait-sync.service"

          # 4. Load common VM GPU drivers up front. In a QEMU virtio-gpu VM the DRM
          #    device (Virtual-1) only appeared after drm-module-load.target had
          #    already timed out. Missing modules just log a warning; on real
          #    hardware these load harmlessly without matching devices.
          mkdir -p "$AIROOT/etc/modules-load.d"
          printf 'virtio_gpu\nbochs\nvmwgfx\nhyperv_drm\n' \
            > "$AIROOT/etc/modules-load.d/vm-gpu.conf"

          # 5. Enable NetworkManager (build-time equivalent of
          #    `systemctl enable NetworkManager`). `--now` is meaningless here:
          #    there is no running systemd inside the airootfs. the
          #    Hyprland session (waybar network module, nmtui) needs this service. wait-online is deliberately
          #    NOT enabled; it only slows boot.
          mkdir -p "$SYSD/multi-user.target.wants"
          ln -sf /usr/lib/systemd/system/NetworkManager.service \
            "$SYSD/multi-user.target.wants/NetworkManager.service"
          ln -sf /usr/lib/systemd/system/NetworkManager-dispatcher.service \
            "$SYSD/dbus-org.freedesktop.nm-dispatcher.service"

          # 6. mkarchiso deletes the pacman sync databases from the image, so every
          #    `pacman -S` needed a manual `pacman -Sy` first. Fetch them in the
          #    background once the network is up (retries for ~10 minutes, never
          #    blocks boot). Without a network connection you still need `-Sy` by hand.
          cat > "$AIROOT/etc/pacman-live-sync.sh" <<'SYNCSH'
          #!/bin/sh
          i=0
          while [ "$i" -lt 60 ]; do
            pacman -Sy --noconfirm && exit 0
            i=$((i + 1))
            sleep 10
          done
          exit 1
          SYNCSH
          cat > "$SYSD/pacman-live-sync.service" <<'SYNCUNIT'
          [Unit]
          Description=Sync pacman databases once the network is up (live ISO)
          After=NetworkManager.service pacman-init.service
          Wants=NetworkManager.service

          [Service]
          Type=simple
          ExecStart=/bin/sh /etc/pacman-live-sync.sh

          [Install]
          WantedBy=multi-user.target
          SYNCUNIT
          ln -sf /etc/systemd/system/pacman-live-sync.service \
            "$SYSD/multi-user.target.wants/pacman-live-sync.service"

          # 7. Make the most of RAM in the live session (the live filesystem itself
          #    lives in RAM, so every MB saved here is a MB for your apps).
          #    This is a toram ISO: tune RAM usage (logs, cache, timers) but do NOT
          #    add swap (zram/zswap). The whole filesystem is already in RAM, so
          #    swap would only move RAM into more RAM.
          #    a) Logs stay in RAM and are capped; no core dumps are stored.
          mkdir -p "$AIROOT/etc/systemd/journald.conf.d" "$AIROOT/etc/systemd/coredump.conf.d"
          printf '[Journal]\nStorage=volatile\nRuntimeMaxUse=32M\n' \
            > "$AIROOT/etc/systemd/journald.conf.d/50-live-cap.conf"
          printf '[Coredump]\nStorage=none\nProcessSizeMax=0\n' \
            > "$AIROOT/etc/systemd/coredump.conf.d/50-live-none.conf"
          #    b) Downloaded .pkg files would sit in RAM; delete them after each
          #       pacman install/upgrade (the package databases are kept).
          mkdir -p "$AIROOT/etc/pacman.d/hooks"
          cat > "$AIROOT/etc/pacman.d/hooks/zz-live-clean-cache.hook" <<'CLEANHOOK'
          [Trigger]
          Operation = Install
          Operation = Upgrade
          Type = Package
          Target = *

          [Action]
          Description = Freeing RAM: removing downloaded package files (live session)
          When = PostTransaction
          Exec = /usr/bin/find /var/cache/pacman/pkg -maxdepth 1 -type f -delete
          CLEANHOOK
          #    c) Background timers that only make sense on an installed system.
          #       (Masking a unit that is not installed is harmless.)
          for t in man-db.timer shadow.timer archlinux-keyring-wkd-sync.timer \
                   plocate-updatedb.timer fstrim.timer; do
            ln -sf /dev/null "$SYSD/$t"
          done

      - name: Add save-progress (save/restore your files on the boot USB)
        run: |
          set -euo pipefail
          AIROOT="cachyos/archiso/airootfs"
          SYSD="$AIROOT/etc/systemd/system"
          LIVE_USER=$(grep -m1 -oP '^user = "\K[^"@]+' "$AIROOT/etc/greetd/config.toml" || true)
          LIVE_USER=${LIVE_USER:-liveuser}
          echo "save-progress: live user is $LIVE_USER"

          mkdir -p "$AIROOT/usr/local/bin" "$SYSD/multi-user.target.wants"
          cat > "$AIROOT/usr/local/bin/save-progress" <<'SAVEPROGRESS'
          #!/bin/bash
          # save-progress          - save your files onto the USB you booted from.
          # save-progress --restore - (runs automatically at boot) bring them back.
          #
          # Works however the USB was made:
          #   * raw/DD image (balenaEtcher, Rufus "DD Image", dd): makes a small CPSAVE partition
          #     in the free space after the ISO
          #   * Rufus "ISO mode" / Ventoy / any normal USB stick: saves into a folder
          #     (cachyos-hyprland-save) on the stick's biggest normal partition
          # What is saved: the live user's home folder, except files over 10 MB and caches (the
          # skipped files are listed with their paths), plus saved Wi-Fi networks and the timezone.
          set -u

          LIVE_USER="@LIVE_USER@"
          LABEL="CPSAVE"
          SAVE_SUBDIR="cachyos-hyprland-save"
          ARCHIVE="progress.tar.zst"
          VERSION_FILE="progress.version"
          WIFI_ARCHIVE="wifi.tar.zst"                 # saved Wi-Fi networks (NetworkManager files)
          TZ_FILE="timezone"
          NM_DIR="/etc/NetworkManager/system-connections"
          MNT="/run/progress-usb"
          MIN_SECTORS=131072                      # 64 MiB free space needed to create CPSAVE
          FS_OK="vfat exfat ntfs ext2 ext3 ext4 btrfs f2fs xfs"
          SKIP_LABELS=" VTOYEFI ARCHISO_EFI "     # boot helper partitions: never save there

          HOME_DIR=$(getent passwd "$LIVE_USER" | cut -d: -f6)
          HOME_DIR=${HOME_DIR:-/home/$LIVE_USER}
          ISO_VERSION=$(sed -n 's/^VERSION="\(.*\)"/\1/p' /etc/cachyos-hyprland-release 2>/dev/null)

          usage() {
            cat <<'USAGE'
          Usage: save-progress [OPTION]

          Save your files onto the USB stick you booted from, so they are back next time.

          Options:
            (none)         save now
            --restore      bring the saved files back (runs by itself at boot)
            -h, --help     show this help

          What is saved: your home folder (files over 10 MB and caches are skipped, and the
          skipped files are listed), saved Wi-Fi networks and the timezone.
          It works with a raw/DD USB (a small CPSAVE partition is made after the ISO) and with
          Ventoy / Rufus ISO mode / any normal stick (a cachyos-hyprland-save folder is used).
          Run it again any time: the new save replaces the old one.
          USAGE
          }
          case "${1:-}" in
            -h|--help|help) usage; exit 0 ;;
            ""|--restore) ;;
            *) printf 'save-progress: unknown option: %s\n\n' "$1" >&2; usage >&2; exit 2 ;;
          esac

          [ "$(id -u)" -eq 0 ] || exec sudo -- "$(readlink -f "$0")" "$@"

          say() { printf '%s\n' "$*"; }
          die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }

          # ----------------------------------------------------------- device helpers
          # One line per block device: name type parent size fstype label tran removable
          # (fields separated by \001 so empty ones survive; read with IFS=$'\001')
          rows() { lsblk -rpbno NAME,TYPE,PKNAME,SIZE,FSTYPE,LABEL,TRAN,RM 2>/dev/null | tr ' ' '\001'; }

          usb_disks() {   # USB / removable whole disks that actually have media
            local name type pk size fs label tran rm
            rows | while IFS=$'\001' read -r name type pk size fs label tran rm; do
              [ "$type" = disk ] && [ "${size:-0}" -gt 0 ] || continue
              if [ "$tran" = usb ] || [ "$rm" = 1 ]; then echo "$name"; fi
            done
          }

          disk_of() {     # any block device (partition, dm-mapper, ...) -> its whole disk
            lsblk -srpno NAME,TYPE "$1" 2>/dev/null | awk '$2 == "disk" { print $1; exit }'
          }

          # Whole disk this OS booted from, if it can be worked out and is plugged in.
          boot_disk() {
            local dev="" arg id d
            for arg in $(cat /proc/cmdline); do
              case "$arg" in
                archisosearchuuid=*) id=${arg#*=}; dev=$(blkid -U "$id" 2>/dev/null | head -n1) ;;
                archisolabel=*)      id=${arg#*=}; dev=$(blkid -L "$id" 2>/dev/null | head -n1) ;;
                archisodevice=*)     dev=${arg#*=}; [ -b "$dev" ] || dev="" ;;
              esac
              [ -n "$dev" ] && break
            done
            [ -n "$dev" ] || dev=$(findmnt -no SOURCE /run/archiso/bootmnt 2>/dev/null)
            [ -n "$dev" ] && [ -b "$dev" ] || return 1
            d=$(disk_of "$dev"); [ -n "$d" ] || return 1
            echo "$d"
          }

          has_iso() {     # does disk $1 hold a raw ISO image (iso9660 on it or its partitions)?
            local disk=${1#/dev/} name type pk size fs label tran rm
            rows | while IFS=$'\001' read -r name type pk size fs label tran rm; do
              [ "$fs" = iso9660 ] || continue
              if [ "${name#/dev/}" = "$disk" ] || [ "${pk#/dev/}" = "$disk" ]; then echo yes; break; fi
            done | grep -q yes
          }

          find_save_part() {   # our own CPSAVE partition on disk $1
            local disk=${1#/dev/} name type pk size fs label tran rm
            rows | while IFS=$'\001' read -r name type pk size fs label tran rm; do
              [ "$type" = part ] && [ "${pk#/dev/}" = "$disk" ] && [ "$label" = "$LABEL" ] && { echo "$name"; break; }
            done
          }

          writable_parts() {   # "size name" for each normal writable partition on disk $1
            local disk=${1#/dev/} name type pk size fs label tran rm
            rows | while IFS=$'\001' read -r name type pk size fs label tran rm; do
              [ "$type" = part ] && [ "${pk#/dev/}" = "$disk" ] || continue
              case " $FS_OK " in *" $fs "*) ;; *) continue ;; esac
              case "$SKIP_LABELS" in *" $label "*) continue ;; esac
              echo "$size $name"
            done
          }

          free_sectors() {
            sfdisk -F "$1" 2>/dev/null | awk '$1 ~ /^[0-9]+$/ && NF >= 4 { if ($3 > m) m = $3 } END { print m + 0 }'
          }

          create_save_part() {
            local disk="$1" before after new
            before=$(lsblk -rpno NAME "$disk" | sort)
            printf ',,L\n' | sfdisk --append --quiet "$disk" || return 1
            partx -u "$disk" 2>/dev/null; partx -a "$disk" 2>/dev/null
            udevadm settle --timeout=10 2>/dev/null
            after=$(lsblk -rpno NAME "$disk" | sort)
            new=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | head -n1)
            [ -n "$new" ] && [ -b "$new" ] || return 2
            mkfs.ext4 -q -F -L "$LABEL" "$new" || return 3
            echo "$new"
          }

          mount_part() {   # $1 partition, $2 = ro|rw
            mkdir -p "$MNT"
            mount -o "$2,noatime,nosuid,nodev,noexec" "$1" "$MNT" 2>/dev/null
          }
          unmount_part() { sync; umount "$MNT" 2>/dev/null; rmdir "$MNT" 2>/dev/null; }
          # Booted with toram: the whole OS is already in RAM, so the USB is free to unplug.
          note_unplug() {
            mountpoint -q /run/archiso/copytoram 2>/dev/null || return 0
            [ -w /dev/console ] && echo "  The OS is fully loaded in RAM: you can unplug the USB now." >/dev/console
            return 0
          }

          # ------------------------------------------------------------------- RESTORE
          restore() {
            local con=/dev/console disks=() d p lbl dir t best_t=0 best_p="" best_dir="" rc ver skipped="" tz
            [ -w "$con" ] || con=/dev/null
            udevadm settle --timeout=10 2>/dev/null
            if d=$(boot_disk); then disks=("$d"); else mapfile -t disks < <(usb_disks); fi
            [ "${#disks[@]}" -gt 0 ] || exit 0

            # Look at every normal partition on those USBs; use the newest save found.
            for d in "${disks[@]}"; do
              while read -r _ p; do
                [ -n "$p" ] || continue
                mount_part "$p" ro || continue
                lbl=$(lsblk -dno LABEL "$p" 2>/dev/null)
                for dir in "$SAVE_SUBDIR" ""; do
                  [ -z "$dir" ] && [ "$lbl" != "$LABEL" ] && continue
                  if [ -f "$MNT/$dir/$ARCHIVE" ]; then
                    t=$(stat -c %Y "$MNT/$dir/$ARCHIVE")
                    if [ "$t" -gt "$best_t" ]; then best_t=$t; best_p=$p; best_dir=$dir; fi
                  fi
                done
                unmount_part
              done < <(writable_parts "$d")
            done
            [ -n "$best_p" ] || { note_unplug; exit 0; }

            { echo; echo "  FOUND DATA! TRANSFERRING OVER..."; } >"$con"
            mount_part "$best_p" ro || { echo "  Could not read the saved data." >"$con"; exit 0; }
            ver=$(cat "$MNT/$best_dir/$VERSION_FILE" 2>/dev/null)
            mkdir -p "$HOME_DIR"
            if [ -n "$ver" ] && [ "$ver" != "$ISO_VERSION" ]; then
              # Newer ISO: keep its own desktop config, restore everything else.
              tar --zstd -xpf "$MNT/$best_dir/$ARCHIVE" -C "$HOME_DIR" --numeric-owner \
                  --exclude=./.config/hypr --exclude=./.config/waybar 2>>"$con"
              rc=$?
              skipped="  (saved on ISO $ver, this is $ISO_VERSION: kept the new desktop config)"
            else
              tar --zstd -xpf "$MNT/$best_dir/$ARCHIVE" -C "$HOME_DIR" --numeric-owner 2>>"$con"
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              echo "  DONE! Your saved data is back.$skipped" >"$con"
            else
              echo "  Some saved data could not be restored." >"$con"
            fi
            chown "$LIVE_USER": "$HOME_DIR" 2>/dev/null
            # Wi-Fi networks (NetworkManager keeps them as root-only files)
            if [ -f "$MNT/$best_dir/$WIFI_ARCHIVE" ]; then
              tar --zstd -xpf "$MNT/$best_dir/$WIFI_ARCHIVE" -C / --numeric-owner 2>>"$con" \
                && chmod 600 "$NM_DIR"/*.nmconnection 2>/dev/null
              nmcli connection reload >/dev/null 2>&1 || true
            fi
            # Timezone (and mark it as set, so the first-boot autodetect does not override it)
            tz=$(cat "$MNT/$best_dir/$TZ_FILE" 2>/dev/null)
            case "$tz" in
              ''|/*|*..*) ;;
              *) if [ -f "/usr/share/zoneinfo/$tz" ]; then
                   ln -sf "/usr/share/zoneinfo/$tz" /etc/localtime
                   mkdir -p "$HOME_DIR/.config/hypr"
                   : > "$HOME_DIR/.config/hypr/.tz-set-done"
                   chown "$LIVE_USER": "$HOME_DIR/.config/hypr/.tz-set-done" 2>/dev/null
                 fi ;;
            esac
            unmount_part
            note_unplug
            exit 0
          }

          [ "${1:-}" = "--restore" ] && restore

          # ---------------------------------------------------------------------- SAVE
          ask_disk() {   # list the USB drives and let the user pick; empty answer = keep waiting
            local list=() d i n
            mapfile -t list < <(usb_disks)
            [ "${#list[@]}" -gt 0 ] || return 1
            >&2 say "I can't tell for sure which USB you booted from. USB drives I can see:"
            i=1
            for d in "${list[@]}"; do
              >&2 printf '  %d) %s   %s   %s\n' "$i" "$d" "$(lsblk -dno SIZE "$d")" "$(lsblk -dno MODEL "$d")"
              i=$((i + 1))
            done
            read -r -p "Which one is the USB you booted from? [1-${#list[@]}, Enter = keep waiting] " n
            case "$n" in ''|*[!0-9]*) return 1 ;; esac
            [ "$n" -ge 1 ] && [ "$n" -le "${#list[@]}" ] || return 1
            echo "${list[$((n - 1))]}"
          }

          say "Please plug in the USB that you used to boot into this OS."
          say "(waiting for the USB... press Ctrl+C to cancel)"
          tries=0
          until disk=$(boot_disk); do
            sleep 2; tries=$((tries + 1))
            if [ "$tries" -ge 3 ] && [ $(( (tries - 3) % 10 )) -eq 0 ]; then
              if disk=$(ask_disk); then break; fi
            fi
          done
          udevadm settle --timeout=10 2>/dev/null
          say "USB found: $disk"

          kind=folder
          part=$(find_save_part "$disk")
          if [ -n "$part" ]; then
            kind=own
          elif has_iso "$disk"; then
            # Raw ISO image on the stick: the ISO part is read-only, so use the free space after it.
            free=$(free_sectors "$disk")
            [ "$free" -ge "$MIN_SECTORS" ] || die "there's no free space left on this USB (the ISO fills it). Use a bigger USB, or flash with Ventoy / Rufus ISO mode."
            say "This USB has no save area yet."
            read -r -p "Create one in the free space of the USB? [Y/N] " a
            case "$a" in [Yy]*) ;; *) say "Cancelled."; exit 1 ;; esac
            part=$(create_save_part "$disk") || die "could not create the save area (code $?). Unplug the USB, plug it in again and retry."
            kind=own
            say "Save area created."
          else
            # Rufus ISO mode, Ventoy, ...: use a folder on the stick's biggest normal partition.
            part=$(writable_parts "$disk" | sort -rn | head -n1 | cut -d' ' -f2)
            [ -n "$part" ] || die "no usable partition found on $disk."
          fi

          if pgrep -x brave >/dev/null 2>&1; then
            say "Brave is still open. Close it first so your logins are saved safely."
            read -r -p "Press Enter when it's closed (Ctrl+C to cancel)... " _
          fi

          mount_part "$part" rw || die "could not mount $part (is it Windows-hibernated or damaged?)."
          trap 'unmount_part' EXIT
          if [ "$kind" = own ]; then DEST="$MNT"; else DEST="$MNT/$SAVE_SUBDIR"; fi
          mkdir -p "$DEST" || die "can't write to the USB."

          if [ -f "$DEST/$ARCHIVE" ]; then
            read -r -p "Found existing saved data in the usb. Are you sure you wanna overwrite them? [Y/N] " a
            case "$a" in [Yy]*) ;; *) say "Cancelled. Nothing was changed."; exit 1 ;; esac
          fi

          say "Saving..."
          LIST=$(mktemp)
          cd "$HOME_DIR" || die "home folder $HOME_DIR not found"
          PRUNE=( \( -path ./.cache -o -name 'Singleton*' -o -name GPUCache -o -name 'Code Cache' \
                     -o -name ShaderCache -o -name GrShaderCache \) -prune -o )
          SKIPLIST=$(mktemp)
          find . -xdev "${PRUNE[@]}" -type f -size +10M -print0 > "$SKIPLIST"
          skipped=$(tr -cd '\0' < "$SKIPLIST" | wc -c)
          find . -xdev "${PRUNE[@]}" \( -type d -o -type l -o \( -type f ! -size +10M \) \) -print0 > "$LIST"

          # Write the new archive next to the old one first. The old data is only deleted once the new
          # one is complete, so a failed save never loses what was already there.
          write_archive() { tar --zstd --null --no-recursion -T "$LIST" -cpf "$DEST/$ARCHIVE.new" 2>/dev/null; }
          drop_old() { rm -f "$DEST/$ARCHIVE" "$DEST/$WIFI_ARCHIVE" "$DEST/$TZ_FILE" "$DEST/$VERSION_FILE"; }
          write_archive; rc=$?
          # rc=1 only means "a file changed while reading"; anything higher is a real failure.
          if [ "$rc" -gt 1 ]; then
            rm -f "$DEST/$ARCHIVE.new"
            if [ -f "$DEST/$ARCHIVE" ]; then
              say "Could not write the new save while keeping the old one (not enough room?)."
              read -r -p "Delete the old saved data and write the new one in its place? [Y/N] " a
              case "$a" in [Yy]*) ;; *) rm -f "$LIST" "$SKIPLIST"; die "Cancelled. Old data was kept." ;; esac
              drop_old
              write_archive; rc=$?
            fi
            [ "$rc" -le 1 ] || { rm -f "$DEST/$ARCHIVE.new" "$LIST" "$SKIPLIST"; die "writing to the USB failed (full, or over the 4 GB FAT limit)."; }
          fi
          rm -f "$LIST"
          # The new save is complete: delete everything left of the old one, then move the new one in.
          drop_old
          mv "$DEST/$ARCHIVE.new" "$DEST/$ARCHIVE"
          printf '%s\n' "$ISO_VERSION" > "$DEST/$VERSION_FILE"

          # Wi-Fi networks, saved next to the archive (NetworkManager files, passwords included)
          WIFI_LIST=$(mktemp)
          ( cd / && grep -lsx 'type=wifi' "${NM_DIR#/}"/*.nmconnection ) > "$WIFI_LIST" 2>/dev/null
          wifi_n=0
          if [ -s "$WIFI_LIST" ] && tar --zstd -cpf "$DEST/$WIFI_ARCHIVE.new" -C / --numeric-owner -T "$WIFI_LIST" 2>/dev/null; then
            mv -f "$DEST/$WIFI_ARCHIVE.new" "$DEST/$WIFI_ARCHIVE"
            wifi_n=$(wc -l < "$WIFI_LIST")
          else
            rm -f "$DEST/$WIFI_ARCHIVE.new"
          fi
          rm -f "$WIFI_LIST"
          # Timezone (UTC means "never set", so it is not saved)
          tz=$(readlink -f /etc/localtime 2>/dev/null | sed -n 's|.*/zoneinfo/||p')
          if [ -n "$tz" ] && [ "$tz" != UTC ] && [ -f "/usr/share/zoneinfo/$tz" ]; then
            printf '%s\n' "$tz" > "$DEST/$TZ_FILE"
          else
            tz=""
          fi
          sync
          size=$(du -h "$DEST/$ARCHIVE" | cut -f1)
          if [ "$skipped" -gt 0 ]; then
            say "Skipped $skipped file(s) bigger than 10 MB:"
            while IFS= read -r -d '' f; do
              printf '  %s  (%s)\n' "$HOME_DIR/${f#./}" "$(du -h --apparent-size -- "$f" | cut -f1)"
            done < "$SKIPLIST"
          fi
          rm -f "$SKIPLIST"
          [ "$wifi_n" -gt 0 ] && say "Saved $wifi_n Wi-Fi network(s)."
          [ -n "$tz" ] && say "Saved timezone: $tz."
          say "Saved $size."
          unmount_part
          trap - EXIT
          say "Done! Please unplug your usb"
          SAVEPROGRESS
          sed -i "s/@LIVE_USER@/${LIVE_USER}/" "$AIROOT/usr/local/bin/save-progress"
          bash -n "$AIROOT/usr/local/bin/save-progress"

          # archiso does not keep file modes unless profiledef.sh lists them.
          while IFS= read -r pd; do
            sedx -o "$pd" '/^file_permissions=(/a\["/usr/local/bin/save-progress"]="0:0:755"'
          done < <(find cachyos -maxdepth 3 -name 'profiledef.sh' -not -path '*/airootfs/*' -not -path '*/.git/*')

          # At boot, before the desktop starts: if a USB holds saved data, copy it back.
          cat > "$SYSD/restore-progress.service" <<'RESTOREUNIT'
          [Unit]
          Description=Restore saved progress from the boot USB
          After=local-fs.target systemd-udevd.service
          Before=greetd.service display-manager.service NetworkManager.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/save-progress --restore
          TimeoutStartSec=120

          [Install]
          WantedBy=multi-user.target
          RESTOREUNIT
          ln -sf /etc/systemd/system/restore-progress.service \
            "$SYSD/multi-user.target.wants/restore-progress.service"

      - name: Add updateos (update the running OS from a USB, no reboot)
        run: |
          set -euo pipefail
          AIROOT="cachyos/archiso/airootfs"
          LIVE_USER=$(grep -m1 -oP '^user = "\K[^"@]+' "$AIROOT/etc/greetd/config.toml" || true)
          LIVE_USER=${LIVE_USER:-liveuser}
          echo "updateos: live user is $LIVE_USER"
          mkdir -p "$AIROOT/usr/local/bin"
          cat > "$AIROOT/usr/local/bin/updateos" <<'UPDATEUSB'
          #!/bin/bash
          # updateos [--yes] [--help] [ISO-FILE | DEVICE | FOLDER]
          #
          # Update this running OS to a newer version WITHOUT rebooting. Plug in a USB that has
          # the new version (flashed with the new ISO, or a normal USB with the .iso file on it).
          # The new system files are copied over the running ones, in RAM. Not touched: your
          # files, saved Wi-Fi networks, timezone, wallpaper and colours. The desktop config
          # (bar, keybinds, launcher, notifications, terminal) is refreshed from the new
          # version; your old copy is backed up first. Open programs keep running the old
          # version until you restart them. A new kernel only takes effect after a reboot.
          set -u

          LIVE_USER="@LIVE_USER@"
          SFS_REL="arch/x86_64/airootfs.sfs"
          REL_FILE="etc/cachyos-hyprland-release"
          M_PART=/run/update-part      # the USB partition
          M_ISO=/run/update-iso        # an .iso file opened from the USB
          M_NEW=/run/update-new        # the new system image
          M_PROBE=/run/update-probe    # throwaway mount used while looking for the new version
          FS_OK="vfat exfat ntfs ext2 ext3 ext4 btrfs f2fs xfs iso9660 udf"
          ASSUME_YES=0
          SRC_ARG=""

          usage() {
            cat <<'USAGE'
          Usage: updateos [OPTIONS] [ISO-FILE | DEVICE | FOLDER]

          Update this running system to a newer version without rebooting. Plug in a USB that
          has the new version (flashed with the new ISO, or a normal USB with the .iso file on
          it), then run updateos. With no source it looks for one on the plugged-in USBs.

          Options:
            -y, --yes      do not ask for confirmation
            -h, --help     show this help

          Kept: your files, saved Wi-Fi networks, timezone, wallpaper and colours.
          Refreshed from the new version: bar, keybinds, launcher, notifications, terminal
          (your old copies are backed up in ~/.local/share/update-backup/).
          Programs that are already open keep running the old version until you restart them.
          A new kernel only starts after a reboot.
          USAGE
          }

          for a in "$@"; do
            case "$a" in
              -h|--help) usage; exit 0 ;;
            esac
          done

          [ "$(id -u)" -eq 0 ] || exec sudo -- "$(readlink -f "$0")" "$@"

          for a in "$@"; do
            case "$a" in
              -y|--yes) ASSUME_YES=1 ;;
              -*) printf 'updateos: unknown option: %s\n\n' "$a" >&2; usage >&2; exit 2 ;;
              *) SRC_ARG="$a" ;;
            esac
          done

          say() { printf '%s\n' "$*"; }
          die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
          ask() {
            [ "$ASSUME_YES" = 1 ] && return 0
            local a
            read -r -p "$1 [Y/N] " a
            case "$a" in [Yy]*) return 0 ;; *) return 1 ;; esac
          }
          cleanup() {
            cd / 2>/dev/null
            local m
            for m in "$M_PROBE" "$M_NEW" "$M_ISO" "$M_PART"; do
              mountpoint -q "$m" 2>/dev/null && umount "$m" 2>/dev/null
              rmdir "$m" 2>/dev/null
            done
            return 0
          }
          trap cleanup EXIT

          [ -d /run/archiso ] || die "this only works inside the live ISO."
          command -v rsync >/dev/null 2>&1 || die "rsync is missing. Run: sudo pacman -Sy rsync   (newer ISOs include it)."
          [ ! -e /var/lib/pacman/db.lck ] || die "pacman is busy. Wait for it to finish, then try again."

          CUR_VER=$(sed -n 's/^VERSION="\(.*\)"/\1/p' /etc/cachyos-hyprland-release 2>/dev/null)
          CUR_VER=${CUR_VER:-unknown}

          # ----------------------------------------------------------- device helpers
          rows() { lsblk -rpbno NAME,TYPE,PKNAME,SIZE,FSTYPE,LABEL,TRAN,RM 2>/dev/null | tr ' ' '\001'; }

          usb_disks() {   # USB / removable whole disks that actually have media
            local name type pk size fs label tran rm
            rows | while IFS=$'\001' read -r name type pk size fs label tran rm; do
              [ "$type" = disk ] && [ "${size:-0}" -gt 0 ] || continue
              if [ "$tran" = usb ] || [ "$rm" = 1 ]; then echo "$name"; fi
            done
          }

          members() {     # "device fstype" for the disk itself and each partition that has a filesystem
            local disk=${1#/dev/} name type pk size fs label tran rm
            rows | while IFS=$'\001' read -r name type pk size fs label tran rm; do
              [ -n "$fs" ] || continue
              if [ "${name#/dev/}" = "$disk" ] || [ "${pk#/dev/}" = "$disk" ]; then echo "$name $fs"; fi
            done
          }

          sfs_version() {   # $1 = an airootfs.sfs file -> prints the ISO version stamped inside it
            local v
            mkdir -p "$M_PROBE"
            mount -t squashfs -o ro,loop "$1" "$M_PROBE" 2>/dev/null || { rmdir "$M_PROBE" 2>/dev/null; return 1; }
            v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' "$M_PROBE/$REL_FILE" 2>/dev/null)
            umount "$M_PROBE" 2>/dev/null
            rmdir "$M_PROBE" 2>/dev/null
            echo "${v:-unknown}"
          }

          scan() {   # prints: version<TAB>device<TAB>kind<TAB>path   (kind: sfs = flashed ISO, iso = .iso file)
            local d dev fs v f
            mkdir -p "$M_PART" "$M_ISO"
            for d in $(usb_disks); do
              members "$d" | while read -r dev fs; do
                case " $FS_OK " in *" $fs "*) ;; *) continue ;; esac
                mount -o ro "$dev" "$M_PART" 2>/dev/null || continue
                if [ -f "$M_PART/$SFS_REL" ] && v=$(sfs_version "$M_PART/$SFS_REL"); then
                  printf '%s\t%s\tsfs\t%s\n' "$v" "$dev" "$SFS_REL"
                fi
                while IFS= read -r f; do
                  mount -o ro,loop "$f" "$M_ISO" 2>/dev/null || continue
                  if [ -f "$M_ISO/$SFS_REL" ] && v=$(sfs_version "$M_ISO/$SFS_REL"); then
                    printf '%s\t%s\tiso\t%s\n' "$v" "$dev" "${f#"$M_PART"/}"
                  fi
                  umount "$M_ISO" 2>/dev/null
                done < <(find "$M_PART" -maxdepth 2 -type f -iname 'cachyos-hyprland-*.iso' 2>/dev/null)
                umount "$M_PART" 2>/dev/null
              done
            done
          }

          # ------------------------------------------------------- find the new version
          mkdir -p "$M_PART" "$M_ISO" "$M_NEW"
          SFS=""
          if [ -n "$SRC_ARG" ]; then
            if [ -b "$SRC_ARG" ]; then
              mount -o ro "$SRC_ARG" "$M_PART" || die "could not read $SRC_ARG."
              base="$M_PART"
            elif [ -f "$SRC_ARG" ]; then
              mount -o ro,loop "$SRC_ARG" "$M_ISO" || die "could not open $SRC_ARG as an ISO."
              base="$M_ISO"
            elif [ -d "$SRC_ARG" ]; then
              base="$SRC_ARG"
            else
              die "'$SRC_ARG' is not a file, folder or device."
            fi
            SFS="$base/$SFS_REL"
            [ -f "$SFS" ] || die "no system image ($SFS_REL) found in $SRC_ARG."
          else
            say "Plug in the USB that has the new version of this OS."
            say "(a USB flashed with the new ISO, or a normal USB with the .iso file on it)"
            say "(looking for it... press Ctrl+C to cancel)"
            warned=0
            same=0
            while :; do
              mapfile -t found < <(scan | awk -F'\t' '!seen[$1 FS $3 FS $4]++' | sort -t$'\t' -k1,1Vr)
              usable=()
              for line in "${found[@]}"; do
                [ -n "$line" ] || continue
                ver=${line%%$'\t'*}
                if [ "$ver" = "$CUR_VER" ] && [ "$CUR_VER" != unknown ]; then same=1; continue; fi
                usable+=("$line")
              done
              [ "${#usable[@]}" -gt 0 ] && break
              if [ "$same" = 1 ] && [ "$warned" = 0 ]; then
                say "Found the version you are already running ($CUR_VER). Waiting for a different one..."
                warned=1
              fi
              sleep 3
            done
            if [ "${#usable[@]}" -gt 1 ]; then
              say "Found these versions (newest first):"
              i=1
              for line in "${usable[@]}"; do
                IFS=$'\t' read -r v dev kind rel <<<"$line"
                printf '  %d) %s   (%s: %s)\n' "$i" "$v" "$dev" "$rel"
                i=$((i + 1))
              done
              read -r -p "Which one? [1-${#usable[@]}, Enter = 1] " n
              case "$n" in ''|*[!0-9]*) n=1 ;; esac
              [ "$n" -ge 1 ] && [ "$n" -le "${#usable[@]}" ] || n=1
              line=${usable[$((n - 1))]}
            else
              line=${usable[0]}
            fi
            IFS=$'\t' read -r _ DEV KIND REL <<<"$line"
            mount -o ro "$DEV" "$M_PART" || die "could not read $DEV."
            if [ "$KIND" = iso ]; then
              mount -o ro,loop "$M_PART/$REL" "$M_ISO" || die "could not open $REL."
              SFS="$M_ISO/$SFS_REL"
            else
              SFS="$M_PART/$REL"
            fi
          fi

          mount -t squashfs -o ro,loop "$SFS" "$M_NEW" || die "could not open the new system image."
          [ -d "$M_NEW/usr" ] || die "the new system image looks empty or damaged."
          NEW_VER=$(sed -n 's/^VERSION="\(.*\)"/\1/p' "$M_NEW/$REL_FILE" 2>/dev/null)
          NEW_VER=${NEW_VER:-unknown}
          say "Running version: $CUR_VER"
          say "New version:     $NEW_VER"

          if [ "$NEW_VER" = "$CUR_VER" ] && [ "$NEW_VER" != unknown ]; then
            ask "That is the version you are already running. Apply it again anyway?" || { say "Nothing was changed."; exit 0; }
          elif [ "$NEW_VER" != unknown ] && [ "$CUR_VER" != unknown ] \
               && [ "$(printf '%s\n%s\n' "$NEW_VER" "$CUR_VER" | sort -V | head -n1)" = "$NEW_VER" ]; then
            ask "$NEW_VER is OLDER than the running $CUR_VER. Go back to it anyway?" || { say "Nothing was changed."; exit 0; }
          fi

          NEW_K=$(ls "$M_NEW/usr/lib/modules" 2>/dev/null | head -n1)
          OLD_K=$(uname -r)
          KERNEL_CHANGED=0
          if [ -n "$NEW_K" ] && [ "$NEW_K" != "$OLD_K" ]; then
            KERNEL_CHANGED=1
            say ""
            say "NOTE: the new version has a different kernel ($NEW_K; you are running $OLD_K)."
            say "The update works, but the kernel itself only changes after a reboot. Until then the"
            say "graphics driver (especially NVIDIA) can be out of step with the old kernel."
          fi

          # ----------------------------------------------------------- what gets copied
          RS=(rsync -aHX --numeric-ids)
          # Files that belong to THIS running session, never overwritten:
          ETC_EXCL=(
            --exclude=/machine-id --exclude=/hostname --exclude=/localtime --exclude=/resolv.conf
            --exclude=/mtab --exclude=/fstab --exclude=/adjtime --exclude=/ld.so.cache
            --exclude=/passwd --exclude=/shadow --exclude=/group --exclude=/gshadow
            --exclude=/subuid --exclude=/subgid
            --exclude='/passwd-' --exclude='/shadow-' --exclude='/group-' --exclude='/gshadow-'
            --exclude=/NetworkManager/system-connections
            --exclude=/pacman.d/gnupg --exclude=/pacman.d/mirrorlist
            --exclude='/ssh/ssh_host_*'
          )
          # The running kernel's modules stay, or the running system could not load drivers.
          USR_EXCL=(--exclude=/lib/modules)

          sync_part() {   # sync_part STEP [extra rsync options]   STEP: usr | opt | etc | pacman
            local step=$1
            shift
            case "$step" in
              usr)
                "${RS[@]}" --delete "${USR_EXCL[@]}" "$@" "$M_NEW/usr/" /usr/ ;;
              opt)
                if [ -d "$M_NEW/opt" ]; then "${RS[@]}" --delete "$@" "$M_NEW/opt/" /opt/; else return 0; fi ;;
              etc)
                "${RS[@]}" "${ETC_EXCL[@]}" "$@" "$M_NEW/etc/" /etc/ ;;
              pacman)
                if [ -d "$M_NEW/var/lib/pacman/local" ]; then
                  "${RS[@]}" --delete "$@" "$M_NEW/var/lib/pacman/local/" /var/lib/pacman/local/
                else
                  return 0
                fi ;;
            esac
          }

          say ""
          say "Checking how much room the update needs..."
          need=0
          for step in usr opt etc pacman; do
            b=$(sync_part "$step" -n --stats 2>/dev/null | awk '/Total transferred file size:/ { gsub(",", "", $5); print $5 }')
            need=$((need + ${b:-0}))
          done
          margin=$((256 * 1024 * 1024))
          avail=$(df --output=avail -B1 / | tail -n1 | tr -dc '0-9')
          memavail=$(awk '/^MemAvailable:/ { print $2 * 1024 }' /proc/meminfo)
          say "The update changes about $((need / 1024 / 1024)) MiB (kept in RAM until you reboot)."

          [ "$memavail" -ge $((need + 3 * margin)) ] \
            || die "not enough free RAM for the update (need about $(((need + 3 * margin) / 1024 / 1024)) MiB free). Close some programs and try again."
          if [ "$avail" -lt $((need + margin)) ]; then
            cow=/run/archiso/cowspace
            mountpoint -q "$cow" 2>/dev/null || die "not enough room in the live system's writable layer."
            size=$(df --output=size -B1 "$cow" | tail -n1 | tr -dc '0-9')
            mount -o remount,size=$((size + need + margin - avail)) "$cow" 2>/dev/null \
              || die "could not make room for the update in the live system's writable layer."
            say "Made more room for the update."
          fi

          say ""
          ask "Update from $CUR_VER to $NEW_VER now? Your files stay; programs you installed with pacman since boot are removed (a reboot would do the same)." \
            || { say "Cancelled. Nothing was changed."; exit 1; }

          # ------------------------------------------------------------------ the update
          fail=0
          say "Updating the system files (this can take a few minutes)..."
          for step in usr opt etc pacman; do
            sync_part "$step" --info=progress2
            rc=$?
            case "$rc" in
              0|24) ;;
              *) fail=1; say "  warning: part '$step' reported problems (code $rc)." ;;
            esac
          done
          say ""
          say "Finishing up..."
          command -v systemd-sysusers >/dev/null 2>&1 && systemd-sysusers >/dev/null 2>&1
          command -v systemd-tmpfiles >/dev/null 2>&1 && systemd-tmpfiles --create >/dev/null 2>&1
          ldconfig >/dev/null 2>&1
          command -v glib-compile-schemas >/dev/null 2>&1 && glib-compile-schemas /usr/share/glib-2.0/schemas >/dev/null 2>&1
          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications >/dev/null 2>&1
          command -v fc-cache >/dev/null 2>&1 && fc-cache -f >/dev/null 2>&1
          systemctl daemon-reload >/dev/null 2>&1

          # ------------------------------------- desktop config in your home (new look)
          HOME_DIR=$(getent passwd "$LIVE_USER" | cut -d: -f6)
          HOME_DIR=${HOME_DIR:-/home/$LIVE_USER}
          LIVE_UID=$(id -u "$LIVE_USER" 2>/dev/null)
          LIVE_GROUP=$(id -gn "$LIVE_USER" 2>/dev/null)
          BK="$HOME_DIR/.local/share/update-backup/${CUR_VER}-$(date +%Y%m%d-%H%M%S)"

          refresh_dir() {   # refresh_dir NAME [rsync options]: copy the new default config of ~/.config/NAME
            local d=$1
            shift
            [ -d "/etc/skel/.config/$d" ] || return 0
            if [ -d "$HOME_DIR/.config/$d" ]; then
              mkdir -p "$BK/.config"
              cp -a "$HOME_DIR/.config/$d" "$BK/.config/" 2>/dev/null
            fi
            mkdir -p "$HOME_DIR/.config/$d"
            rsync -a --chown="$LIVE_USER:$LIVE_GROUP" "$@" "/etc/skel/.config/$d/" "$HOME_DIR/.config/$d/"
          }
          # Your wallpaper, colour theme and first-run flags are kept.
          refresh_dir hypr --exclude=/wallpaper.png '--exclude=/wallpaper-custom.*' --exclude=/.tz-set-done --exclude=/.first-run-done
          refresh_dir waybar --exclude=/colors.css
          refresh_dir wofi
          refresh_dir mako
          refresh_dir kitty --exclude=/colors.conf
          [ -d "$BK" ] && chown -R "$LIVE_USER:$LIVE_GROUP" "$HOME_DIR/.local/share/update-backup" 2>/dev/null

          # Apply it to the running desktop (reload Hyprland, restart the bar), if one is running.
          apply_live() {
            local rt=/run/user/$LIVE_UID sig wl
            [ -d "$rt/hypr" ] || return 0
            sig=$(ls -t "$rt/hypr" 2>/dev/null | head -n1)
            wl=$(cd "$rt" && ls -d wayland-[0-9]* 2>/dev/null | grep -v '\.lock$' | head -n1)
            [ -n "$sig" ] && [ -n "$wl" ] || return 0
            as_user() {
              runuser -u "$LIVE_USER" -- env HOME="$HOME_DIR" XDG_RUNTIME_DIR="$rt" HYPRLAND_INSTANCE_SIGNATURE="$sig" \
                WAYLAND_DISPLAY="$wl" DBUS_SESSION_BUS_ADDRESS="unix:path=$rt/bus" "$@"
            }
            as_user hyprctl reload >/dev/null 2>&1
            pkill -u "$LIVE_UID" -f ws-daemon.py 2>/dev/null
            pkill -u "$LIVE_UID" -x waybar 2>/dev/null
            sleep 0.5
            as_user setsid -f waybar >/dev/null 2>&1
            as_user setsid -f sh -c 'sleep 3; exec python3 ~/.config/hypr/ws-daemon.py' >/dev/null 2>&1
            as_user makoctl reload >/dev/null 2>&1
            return 0
          }
          apply_live

          # ---------------------------------------------------------------------- done
          say ""
          if [ "$fail" = 0 ]; then
            say "Done! Updated $CUR_VER -> $NEW_VER. You can unplug the USB now."
          else
            say "Updated $CUR_VER -> $NEW_VER, but some files could not be written (see the warnings above)."
            say "A reboot is the safest way to finish."
          fi
          say "Your files, Wi-Fi networks, timezone, wallpaper and colours were left alone."
          [ -d "$BK" ] && say "Your previous desktop config is backed up in: $BK"
          say "Programs that are already open keep running the old version until you restart them."
          [ "$KERNEL_CHANGED" = 1 ] && say "The new kernel only starts after a reboot (your saved files come back by themselves)."
          exit 0
          UPDATEUSB
          sed -i "s/@LIVE_USER@/${LIVE_USER}/" "$AIROOT/usr/local/bin/updateos"
          bash -n "$AIROOT/usr/local/bin/updateos"
          # archiso does not keep file modes unless profiledef.sh lists them.
          while IFS= read -r pd; do
            sedx -o "$pd" '/^file_permissions=(/a\["/usr/local/bin/updateos"]="0:0:755"'
          done < <(find cachyos -maxdepth 3 -name 'profiledef.sh' -not -path '*/airootfs/*' -not -path '*/.git/*')

      - name: Patch Boot Entries
        run: |
          set -euo pipefail
          GRUB=cachyos/archiso/grub/grub.cfg
          sedx "$GRUB" 's|linux-cachyos-lts|linux-cachyos|g'
          sedx "$GRUB" '/^menuentry "CachyOS LTS Kernel"/,/^}/ s/^/# /'

          EFI_DIR=cachyos/archiso/efiboot/loader/entries
          DEFAULT_ENTRY=02-archiso-linux-cachyos.conf
          rm -f "$EFI_DIR/01-archiso-linux.conf"
          rm -f "$EFI_DIR/03-archiso-memtest86+.conf"
          sedx -o "$EFI_DIR/fallback.conf" 's|linux-cachyos-lts|linux-cachyos|g'

          if [ ! -f "$EFI_DIR/$DEFAULT_ENTRY" ]; then
            echo "PATCH FAIL: boot entry $DEFAULT_ENTRY not found. Entries present:" >&2
            ls -1 "$EFI_DIR" >&2
            exit 1
          fi
          sedx -o cachyos/archiso/efiboot/loader/loader.conf "s|^default .*|default ${DEFAULT_ENTRY}|"

          # --- syslinux (BIOS) ---
          # This is the menu that prints "Loading /arch/boot/x86_64/vmlinuz-...: failed".
          SYSLINUX=cachyos/archiso/syslinux
          if [ ! -d "$SYSLINUX" ]; then
            echo "PATCH FAIL: $SYSLINUX not found. Contents of cachyos/archiso:" >&2
            ls -1 cachyos/archiso >&2
            exit 1
          fi
          # For each config that mentions the LTS kernel:
          #  - if a plain linux-cachyos entry also exists, drop the LTS LABEL stanzas;
          #  - if NOT (the BIOS menu may only have LTS entries), repoint them to
          #    linux-cachyos instead, so the menu is never left without a bootable entry.
          for f in "$SYSLINUX"/*.cfg; do
            grep -q 'linux-cachyos-lts' "$f" || continue
            awk '
              function flush() { if (buf != "" && buf !~ /linux-cachyos-lts/) printf "%s", buf; buf = "" }
              tolower($0) ~ /^[ \t]*label[ \t]/ { flush(); buf = $0 ORS; next }
              buf != "" { buf = buf $0 ORS; next }
              { print }
              END { flush() }
            ' "$f" > "$f.new"
            if grep -qE 'vmlinuz-linux-cachyos([^-]|$)' "$f.new"; then
              mv "$f.new" "$f"
              echo "syslinux: removed LTS entries from $f"
            else
              rm -f "$f.new"
              sed -i 's|linux-cachyos-lts|linux-cachyos|g' "$f"
              echo "syslinux: no plain entry in $f; repointed LTS entries to linux-cachyos"
            fi
          done
          echo "::group::syslinux configs after patch"
          for f in "$SYSLINUX"/*.cfg; do echo "=== $f"; cat "$f"; done
          echo "::endgroup::"

          # --- copytoram ---
          # Boot straight from USB instead of copying the whole image into RAM.
          { grep -rIl 'copytoram' cachyos/archiso || true; } | while IFS= read -r f; do
            sed -i -E 's/[[:space:]]+copytoram(=[a-zA-Z0-9]+)?//g' "$f"
          done

          # --- Catch-all ---
          # Anything under archiso/ that still names the LTS kernel gets rewritten,
          # and LTS-named files (e.g. a linux-cachyos-lts.preset) are deleted.
          { grep -rIl 'linux-cachyos-lts' cachyos/archiso || true; } | while IFS= read -r f; do
            echo "catch-all: rewriting LTS reference in $f"
            sed -i 's|linux-cachyos-lts|linux-cachyos|g' "$f"
          done
          find cachyos/archiso -name '*linux-cachyos-lts*' -prune -print -exec rm -rf {} +

      - name: Stamp version into the ISO
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          up=$(git -c safe.directory='*' -C cachyos rev-parse HEAD)
          mkdir -p cachyos/archiso/airootfs/etc
          {
            echo "NAME=\"CachyOS Hyprland ISO\""
            echo "VERSION=\"$VERSION\""
            echo "BUILD_DATE=\"$(date -u +%Y-%m-%d)\""
            echo "UPSTREAM_COMMIT=\"$up\""
            echo "REPO=\"https://github.com/${{ github.repository }}\""
          } > cachyos/archiso/airootfs/etc/cachyos-hyprland-release

      - name: Verify patched profile
        run: |
          set -euo pipefail
          fail=0
          PKG_LIST=cachyos/archiso/packages_desktop.x86_64

          for pkg in plasma-desktop plasma-login-manager linux-cachyos-lts firefox nautilus; do
            if grep -qxF "$pkg" "$PKG_LIST"; then echo "VERIFY FAIL: $pkg still in package list" >&2; fail=1; fi
          done
          if grep -q 'plasmalogin\.service' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: plasmalogin.service still referenced in util-iso.sh" >&2; fail=1
          fi
          if ! grep -q 'greetd\.service' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: greetd.service not referenced in util-iso.sh" >&2; fail=1
          fi
          if grep -qF 'sign_with_key $f' cachyos/util-iso.sh; then
            echo "VERIFY FAIL: signing call still present in util-iso.sh" >&2; fail=1
          fi
          for f in etc/greetd/config.toml etc/greetd/hypr-session.sh etc/skel/.config/hypr/hyprland.lua etc/skel/.config/hypr/palette.sh etc/skel/.config/hypr/screenshot.sh etc/skel/.config/waybar/config.jsonc etc/skel/.config/waybar/style.css etc/skel/.config/kitty/kitty.conf etc/skel/.config/fish/config.fish etc/skel/.config/hypr/power.sh etc/skel/.config/wofi/config etc/skel/.config/wofi/style.css etc/skel/.config/waybar/colors.css etc/skel/.config/kitty/colors.conf etc/skel/.config/matugen/config.toml etc/skel/.config/btop/btop.conf etc/skel/.config/brave-flags.conf etc/motd usr/share/cachyos-hyprland/cheatsheet.txt etc/skel/.config/hypr/hypridle.conf etc/skel/.config/hypr/hyprlock.conf etc/skel/.config/mako/config etc/systemd/journald.conf.d/50-live-cap.conf etc/systemd/coredump.conf.d/50-live-none.conf etc/pacman.d/hooks/zz-live-clean-cache.hook etc/skel/.config/hypr/wallpaper.sh etc/skel/.config/hypr/ws-state.sh etc/skel/.config/hypr/ws-go.sh etc/skel/.config/hypr/ws-daemon.py etc/skel/.config/hypr/brave-wall.sh etc/skel/.config/hypr/brave-wall-watch.py usr/share/cachyos-hyprland/genwall.py etc/skel/.config/BraveSoftware/Brave-Browser/Default/Preferences; do
            [ -s "cachyos/archiso/airootfs/$f" ] || { echo "VERIFY FAIL: missing/empty airootfs/$f" >&2; fail=1; }
          done
          [ -s cachyos/archiso/README.txt ] \
            || { echo "VERIFY FAIL: missing/empty archiso/README.txt" >&2; fail=1; }
          for sh_file in palette.sh screenshot.sh power.sh tz-setup.sh kb-switch.sh cheatsheet.sh first-run.sh popup-pos.sh kb-menu.sh clock-click.sh tz-prompt.sh wifi.sh volume.sh launcher.sh theme.sh wallpaper.sh ws-state.sh ws-go.sh mem.sh brave-wall.sh clipboard.sh; do
            if ! sh -n "cachyos/archiso/airootfs/etc/skel/.config/hypr/$sh_file"; then
              echo "VERIFY FAIL: $sh_file has a shell syntax error" >&2; fail=1
            fi
          done
          if ! grep -q 'SHIFT + S.*screenshot\.sh' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+Shift+S is not bound to the screenshot script" >&2; fail=1
          fi
          if ! grep -q '" + SPACE".*launcher\.sh' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+Space is not bound to launcher.sh" >&2; fail=1
          fi
          if ! grep -q 'SHIFT + SPACE.*palette\.sh' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+Shift+Space is not bound to the command palette" >&2; fail=1
          fi
          if ! grep -q '" + P".*theme\.sh' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+P is not bound to theme.sh (matugen)" >&2; fail=1
          fi
          if ! grep -q 'local files = "thunar"' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+E does not open thunar" >&2; fail=1
          fi
          if ! grep -q 'ALT + SPACE.*kb-switch\.sh' cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: Super+Alt+Space is not bound to kb-switch.sh" >&2; fail=1
          fi
          R=cachyos/archiso/airootfs/etc/skel/.config
          if ! grep -q 'ws-daemon\.py' "$R/hypr/hyprland.lua"; then
            echo "VERIFY FAIL: hyprland.lua does not start ws-daemon.py" >&2; fail=1
          fi
          if grep -q 'for i = 1, 9' "$R/hypr/hyprland.lua" || ! grep -q 'for i = 1, 4 do' "$R/hypr/hyprland.lua"; then
            echo "VERIFY FAIL: workspace binds must cover 1-4 only" >&2; fail=1
          fi
          if grep -q 'modules-center.*group/workspaces' "$R/waybar/config.jsonc" && ! grep -q 'ws4' "$R/waybar/style.css"; then
            echo "VERIFY FAIL: waybar style has no rule for workspace 4" >&2; fail=1
          fi
          if grep -q 'hyprland/workspaces' "$R/waybar/config.jsonc"; then
            echo "VERIFY FAIL: waybar must use the custom 1-2-3 buttons, not hyprland/workspaces" >&2; fail=1
          fi
          for w in custom/ws1 custom/ws2 custom/ws3 custom/ws4 group/workspaces; do
            grep -qF "$w" "$R/waybar/config.jsonc" || { echo "VERIFY FAIL: waybar config has no $w" >&2; fail=1; }
          done
          if grep -rqi 'anyrun\|nautilus' cachyos/archiso/airootfs/etc/skel cachyos/archiso/airootfs/usr/share/cachyos-hyprland; then
            echo "VERIFY FAIL: leftover anyrun/nautilus reference in the shipped config" >&2; fail=1
          fi
          for j in "$R/BraveSoftware/Brave-Browser/Default/Preferences"; do
            python3 -m json.tool "$j" >/dev/null || { echo "VERIFY FAIL: $j is not valid JSON" >&2; fail=1; }
          done
          for py in "$R/hypr/ws-daemon.py" "$R/hypr/brave-wall-watch.py" "$R/hypr/wifi-popup.py" "$R/hypr/volume-popup.py" "$R/hypr/power-popup.py" "$R/hypr/clipboard-popup.py" cachyos/archiso/airootfs/usr/share/cachyos-hyprland/genwall.py; do
            python3 -m py_compile "$py" || { echo "VERIFY FAIL: $py has a Python syntax error" >&2; fail=1; }
          done
          if grep -rq 'brave-launch\|cachyos-wall' cachyos/archiso/airootfs/etc cachyos/archiso/airootfs/usr/share/cachyos-hyprland; then
            echo "VERIFY FAIL: leftover Brave wallpaper/launcher reference" >&2; fail=1
          fi

          for want in wifi.sh volume.sh kb-menu.sh clock-click.sh ws-go.sh mem.sh; do
            if ! grep -qF "$want" cachyos/archiso/airootfs/etc/skel/.config/waybar/config.jsonc; then
              echo "VERIFY FAIL: waybar config does not call $want" >&2; fail=1
            fi
          done
          if ! luac -p cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.lua; then
            echo "VERIFY FAIL: hyprland.lua has a Lua syntax error" >&2; fail=1
          fi
          if ! python3 -m json.tool cachyos/archiso/airootfs/etc/skel/.config/waybar/config.jsonc >/dev/null; then
            echo "VERIFY FAIL: waybar config.jsonc is not valid JSON" >&2; fail=1
          fi
          if [ -e cachyos/archiso/airootfs/etc/skel/.config/hypr/hyprland.conf ]; then
            echo "VERIFY FAIL: legacy hyprland.conf shipped (ignored by Hyprland 0.57+)" >&2; fail=1
          fi
          if find cachyos/archiso/airootfs/etc/systemd -name '*ModemManager*' 2>/dev/null | grep -q .; then
            echo "VERIFY FAIL: ModemManager unit links still in airootfs" >&2; fail=1
          fi
          [ -f cachyos/archiso/airootfs/etc/systemd/system/drm-module-load.target.d/zz-slow-vm.conf ] \
            || { echo "VERIFY FAIL: slow-VM drop-ins missing" >&2; fail=1; }
          [ -L cachyos/archiso/airootfs/etc/systemd/system/multi-user.target.wants/pacman-live-sync.service ] \
            || { echo "VERIFY FAIL: pacman-live-sync not enabled" >&2; fail=1; }
          sh -n cachyos/archiso/airootfs/etc/pacman-live-sync.sh \
            || { echo "VERIFY FAIL: pacman-live-sync.sh syntax error" >&2; fail=1; }
          [ -L cachyos/archiso/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service ] \
            || { echo "VERIFY FAIL: NetworkManager not enabled" >&2; fail=1; }
          if grep -rIn 'linux-cachyos-lts' cachyos/archiso; then
            echo "VERIFY FAIL: LTS kernel still referenced under archiso/ (lines above)" >&2; fail=1
          fi
          if ! grep -rqE 'vmlinuz-linux-cachyos([^-]|$)' cachyos/archiso/syslinux; then
            echo "VERIFY FAIL: no syslinux entry boots vmlinuz-linux-cachyos. Syslinux label/kernel lines:" >&2
            ls -1 cachyos/archiso/syslinux >&2 || true
            grep -rniE '^[[:space:]]*(label|linux|kernel|initrd)' cachyos/archiso/syslinux >&2 || true
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

          echo "--- LTS kernel references outside archiso/ (review, non-fatal) ---"
          grep -rIn 'linux-cachyos-lts' cachyos --exclude-dir=.git --exclude-dir=archiso || echo "none"

          echo "--- Leftover KDE/Plasma/SDDM references in airootfs (review, non-fatal) ---"
          grep -rIil 'plasma\|kwin\|sddm' cachyos/archiso/airootfs || echo "none"

          echo "--- Patch summary ---"
          git -c safe.directory='*' -C cachyos diff --stat || true
          chown -R builder:builder cachyos
      # ------------------------------------------------------------------
      # PATCHES END HERE
      # ------------------------------------------------------------------

      - name: Build the ISO
        run: |
          set -uo pipefail
          cd cachyos
          chmod +x ./buildiso.sh
          sudo chown -R builder:builder /var/cache/pacman/pkg

          rm -rf build/ work/ out/*

          # Keep a copy of the full log so a failed build can be inspected
          # from the "build-log" artifact instead of scrolling the Actions UI.
          set +e
          sudo -H -E -u builder ./buildiso.sh -p desktop -v -w 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"
          build_rc=${PIPESTATUS[0]}
          set -e
          echo "buildiso.sh exit code: $build_rc"

          if ls out/*/*.iso 1>/dev/null 2>&1; then
            echo "ISO successfully compiled."
            if [ "$build_rc" -ne 0 ]; then
              echo "::warning::buildiso.sh exited $build_rc but produced an ISO; check the log."
            fi
            find out -name '*.iso' -exec ls -lh {} \;
          else
            echo "ISO file not found — build failed." >&2
            exit 1
          fi
        working-directory: ${{ github.workspace }}

      - name: Prune pacman cache
        if: ${{ !cancelled() }}
        run: |
          # Drop half-finished downloads and old versions so the cache stays small.
          find /var/cache/pacman/pkg -maxdepth 1 \( -name 'download-*' -o -name '*.part' \) -exec rm -rf {} + || true
          paccache -rk1 -c /var/cache/pacman/pkg || true
          du -sh /var/cache/pacman/pkg || true

      - name: Save pacman package cache
        if: ${{ !cancelled() && steps.pacman-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-v1-${{ steps.cachekey.outputs.week }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Rename ISO
        env:
          ISO_NAME: ${{ steps.meta.outputs.iso_name }}
        run: |
          set -euo pipefail
          # Give the ISO a stable name and drop upstream's checksum/signature files;
          # a fresh .sha256 for the new name is written in a later step.
          n=0
          while IFS= read -r iso; do
            dir=$(dirname "$iso")
            if [ "$n" -eq 0 ]; then new="$dir/$ISO_NAME"; else new="$dir/${ISO_NAME%.iso}-$n.iso"; fi
            rm -f "$iso".*
            if [ "$iso" != "$new" ]; then mv "$iso" "$new"; fi
            echo "ISO: $new"
            n=$((n + 1))
          done < <(find cachyos/out -name '*.iso' | sort)
          [ "$n" -gt 0 ] || { echo "::error::no ISO found to rename" >&2; exit 1; }

      - name: Check boot configs against kernels in the ISO
        run: |
          set -euo pipefail
          iso=$(find cachyos/out -name '*.iso' | head -n1)
          echo "Checking $iso"
          tmp=$(mktemp -d)
          list="$tmp.list"
          mkdir -p "$tmp/cfg"

          # Tooling problems only warn; only a real kernel mismatch fails the job.
          if ! bsdtar -t -f "$iso" > "$list"; then
            echo "::warning::bsdtar could not read the ISO; skipping boot config check."
            exit 0
          fi

          # Extract only boot config files that actually exist in the ISO tree
          # (the systemd-boot .conf entries live inside efiboot.img, not the tree).
          mapfile -t cfgs < <(grep -E '\.(cfg|conf)$' "$list" || true)
          if [ "${#cfgs[@]}" -gt 0 ]; then
            bsdtar -x -f "$iso" -C "$tmp/cfg" "${cfgs[@]}" \
              || echo "::warning::bsdtar reported errors while extracting boot configs; continuing."
          fi
          echo "Boot config files found in ISO tree: ${#cfgs[@]}"

          mapfile -t kernels < <(sed -n 's|.*/\(vmlinuz-[^/]*\)$|\1|p' "$list" | sort -u)
          if [ "${#kernels[@]}" -eq 0 ]; then
            echo "::warning::Could not find any kernels in the ISO listing; skipping boot config check."
            exit 0
          fi
          echo "Kernels in ISO: ${kernels[*]}"

          refs=$(grep -rhoE 'vmlinuz-[A-Za-z0-9._+-]+' "$tmp/cfg" | sort -u || true)
          if [ -z "$refs" ]; then
            echo "::warning::No kernel references found in the ISO's boot configs."
          fi
          bad=0
          for ref in $refs; do
            if ! printf '%s\n' "${kernels[@]}" | grep -qxF "$ref"; then
              echo "BOOT CHECK FAIL: a boot config references '$ref' but the ISO has no such kernel" >&2
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

      - name: Check ISO size against release limit
        id: size
        run: |
          set -euo pipefail
          limit=$((2 * 1024 * 1024 * 1024))   # GitHub release assets must be < 2 GiB
          ok=true
          while IFS= read -r iso; do
            size=$(stat -c %s "$iso")
            echo "$iso: $((size / 1024 / 1024)) MiB"
            if [ "$size" -ge "$limit" ]; then ok=false; fi
          done < <(find cachyos/out -name '*.iso')
          echo "release_ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = false ]; then
            msg="ISO is 2 GiB or larger: GitHub Releases will reject it, so the release step is skipped. The workflow artifact is still uploaded."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure checksums and write summary
        run: |
          set -euo pipefail
          {
            echo "### Built ISO"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r iso; do
            dir=$(dirname "$iso"); base=$(basename "$iso")
            # Create a .sha256 only if upstream did not already produce one.
            if [ ! -f "$iso.sha256" ]; then
              (cd "$dir" && sha256sum "$base" > "$base.sha256")
            fi
            sum=$(cut -d' ' -f1 "$iso.sha256")
            size=$(du -h "$iso" | cut -f1)
            echo "| \`$base\` | $size | \`$sum\` |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find cachyos/out -name '*.iso')

      # Release assets do not count toward Actions storage, so only keep an
      # artifact copy when the ISO is NOT going to a release.
      - name: Upload ISO as Artifact
        if: steps.meta.outputs.release != 'true' || steps.size.outputs.release_ok != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-hyprland-iso
          path: |
            cachyos/out/**/*.iso
            cachyos/out/**/*.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0   # ISOs are already compressed

      - name: Write release notes
        if: steps.meta.outputs.release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          iso=$(find cachyos/out -name '*.iso' | sort | head -n1)
          sum=$(cut -d' ' -f1 "$iso.sha256")
          size=$(du -h "$iso" | cut -f1)
          up=$(git -c safe.directory='*' -C cachyos rev-parse --short HEAD)
          # Pull this version's section ("## 1.0.3" or "## [1.0.3] - date") out of CHANGELOG.md.
          changelog=$(mktemp)
          if [ -f repo-src/CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / { if (found) exit; t=$2; gsub(/[\[\]]/, "", t); if (t == v) { found=1; next } }
              found { print }' repo-src/CHANGELOG.md \
              | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '/./,$!d' > "$changelog"
          fi
          if [ -s "$changelog" ]; then
            echo "Release description: CHANGELOG.md section ${VERSION}"
            echo "Release description: CHANGELOG.md section \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No section for ${VERSION} in CHANGELOG.md; using the default release description."
            echo "Release description: default (no CHANGELOG.md section for ${VERSION})" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            if [ -s "$changelog" ]; then
              echo "### What's new"
              echo ""
              cat "$changelog"
            else
              echo "Unofficial CachyOS live ISO with a Hyprland desktop instead of KDE Plasma."
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$iso")\` |"
            echo "| Size | $size |"
            echo "| SHA-256 | \`$sum\` |"
            echo "| Upstream | CachyOS-Live-ISO \`$up\` |"
            echo ""
            echo "### Before you boot"
            echo ""
            echo "- 4 GB of RAM is the practical minimum, 8 GB or more is recommended. Live changes are kept in RAM and lost on reboot."
            echo "- Disable Secure Boot."
            echo "- Verify the download with \`sha256sum -c <file>.sha256\`."
            echo "- This is not an official CachyOS release."
            echo ""
          } > release-notes.md

      - name: Release ISO
        if: steps.meta.outputs.release == 'true' && steps.size.outputs.release_ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease == true }}
          body_path: release-notes.md
          files: |
            cachyos/out/**/*.iso
            cachyos/out/**/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note when release was skipped
        if: steps.meta.outputs.release != 'true'
        run: |
          echo "Release skipped (release=false). The ISO is available as the workflow artifact." >> "$GITHUB_STEP_SUMMARY"
