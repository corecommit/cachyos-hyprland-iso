name: Build CachyOS Hyprland ISO

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "CachyOS-Live-ISO commit SHA/branch/tag (empty = UPSTREAM_PIN below, else default branch)"
        required: false
        default: ""
      keep_installer:
        description: "Keep the CachyOS installer(s) in the ISO"
        type: boolean
        default: true
      version:
        description: "Version as major.minor.patch (used in the ISO file name and the release tag)"
        type: string
        default: "1.0.0"
      release:
        description: "Publish the ISO to a GitHub Release (tag pushes always release)"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
  push:
    tags:
      - 'cachyos-v*'

# One build per ref at a time; tag (release) builds are never cancelled.
concurrency:
  group: cachyos-hyprland-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Paste a commit SHA from CachyOS/CachyOS-Live-ISO here to pin the upstream.
  # Empty = default branch. The clone step logs the SHA it used, so copy it
  # from a good run's log into this line.
  UPSTREAM_PIN: ""

jobs:
  build-cachyos-hyprland:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write   # needed by the release step
    container:
      image: archlinux:base-devel
      # The -v mounts expose big preinstalled host toolchains so the
      # "Free host disk space" step can delete them.
      options: >-
        --privileged
        -v /usr/local/lib/android:/host/android
        -v /usr/share/dotnet:/host/dotnet

    steps:
      - name: Resolve version and release settings
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            # Tag push such as cachyos-v1.2.3: version comes from the tag, always release.
            version="${REF_NAME#cachyos-v}"
            release=true
            tag="$REF_NAME"
          else
            version="${IN_VERSION:-}"
            release="${IN_RELEASE:-false}"
            tag="v${version}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Version '$version' is not major.minor.patch (for example 1.2.3)." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "tag=$tag"
            echo "iso_name=cachyos-hyprland-${version}-x86_64.iso"
            echo "release_name=CachyOS Hyprland ISO v${version}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Version ${version}"
            echo ""
            echo "- ISO file: \`cachyos-hyprland-${version}-x86_64.iso\`"
            if [ "$release" = "true" ]; then
              echo "- Release: **yes**, tag \`${tag}\`"
            else
              echo "- Release: **no** (artifact only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch CHANGELOG.md
        uses: actions/checkout@v4
        with:
          path: repo-src
          sparse-checkout: CHANGELOG.md
          fetch-depth: 1

      - name: Free host disk space
        run: |
          for d in /host/android /host/dotnet; do
            if [ -d "$d" ]; then rm -rf "${d:?}"/* || true; fi
          done
          df -h /
          avail=$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')
          if [ "${avail:-0}" -lt 25 ]; then
            echo "::warning::Only ${avail}G free; the build may run out of disk."
          fi

      - name: Compute cache key
        id: cachekey
        # Weekly (ISO year-week) so a new multi-GB cache is made once a week, not daily.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Package downloads are the slowest network part of the build. The mkarchiso
      # work dir is not cached on purpose (it is rebuilt every time and is huge).
      # Bump v1 -> v2 in both keys below to throw the cache away.
      - name: Restore pacman package cache
        id: pacman-cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-v1-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            pacman-pkg-v1-

      - name: Install Base Build Dependencies
        run: |
          pacman -Syu --noconfirm archiso mkinitcpio-archiso git squashfs-tools grub syslinux python lua pacman-contrib

      - name: Install patch helper
        run: |
          # sedx [-o] FILE SED_EXPR : like `sed -i`, but FAILS if nothing changed
          # (-o = only warn). Stops silent no-op patches when upstream drifts.
          cat > /usr/local/bin/sedx <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          opt=0
          if [ "${1:-}" = "-o" ]; then opt=1; shift; fi
          f="$1"; e="$2"
          if [ ! -f "$f" ]; then echo "PATCH FAIL: missing file: $f" >&2; exit 1; fi
          before=$(sha256sum "$f" | cut -d' ' -f1)
          sed -i -e "$e" "$f"
          after=$(sha256sum "$f" | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then
            if [ "$opt" = 1 ]; then echo "::warning::sedx: no change from '$e' in $f"; exit 0; fi
            echo "PATCH FAIL: '$e' changed nothing in $f" >&2
            exit 1
          fi
          SH
          chmod +x /usr/local/bin/sedx

      - name: Clone Upstream CachyOS Repo
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || env.UPSTREAM_PIN }}
        run: |
          set -euo pipefail
          rm -rf cachyos
          if [ -n "$UPSTREAM_REF" ]; then
            git init -q cachyos
            git -C cachyos remote add origin https://github.com/CachyOS/CachyOS-Live-ISO.git
            git -C cachyos fetch --depth 1 origin "$UPSTREAM_REF"
            git -C cachyos checkout -q FETCH_HEAD
          else
            git clone --depth 1 https://github.com/CachyOS/CachyOS-Live-ISO.git cachyos
            echo "::notice::Upstream is NOT pinned. Set UPSTREAM_PIN to the SHA below to pin it."
          fi
          sha=$(git -c safe.directory='*' -C cachyos rev-parse HEAD)
          echo "Upstream CachyOS-Live-ISO commit: $sha"
          echo "Upstream commit: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize CachyOS Keyring and Repositories
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          printf '\n[cachyos]\nSigLevel = Required DatabaseOptional\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' >> /etc/pacman.conf
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          pacman -Syu --noconfirm
          pacman -S --noconfirm cachyos-keyring
          pacman-key --populate cachyos
          pacman -Syu --noconfirm

      - name: Create Non-Root Builder User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p cachyos/out
          chown -R builder:builder cachyos

      # ------------------------------------------------------------------
      # PATCHES START HERE
      # ------------------------------------------------------------------
      - name: Patch Package List
        env:
          KEEP_INSTALLER: ${{ github.event_name != 'workflow_dispatch' || inputs.keep_installer }}
        run: |
          set -euo pipefail
          PKG_LIST="cachyos/archiso/packages_desktop.x86_64"
          [ -f "$PKG_LIST" ] || { echo "PATCH FAIL: $PKG_LIST not found" >&2; exit 1; }

          ADD=(
            hyprland hyprlock hyprpolkitagent
            xdg-desktop-portal-hyprland xdg-desktop-portal-gtk
            waybar wofi mako grim slurp wl-clipboard
            qt5-wayland qt6-wayland greetd greetd-tuigreet
            bluez bluez-utils
            swaybg brightnessctl otf-font-awesome
            kitty fish fastfetch brave-bin nano
            cliphist libnotify
            # xdg-*: creates ~/Documents ~/Downloads; xdg-open for thunar/brave
            xdg-user-dirs xdg-utils
            # thunar: file manager (gvfs = trash/mounts, tumbler = thumbnails)
            thunar thunar-archive-plugin gvfs tumbler
            # python: bar helpers (workspace buttons, popup placement) and the wallpaper generator
            python
            # hypridle: auto-dim/blank/suspend
            hypridle
            # wl-clip-persist: clipboard survives the source app closing
            wl-clip-persist
            # swappy: annotate grim screenshots
            swappy
            # libpulse: pactl, used by the volume popup (volume-popup.py)
            libpulse
            # mousepad: lightweight GUI text editor
            mousepad
            # imv: image viewer for ~/screenshots
            imv
            # btop: system monitor
            btop
            # file-roller: archive manager (used by thunar-archive-plugin)
            file-roller
            # nm-connection-editor: optional WiFi/Ethernet GUI (the bar opens nmtui instead)
            nm-connection-editor
            # zenity: first-run shortcuts popup
            zenity
            # curl: first-boot timezone autodetect
            curl
            # noto-fonts-emoji: emoji glyphs (biggest single addition, ~8 MB)
            noto-fonts-emoji
            # matugen: Material You colours from a wallpaper (Super+P)
            matugen
            # inter-font: UI font (~15 MB). wqy-microhei: small CJK font so Chinese text shows (~5 MB)
            inter-font wqy-microhei
            # rsync: updateos copies a new version of the system over the running one
            rsync
            # wifi popup (wifi-popup.py): GTK3 + layer-shell bindings
            gtk3 gtk-layer-shell python-gobject
          )

          REMOVE=(
            firefox cachyos-hello cachyos-kde-settings
            plasma-desktop plasma-workspace plasma-nm plasma-pa
            plasma-integration plasma-thunderbolt plasma-login-manager
            kde-gtk-config kinfocenter kscreen bluedevil breeze-gtk
            polkit-kde-agent dolphin konsole kate kcalc spectacle
            partitionmanager kxkb2locale1
            gparted gpart clonezilla partclone partimage testdisk
            ddrescue fatresize cloud-init open-vm-tools qemu-guest-agent
            virtualbox-guest-utils spice-vdagent hyperv
            darkhttpd bind dnsmasq lftp lynx irssi nmap tcpdump
            traceroute ndisc6 inetutils lsof mc smartmontools nvme-cli
            sdparm sg3_utils lsscsi dmidecode hwinfo usbmuxd wvdial
            gcc fakeroot paru refind os-prober ntp avahi nss-mdns
            bolt pcsclite occt linux-atm wireless_tools net-tools
            imwheel libwnck3 xdg-user-dirs-gtk rxvt-unicode-terminfo
            inotify-tools ethtool cachyos-fish-config
            linux-firmware-marvell b43-fwcutter vim
            bcachefs-tools f2fs-tools jfsutils nilfs-utils dmraid
            noto-fonts-cjk opendesktop-fonts openvpn vpnc rp-pppoe xl2tpd
            modemmanager mobile-broadband-provider-info usb_modeswitch
            linux-cachyos-lts linux-cachyos-lts-zfs linux-cachyos-lts-nvidia-open
            linux-cachyos-zfs zfs-utils
            nautilus
          )
          if [ "$KEEP_INSTALLER" != "true" ]; then
            REMOVE+=( cachyos-calamares-next cachyos-cli-installer-new )
          fi
          echo "KEEP_INSTALLER=$KEEP_INSTALLER"

          # Remove first, then add, so a package in both lists ends up present.
          printf '%s\n' "${REMOVE[@]}" > /tmp/remove.txt
          grep -vxFf /tmp/remove.txt "$PKG_LIST" > /tmp/pkgs.new || true
          cp /tmp/pkgs.new "$PKG_LIST"

          for pkg in "${ADD[@]}"; do
            if ! grep -qxF "$pkg" "$PKG_LIST"; then
              echo "$pkg" >> "$PKG_LIST"
            fi
          done

          missing=0
          for pkg in hyprland pipewire pipewire-pulse wireplumber networkmanager \
              wpa_supplicant mkinitcpio mkinitcpio-archiso linux-cachyos \
              linux-cachyos-nvidia-open nvidia-utils mesa \
              xdg-desktop-portal-hyprland hyprpolkitagent bluez bluez-utils \
              brave-bin kitty thunar nano grim slurp greetd greetd-tuigreet \
              sof-firmware linux-firmware grub efibootmgr chwd polkit \
              cryptsetup lvm2 btrfs-progs e2fsprogs syslinux; do
            if ! grep -qxF "$pkg" "$PKG_LIST"; then
              echo "GUARD FAIL: '$pkg' missing from package list" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Patch util-iso.sh
        run: |
          set -euo pipefail
          UTIL=cachyos/util-iso.sh
          # 1. Swap display manager service
          sedx "$UTIL" 's|/usr/lib/systemd/system/plasmalogin\.service|/usr/lib/systemd/system/greetd.service|g'
          # 2. Replace the signing command with `true` (no signing key in CI)
          sedx "$UTIL" 's|sign_with_key \$f|true|g'

      - name: Patch linux.preset
        run: |
          set -euo pipefail
          sedx cachyos/archiso/airootfs/etc/mkinitcpio.d/linux.preset 's|linux-cachyos-lts|linux-cachyos|g'

      - name: Patch airootfs
        run: |
          set -euo pipefail
          AIROOT="cachyos/archiso/airootfs"

          # Find the live user from the Plasma login config BEFORE deleting it.
          LIVE_USER=$(grep -rhoP '^\s*User=\K\S+' \
            "$AIROOT/etc/plasmalogin.conf" "$AIROOT/etc/plasmalogin.conf.d" 2>/dev/null \
            | head -n1 || true)
          LIVE_USER=${LIVE_USER:-liveuser}
          echo "Live user for autologin: $LIVE_USER"
          if [ -f "$AIROOT/etc/passwd" ] && ! grep -q "^${LIVE_USER}:" "$AIROOT/etc/passwd"; then
            echo "::warning::User '$LIVE_USER' not found in airootfs/etc/passwd; autologin may fail."
          fi

          rm -f  "$AIROOT/etc/plasmalogin.conf"
          rm -rf "$AIROOT/etc/plasmalogin.conf.d"
          rm -f  "$AIROOT/etc/pacman.d/hooks/90-cachyos-live-kwin-keyboard.hook"
          rm -f  "$AIROOT/etc/modules-load.d/zfs.conf"
          rm -f  "$AIROOT/etc/modprobe.d/broadcom-wl.conf"
          rm -f  "$AIROOT/etc/skel/.config/kded5rc"
          rm -f  "$AIROOT/etc/skel/.config/kscreenlockerrc"
          rm -f  "$AIROOT/etc/skel/.config/kwalletrc"
          rm -f  "$AIROOT/etc/skel/.config/plasma-welcomerc"
          rm -f  "$AIROOT/etc/skel/.config/powerdevilrc"
          rm -f  "$AIROOT/etc/skel/.config/powermanagementprofilesrc"
          rm -rf "$AIROOT/etc/skel/.config/systemd/user/plasma-login-kwin_wayland.service.d"

          # Session launcher: prefer start-hyprland (newer Hyprland), else the bare binary.
          # Run via `sh <file>` so it needs no executable bit (archiso doesn't keep modes).
          mkdir -p "$AIROOT/etc/greetd"
          cat > "$AIROOT/etc/greetd/hypr-session.sh" <<'SESSION'
          #!/bin/sh
          # Hyprland 0.57+ only reads ~/.config/hypr/hyprland.lua. If the live user's
          # home exists before /etc/skel is applied, Hyprland writes its own stock
          # hyprland.lua (kitty/dolphin wizard, no bar). Copy our defaults in when
          # the file is missing, or when it is that stock example.
          LUA="$HOME/.config/hypr/hyprland.lua"
          if [ ! -f "$LUA" ] || grep -q 'This is an example Hyprland Lua config' "$LUA" 2>/dev/null; then
            mkdir -p "$HOME"
            rm -f "$LUA"
            cp -rn /etc/skel/. "$HOME"/ 2>/dev/null || true
          fi
          if command -v start-hyprland >/dev/null 2>&1; then
            exec start-hyprland
          fi
          exec Hyprland
          SESSION

          cat > "$AIROOT/etc/greetd/config.toml" <<'GREETD'
          [terminal]
          vt = 1

          [initial_session]
          command = "sh /etc/greetd/hypr-session.sh"
          user = "@LIVE_USER@"

          [default_session]
          command = 'tuigreet --time --remember --cmd "sh /etc/greetd/hypr-session.sh"'
          user = "greeter"
          GREETD
          sed -i "s/@LIVE_USER@/${LIVE_USER}/" "$AIROOT/etc/greetd/config.toml"

          # ---- Hyprland "rice" (waybar, kitty, fish, wallpaper) + size trims ----
          CONF="$AIROOT/etc/skel/.config"
          mkdir -p "$CONF/hypr" "$CONF/waybar" "$CONF/kitty" "$CONF/fish" "$CONF/wofi" "$CONF/mako" "$CONF/gtk-3.0" "$CONF/gtk-4.0" "$CONF/matugen/templates" "$CONF/btop" "$CONF/BraveSoftware/Brave-Browser/Default"

          # Wallpaper: a new random one every login (wallpaper.sh). This build-time copy is only the
          # fallback for the first frame / lock screen. genwall.py is pure python.
          mkdir -p "$AIROOT/usr/share/cachyos-hyprland"
          cat > "$AIROOT/usr/share/cachyos-hyprland/genwall.py" <<'PYGEN'
          #!/usr/bin/env python3
          """Random dark wallpaper (pure python, no dependencies).

          usage: genwall.py png OUT.png [--style glow|aurora|mesh] [--seed N] [--size WxH]

          Three looks (picked at random unless --style is given):
            glow    soft coloured light blobs on a dark gradient
            aurora  flowing ribbons of light
            mesh    smooth multi-colour gradient, gently warped
          Colours come from a random colour harmony, so they always go together. A light vignette
          and fine grain stop colour banding when the picture is scaled up.
          The seed is the current time unless --seed is given, so every run is different. The file
          is written next to its destination and moved over the old one: the old picture is deleted
          and only one copy ever exists.
          """
          import colorsys, math, os, random, struct, sys, time, zlib

          W, H = 512, 288   # small on purpose: fast to make; smooth pictures scale up cleanly


          def hsv(h, s, v):
              return [255.0 * c for c in colorsys.hsv_to_rgb(h % 1.0, min(1.0, max(0.0, s)), min(1.0, max(0.0, v)))]


          def palette(rnd):
              """(background colour, [accent colours]) from a random colour harmony."""
              hue = rnd.random()
              offsets = rnd.choice([
                  (0.0, 0.06, -0.06, 0.12),        # analogous: neighbours
                  (0.0, 0.5, 0.04, 0.46),          # complementary
                  (0.0, 0.333, 0.667, 0.05),       # triadic
                  (0.0, 0.42, 0.58, 0.08),         # split complementary
              ])
              bg = hsv(hue, rnd.uniform(0.45, 0.75), rnd.uniform(0.045, 0.09))
              accents = [hsv(hue + o, rnd.uniform(0.40, 0.80), rnd.uniform(0.60, 0.98)) for o in offsets]
              rnd.shuffle(accents)
              return bg, accents


          def mix(a, b, t):
              return [a[i] + (b[i] - a[i]) * t for i in range(3)]


          def style_glow(rnd, w, h):
              bg, accents = palette(rnd)
              top = mix(bg, accents[0], 0.07)
              blobs = []
              for i in range(rnd.randint(4, 6)):
                  col = accents[i % len(accents)]
                  cx, cy = rnd.uniform(0.05, 0.95), rnd.uniform(0.05, 0.95)
                  rx, ry = rnd.uniform(0.10, 0.30), rnd.uniform(0.10, 0.34)
                  s = rnd.uniform(0.40, 0.85)
                  ex = [s * math.exp(-((x / w - cx) * w / h) ** 2 / (2 * rx * rx)) for x in range(w)]
                  ey = [math.exp(-(y / h - cy) ** 2 / (2 * ry * ry)) for y in range(h)]
                  blobs.append((col, ex, ey))
              for y in range(h):
                  row = []
                  base = mix(top, bg, y / (h - 1))
                  for x in range(w):
                      r, g, b = base
                      for col, ex, ey in blobs:
                          k = ex[x] * ey[y]
                          r += (col[0] - r) * k
                          g += (col[1] - g) * k
                          b += (col[2] - b) * k
                      row.append((r, g, b))
                  yield row


          def style_aurora(rnd, w, h):
              bg, accents = palette(rnd)
              ribbons = []
              for i in range(rnd.randint(3, 4)):
                  ribbons.append((
                      accents[i % len(accents)],
                      rnd.uniform(0.25, 0.75),               # centre line height
                      rnd.uniform(0.05, 0.14),               # wave size
                      rnd.uniform(1.0, 2.6), rnd.uniform(0, 6.28),    # wave 1: frequency, phase
                      rnd.uniform(2.5, 5.0), rnd.uniform(0, 6.28),    # wave 2
                      rnd.uniform(0.045, 0.10),              # thickness
                      rnd.uniform(0.5, 1.0),                 # brightness
                      rnd.uniform(0.8, 2.0), rnd.uniform(0, 6.28),    # slow brightness change along x
                  ))
              cols = []
              for (col, cy, amp, f1, p1, f2, p2, th, br, fb, pb) in ribbons:
                  centre, bright = [], []
                  for x in range(w):
                      t = x / w
                      centre.append(cy + amp * math.sin(f1 * 6.283 * t + p1) + amp * 0.4 * math.sin(f2 * 6.283 * t + p2))
                      bright.append(br * (0.55 + 0.45 * math.sin(fb * 6.283 * t + pb)))
                  cols.append((col, centre, bright, th))
              for y in range(h):
                  v = y / h
                  base = mix(mix(bg, accents[0], 0.05), bg, v)
                  row = []
                  for x in range(w):
                      r, g, b = base
                      for col, centre, bright, th in cols:
                          d = (v - centre[x]) / th
                          if d > 3.2 or d < -3.2:
                              continue
                          # sharper on the lower edge, soft glow upwards: like a curtain of light
                          k = math.exp(-d * d * (0.9 if d > 0 else 0.35)) * bright[x] * 0.8
                          r += (col[0] - r) * k
                          g += (col[1] - g) * k
                          b += (col[2] - b) * k
                      row.append((r, g, b))
                  yield row


          def style_mesh(rnd, w, h):
              bg, accents = palette(rnd)
              corners = [mix(bg, accents[i % len(accents)], rnd.uniform(0.35, 0.75)) for i in range(4)]
              wa, wb = rnd.uniform(1.0, 2.2), rnd.uniform(1.0, 2.2)
              pa, pb = rnd.uniform(0, 6.28), rnd.uniform(0, 6.28)
              amp = rnd.uniform(0.10, 0.22)
              for y in range(h):
                  v = y / (h - 1)
                  row = []
                  for x in range(w):
                      u = x / (w - 1)
                      uu = min(1.0, max(0.0, u + amp * math.sin(wa * 6.283 * v + pa)))
                      vv = min(1.0, max(0.0, v + amp * math.sin(wb * 6.283 * u + pb)))
                      uu = uu * uu * (3 - 2 * uu)     # smoothstep: no visible grid lines
                      vv = vv * vv * (3 - 2 * vv)
                      top = mix(corners[0], corners[1], uu)
                      bot = mix(corners[2], corners[3], uu)
                      c = mix(top, bot, vv)
                      row.append((c[0] * 0.55, c[1] * 0.55, c[2] * 0.55))   # keep it dark: it is a desktop
                  yield row


          STYLES = {"glow": style_glow, "aurora": style_aurora, "mesh": style_mesh}


          def render(seed, style=None, w=W, h=H):
              rnd = random.Random(seed)
              name = style if style in STYLES else rnd.choice(sorted(STYLES))
              grain = [rnd.uniform(-2.6, 2.6) for _ in range(4096)]
              raw = bytearray()
              cx, cy = (w - 1) / 2.0, (h - 1) / 2.0
              for y, row in enumerate(STYLES[name](rnd, w, h)):
                  raw.append(0)
                  dy = (y - cy) / cy
                  for x, (r, g, b) in enumerate(row):
                      dx = (x - cx) / cx
                      vig = 1.0 - 0.30 * max(0.0, (dx * dx + dy * dy) / 2.0)   # darker towards the corners
                      n = grain[(x * 31 + y * 17) & 4095]
                      raw += bytes((min(255, max(0, int(r * vig + n))),
                                    min(255, max(0, int(g * vig + n))),
                                    min(255, max(0, int(b * vig + n)))))

              def chunk(t, d):
                  c = struct.pack(">I", len(d)) + t + d
                  return c + struct.pack(">I", zlib.crc32(t + d) & 0xFFFFFFFF)

              return (b"\x89PNG\r\n\x1a\n"
                      + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                      + chunk(b"IDAT", zlib.compress(bytes(raw), 6))
                      + chunk(b"IEND", b""))


          def write_atomic(path, data):
              os.makedirs(os.path.dirname(os.path.abspath(path)), exist_ok=True)
              tmp = path + ".tmp"
              with open(tmp, "wb") as f:
                  f.write(data)
              os.replace(tmp, path)


          def main():
              a = sys.argv[1:]
              if len(a) < 2 or a[0] != "png":
                  sys.exit(__doc__)
              out, seed, style, w, h = a[1], time.time_ns(), None, W, H
              i = 2
              try:
                  while i < len(a):
                      if a[i] == "--seed":
                          seed = int(a[i + 1])
                      elif a[i] == "--style" and a[i + 1] in STYLES:
                          style = a[i + 1]
                      elif a[i] == "--size":
                          w, h = (int(n) for n in a[i + 1].lower().split("x"))
                      else:
                          raise ValueError(a[i])
                      i += 2
              except (ValueError, IndexError):
                  sys.exit(__doc__)
              write_atomic(out, render(seed, style, w, h))


          if __name__ == "__main__":
              main()
