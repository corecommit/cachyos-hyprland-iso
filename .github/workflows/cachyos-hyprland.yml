          cat > "$CONF/hypr/brave-wall.sh" <<'BRAVEWALLSH'
          #!/bin/sh
          # New random picture for Brave's new tab page. Replaces every picture in the folder.
          D="$HOME/.config/BraveSoftware/Brave-Browser/Default/sanitized_background_images"
          GEN=/usr/share/cachyos-hyprland/genwall.py
          mkdir -p "$D"
          found=0
