          cat > "$CONF/hypr/clipboard.sh" <<'CLIPBOARDSH'
          #!/bin/sh
          # Super+C: toggle the clipboard history popup.
          if pkill -f 'clipboard-popup.py'; then exit 0; fi
          LIB=/usr/lib/libgtk-layer-shell.so
          [ -e "$LIB" ] || LIB=$(ls /usr/lib/libgtk-layer-shell.so* 2>/dev/null | head -n1)
          LD_PRELOAD="$LIB" exec python3 "$HOME/.config/hypr/clipboard-popup.py"
