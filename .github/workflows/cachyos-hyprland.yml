          cat > "$CONF/hypr/ws-watch.sh" <<'WSWATCH'
          #!/bin/sh
          # One tiny listener: when a workspace/window event happens, tell waybar (signal 8)
          # to refresh the workspace buttons. Needs socat.
          sock="$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket2.sock"
          sleep 3
          socat -U - "UNIX-CONNECT:$sock" | while read -r line; do
            case "$line" in
