          cat > "$CONF/hypr/tz-prompt.sh" <<'TZPROMPT'
          #!/bin/sh
          # Timezone picker under the clock. Type to filter the list, Enter to apply, Esc to cancel.
          notify() { command -v notify-send >/dev/null 2>&1 && notify-send -t 4000 "$@"; return 0; }

          W=650; H=400
          pos=$(sh "$HOME/.config/hypr/popup-pos.sh" "$W" "$H" 2>/dev/null)
          set -- $pos
          X=${1:-20}; Y=${2:-46}

          wofi_pick() { # $1 = prompt, $2 = height, optional extra flags after
            p=$1; h=$2; shift 2
            wofi --dmenu --insensitive --cache-file /dev/null --hide-scroll --prompt "$p" \
              --width "$W" --height "$h" --location center "$@"
          }

          ZONES="Pacific/Midway|Midway
          Pacific/Honolulu|Honolulu, Hawaii
          America/Anchorage|Anchorage, Alaska
          America/Los_Angeles|Los Angeles, Vancouver
          America/Denver|Denver, Calgary
          America/Phoenix|Phoenix
          America/Chicago|Chicago, Dallas
          America/Mexico_City|Mexico City
          America/New_York|New York, Toronto
          America/Bogota|Bogota, Lima
          America/Caracas|Caracas
          America/Halifax|Halifax
          America/St_Johns|St. John's, Newfoundland
          America/Sao_Paulo|Sao Paulo, Brazil
          America/Argentina/Buenos_Aires|Buenos Aires
          Atlantic/Azores|Azores
          Atlantic/Reykjavik|Reykjavik
          UTC|UTC
          Europe/London|London, Dublin
          Europe/Lisbon|Lisbon
          Europe/Paris|Paris, Berlin, Madrid, Rome
          Africa/Lagos|Lagos
          Africa/Cairo|Cairo
          Africa/Johannesburg|Johannesburg
          Europe/Athens|Athens, Helsinki, Kyiv
          Europe/Istanbul|Istanbul
          Europe/Moscow|Moscow
          Africa/Nairobi|Nairobi
          Asia/Riyadh|Riyadh, Baghdad
          Asia/Tehran|Tehran
          Asia/Dubai|Dubai, Abu Dhabi
          Asia/Kabul|Kabul
          Asia/Karachi|Karachi, Tashkent
          Asia/Kolkata|Kolkata, Mumbai, Delhi
          Asia/Kathmandu|Kathmandu
          Asia/Dhaka|Dhaka
          Asia/Yangon|Yangon
          Asia/Bangkok|Bangkok, Jakarta, Hanoi
          Asia/Shanghai|Beijing, Shanghai
          Asia/Singapore|Singapore, Kuala Lumpur
          Asia/Hong_Kong|Hong Kong
          Asia/Manila|Manila
          Australia/Perth|Perth
          Asia/Tokyo|Tokyo
          Asia/Seoul|Seoul
          Australia/Darwin|Darwin
          Australia/Adelaide|Adelaide
          Australia/Brisbane|Brisbane
          Australia/Sydney|Sydney, Melbourne
          Pacific/Noumea|Noumea
          Pacific/Auckland|Auckland, Wellington
          Pacific/Fiji|Fiji
          Pacific/Tongatapu|Tonga
          Pacific/Kiritimati|Kiritimati"

          list=$(printf '%s\n' "$ZONES" | while IFS='|' read -r z label; do
            [ -f "/usr/share/zoneinfo/$z" ] || continue
            off=$(TZ=$z date +%z)
            printf '%s|UTC%s:%s   %s   %s  (%s)\n' "$off" "${off%??}" "${off#???}" \
              "$(TZ=$z date +%H:%M)" "$label" "$z"
          done | sort -t'|' -k1,1n -s | cut -d'|' -f2-)

          choice=$(printf 'Custom offset…\n%s\n' "$list" | wofi_pick "Timezone" "$H") || exit 0
          [ -n "$choice" ] || exit 0

          zone=""
          case "$choice" in
            "Custom offset…")
              raw=$(printf '' | wofi_pick "UTC offset, e.g. 5:30" 100 --exec-search) || exit 0
              raw=$(printf '%s' "$raw" | tr -d '[:space:]')
              [ -n "$raw" ] || exit 0
              case "$raw" in *..*) notify "Invalid timezone" "$raw"; exit 1 ;; esac

              case "$raw" in
                */*|UTC) [ -f "/usr/share/zoneinfo/$raw" ] && zone="$raw" ;;
              esac

              if [ -z "$zone" ]; then
                o=${raw#[Uu][Tt][Cc]}; o=${o#[Gg][Mm][Tt]}
                sign=+
                case "$o" in -*) sign=-; o=${o#-} ;; +*) o=${o#+} ;; esac
                case "$o" in
                  *.5)  o="${o%.5}:30" ;;
                  *.75) o="${o%.75}:45" ;;
                esac
                h=${o%%:*}; m=00
                case "$o" in *:*) m=${o#*:} ;; esac
                case "$h$m" in
                  ''|*[!0-9]*) notify "Invalid timezone" "Use 5:30, 5, -8 or a name like Asia/Kolkata"; exit 1 ;;
                esac
                [ -n "$h" ] || { notify "Invalid timezone" "Missing hour"; exit 1; }
                h=$(printf '%s' "$h" | sed 's/^0*//'); h=${h:-0}
                m=$(printf '%s' "$m" | sed 's/^0*//'); m=${m:-0}
                limit=14; [ "$sign" = - ] && limit=12
                [ "$h" -le "$limit" ] || { notify "Invalid timezone" "Offsets go from -12 to +14"; exit 1; }
                case "$m" in
                  0) if [ "$h" -eq 0 ]; then zone=Etc/UTC
                    elif [ "$sign" = + ]; then zone="Etc/GMT-$h"
                    else zone="Etc/GMT+$h"; fi ;;
                  30|45)
                    case "$sign$h:$m" in
                      +3:30) zone=Asia/Tehran ;;      +4:30) zone=Asia/Kabul ;;
                      +5:30) zone=Asia/Kolkata ;;     +5:45) zone=Asia/Kathmandu ;;
                      +6:30) zone=Asia/Yangon ;;      +8:45) zone=Australia/Eucla ;;
                      +9:30) zone=Australia/Darwin ;; +10:30) zone=Australia/Lord_Howe ;;
                      +12:45) zone=Pacific/Chatham ;; -3:30) zone=America/St_Johns ;;
                      -9:30) zone=Pacific/Marquesas ;;
                    esac ;;
                esac
              fi ;;
            *)
              zone=$(printf '%s' "$choice" | sed -n 's/.*(\([^()]*\))[[:space:]]*$/\1/p') ;;
          esac

          if [ -z "$zone" ] || [ ! -f "/usr/share/zoneinfo/$zone" ]; then
            notify "No timezone for that input" "Pick one from the list or try Asia/Kolkata"
            exit 1
          fi

          err=$(sudo -n timedatectl set-timezone "$zone" 2>&1) \
            || err=$(timedatectl set-timezone "$zone" 2>&1) \
            || err=$(pkexec timedatectl set-timezone "$zone" 2>&1)
          if [ $? -eq 0 ]; then
            touch "$HOME/.config/hypr/.tz-set-done"
            notify "Timezone set" "$zone"
            setsid -f sh -c 'pkill -x waybar; while pgrep -x waybar >/dev/null; do sleep 0.1; done; exec waybar' >/dev/null 2>&1
          else
            notify "Could not set timezone" "${err:-$zone}"
          fi
          TZPROMPT

