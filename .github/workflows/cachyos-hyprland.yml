          cat > "$CONF/hypr/palette.sh" <<'WBPALETTE'
          #!/bin/sh
          # Command palette (Super+Shift+Space).
          # Type to filter (fuzzy), Enter to run. Recently used entries float to the top.
          # To add a command: add a line to the list and a matching case below.
          HIST="${XDG_CACHE_HOME:-$HOME/.cache}/palette-history"
          mkdir -p "$(dirname "$HIST")"
          touch "$HIST"

          notify() { command -v notify-send >/dev/null 2>&1 && notify-send -t 2500 "$@"; return 0; }
          menu()   { wofi --dmenu --insensitive --matching fuzzy --cache-file /dev/null "$@"; }
          term()   { exec kitty -e "$@"; }
          # Adds an icon in front of each entry (stripped again after the choice).
          decorate() {
            while IFS= read -r line; do
              case "${line%%:*}" in
                App) g="" ;;
                Window) g="" ;;
                Screenshot) g="" ;;
                Clipboard) g="" ;;
                Audio) g="" ;;
                Display) g="" ;;
                Network) g="" ;;
                Bluetooth) g="" ;;
                Hyprland) g="" ;;
                System) g="" ;;
                *) g="" ;;
              esac
              printf '%s  %s\n' "$g" "$line"
            done
          }

          ALL=$(printf '%s\n' \
            "App: Search all applications" \
            "App: Terminal" \
            "App: Files" \
            "App: Browser" \
            "Window: Toggle floating" \
            "Window: Toggle fullscreen" \
            "Window: Close" \
            "Screenshot: area to clipboard" \
            "Screenshot: area to file" \
            "Screenshot: full screen to file" \
            "Clipboard: History" \
            "Clipboard: Clear history" \
            "Audio: Toggle mute" \
            "Audio: Toggle microphone mute" \
            "Audio: Volume up" \
            "Audio: Volume down" \
            "Audio: Set volume to 100%" \
            "Display: Brightness up" \
            "Display: Brightness down" \
            "Network: Wi-Fi and connections" \
            "Network: Toggle Wi-Fi" \
            "Network: Show IP address" \
            "Bluetooth: Open bluetoothctl" \
            "Bluetooth: Toggle power" \
            "Hyprland: Reload config" \
            "Hyprland: Show config errors" \
            "Hyprland: Edit config" \
            "Hyprland: Show keybinds" \
            "Hyprland: Restart waybar" \
            "System: System info" \
            "System: Change Keyboard Layout" \
            "System: Wallpaper theme (matugen)" \
            "System: Power menu" \
            "System: Lock screen" \
            "System: Suspend" \
            "System: Log out" \
            "System: Reboot" \
            "System: Shut down")

          # Last 6 distinct choices first, then everything else (no duplicates).
          RECENT=$(tac "$HIST" | awk '!seen[$0]++' | head -n 6)
          LIST=$(printf '%s\n%s\n' "$RECENT" "$ALL" | awk 'NF && !seen[$0]++')

          choice=$(printf '%s\n' "$LIST" | decorate | menu --prompt "Search commands" --width 560 --height 460)
          [ -n "$choice" ] || exit 0
          choice=$(printf '%s' "$choice" | sed 's/^[^ ]*  //')

          # Remember the choice (only if it is a known entry), keep the file short.
          if printf '%s\n' "$ALL" | grep -qxF "$choice"; then
            printf '%s\n' "$choice" >> "$HIST"
            tail -n 50 "$HIST" > "$HIST.tmp" && mv "$HIST.tmp" "$HIST"
          fi

          case "$choice" in
            "App: Search all applications") exec wofi --show drun --prompt "Search apps" ;;
            "App: Terminal") exec kitty ;;
            "App: Files") exec thunar ;;
            "App: Browser") exec brave ;;
            "Window: Toggle floating") hyprctl dispatch 'hl.dsp.window.float({ action = "toggle" })' ;;
            "Window: Toggle fullscreen") hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = "fullscreen", action = "toggle" })' ;;
            "Window: Close") hyprctl dispatch 'hl.dsp.window.close()' ;;
            "Screenshot: area to clipboard")
              sleep 0.3
              grim -g "$(slurp)" - | wl-copy && notify "Screenshot" "Copied to clipboard"
              ;;
            "Screenshot: area to file")
              sleep 0.3
              mkdir -p "$HOME/screenshots"
              f="$HOME/screenshots/shot-$(date +%Y%m%d-%H%M%S).png"
              grim -g "$(slurp)" "$f" && notify "Screenshot saved" "$f"
              ;;
            "Screenshot: full screen to file")
              sleep 0.3
              mkdir -p "$HOME/screenshots"
              f="$HOME/screenshots/shot-$(date +%Y%m%d-%H%M%S).png"
              grim "$f" && notify "Screenshot saved" "$f"
              ;;
            "Clipboard: History") exec sh "$HOME/.config/hypr/clipboard.sh" ;;
            "Clipboard: Clear history") cliphist wipe && notify "Clipboard" "History cleared" ;;
            "Audio: Toggle mute") wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle ;;
            "Audio: Toggle microphone mute") wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle ;;
            "Audio: Volume up") wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ ;;
            "Audio: Volume down") wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- ;;
            "Audio: Set volume to 100%") wpctl set-volume @DEFAULT_AUDIO_SINK@ 1.0 ;;
            "Display: Brightness up") brightnessctl set 5%+ ;;
            "Display: Brightness down") brightnessctl set 5%- ;;
            "Network: Wi-Fi and connections") exec sh "$HOME/.config/hypr/wifi.sh" ;;
            "Network: Toggle Wi-Fi")
              if nmcli radio wifi | grep -q '^enabled'; then
                nmcli radio wifi off && notify "Wi-Fi" "Turned off"
              else
                nmcli radio wifi on && notify "Wi-Fi" "Turned on"
              fi
              ;;
            "Network: Show IP address")
              ip=$(ip -brief address | awk '$2 == "UP" {print $1 ": " $3}' | paste -sd ' ' -)
              notify "IP address" "${ip:-no active connection}"
              ;;
            "Bluetooth: Open bluetoothctl") term bluetoothctl ;;
            "Bluetooth: Toggle power")
              if bluetoothctl show | grep -q 'Powered: yes'; then
                bluetoothctl power off >/dev/null && notify "Bluetooth" "Turned off"
              else
                bluetoothctl power on >/dev/null && notify "Bluetooth" "Turned on"
              fi
              ;;
            "Hyprland: Reload config") hyprctl reload ;;
            "Hyprland: Show config errors") term sh -c 'hyprctl configerrors; echo; read -r _' ;;
            "Hyprland: Edit config") term nano "$HOME/.config/hypr/hyprland.lua" ;;
            "Hyprland: Show keybinds") term less "$HOME/.config/hypr/hyprland.lua" ;;
            "Hyprland: Restart waybar") pkill -x waybar; sleep 0.3; exec waybar ;;
            "System: System info") term sh -c 'fastfetch; echo; read -r _' ;;
            "System: Change Keyboard Layout") exec sh "$HOME/.config/hypr/kb-menu.sh" ;;
            "System: Wallpaper theme (matugen)") exec sh "$HOME/.config/hypr/theme.sh" ;;
            "System: Power menu") exec sh "$HOME/.config/hypr/power.sh" ;;
            "System: Lock screen") exec hyprlock ;;
            "System: Suspend") systemctl suspend ;;
            "System: Log out") hyprctl dispatch 'hl.dsp.exit()' ;;
            "System: Reboot") systemctl reboot ;;
            "System: Shut down") systemctl poweroff ;;
          esac
          WBPALETTE

